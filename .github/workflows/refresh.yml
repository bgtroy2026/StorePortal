name: Nightly refresh

on:
  schedule:
    # SAFETY NET ONLY — the primary trigger is external.
    #
    # GitHub's scheduled runs are best-effort and deprioritised under load. Measured on this repo: the runs due
    # at 10:15 UTC actually started at 13:36, 14:23 and 16:22 UTC on 12-14 Sep — three to six hours late, i.e.
    # mid-morning to lunchtime Central, for a portal whose whole promise is "open it and see yesterday".
    #
    # So since 2026-09-15 a scheduled task on Troy's Mac calls workflow_dispatch at 10:20 UTC instead, and it
    # skips the dispatch if a run already went today. This cron is the fallback for when that does not happen
    # (Mac offline, token expired) — deliberately late enough that it does not race the primary, and it is
    # harmless if both fire because the concurrency group serialises them.
    #
    # 14:40 UTC = 9:40 AM CDT / 8:40 AM CST — still before most people would give up on the data being fresh.
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Force full backfill window"
        type: boolean
        default: false
      mock:
        description: "Use mock data instead of the APIs (demo/testing)"
        type: boolean
        default: false
      diag:
        description: "Only run the connectivity diagnostics (MarginEdge + Toast)"
        type: boolean
        default: false
      incremental_days:
        description: "Re-pull this many days even where the warehouse already has them (blank = settings default, 7). Use to heal history after a transform fix."
        type: string
        default: ""
      build_only:
        description: "Rebuild and republish the site from the stored warehouse — no API pulls (use for code/design changes)"
        type: boolean
        default: false
      source:
        description: "Limit the pull to one source (lets Toast be re-pulled without restarting MarginEdge)"
        type: choice
        default: all
        options: [all, toast, marginedge, tripleseat, scorecard]

permissions:
  contents: write     # release asset (warehouse state)
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

# Two jobs, deliberately. The MarginEdge history backfill runs for hours at 1 request/second, and a single job
# would hold the publish hostage until it finished — the recent data everyone actually looks at would sit
# unbuilt behind a year of archaeology. So: pull the recent window, publish, THEN walk backwards and publish
# again. The warehouse is persisted to a release asset between jobs, so history resumes from what recent saved.
#
# The env block is repeated rather than shared via a YAML anchor: GitHub Actions does not support anchors.
jobs:
  recent:
    runs-on: ubuntu-latest
    # 350, not 90: this job also runs a Toast backfill when `backfill` is set, which is hours of paging, and a
    # 90-minute ceiling would kill it partway. The real limits are the per-source budgets in config/settings.json
    # (Toast 240 min, MarginEdge 300) — those stop cleanly and resume, whereas a job timeout just loses the work.
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PORTAL_SECRET: ${{ secrets.PORTAL_SECRET }}
      MARGINEDGE_API_KEY: ${{ secrets.MARGINEDGE_API_KEY }}
      TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
      TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
      TOAST_HOST: ${{ vars.TOAST_HOST }}
      TRIPLESEAT_CLIENT_ID: ${{ secrets.TRIPLESEAT_CLIENT_ID }}
      TRIPLESEAT_CLIENT_SECRET: ${{ secrets.TRIPLESEAT_CLIENT_SECRET }}
      TRIPLESEAT_REFRESH_TOKEN: ${{ secrets.TRIPLESEAT_REFRESH_TOKEN }}
      TRIPLESEAT_REDIRECT_URI: ${{ vars.TRIPLESEAT_REDIRECT_URI }}
      APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
      PORTAL_EPOCH: ${{ vars.PORTAL_EPOCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: MarginEdge connectivity diagnostic
        if: ${{ inputs.diag }}
        run: python -m sdp me-diag
      - name: Toast connectivity diagnostic
        if: ${{ inputs.diag }}
        run: python -m sdp toast-diag

      - name: Restore warehouse state
        if: ${{ !inputs.mock && !inputs.diag }}
        run: python -m sdp restore

      # build_only exists because a code or design change needs none of this. The warehouse is restored from
      # the release asset above, so transform and build have everything they need; pulling again just re-fetches
      # data that has not changed. Measured on run #27: pull 769s, transform 16s, build 3s — so skipping the
      # pull turns a ~27-minute deploy into about a minute.
      - name: Pull (recent window + all other sources)
        if: ${{ !inputs.mock && !inputs.diag && !inputs.build_only }}
        run: python -m sdp pull --source ${{ inputs.source || 'all' }} --phase recent ${{ inputs.backfill && '--backfill' || '' }} ${{ inputs.incremental_days && format('--incremental-days {0}', inputs.incremental_days) || '' }}

      - name: Pull (mock data)
        if: ${{ inputs.mock && !inputs.diag }}
        run: python -m sdp pull --mock

      - name: Transform into warehouse
        if: ${{ !inputs.diag }}
        run: python -m sdp transform
      # Invariant checks against the REAL warehouse. They run before the build so a contradiction is visible in
      # the run that caused it, and continue-on-error so a failed check never blocks publishing — a portal that
      # is a day stale is worse than one carrying a flagged inconsistency. The run is marked failed at the end.
      - name: Check warehouse invariants
        if: ${{ !inputs.diag }}
        id: checks
        continue-on-error: true
        run: python -m sdp check

      - name: Build site + encrypted bundles
        if: ${{ !inputs.diag }}
        run: python -m sdp build
      # Nothing was pulled in build_only mode, so there is no new state worth writing back.
      - name: Persist warehouse state
        if: ${{ !inputs.mock && !inputs.diag && !inputs.build_only }}
        run: python -m sdp persist

      - name: Sanity check (no plaintext data in the artifact)
        if: ${{ !inputs.diag }}
        run: |
          test ! -f _site/data/dev.json
          ls -la _site _site/data

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.diag }}
        with:
          path: _site
      - id: deploy
        if: ${{ !inputs.diag }}
        uses: actions/deploy-pages@v4
      # Last step in the job, deliberately: publishing must happen first. A flagged inconsistency is worth a
      # red run so it is not ignored, but it is not worth withholding the day's numbers from six taprooms.
      - name: Fail the run if an invariant check failed
        if: ${{ !inputs.diag && steps.checks.outcome == 'failure' }}
        run: |
          echo "::error::Warehouse invariant checks failed — the site published, but a figure is inconsistent. See the 'Check warehouse invariants' step."
          exit 1

  history:
    needs: recent
    if: ${{ !inputs.mock && !inputs.diag && !inputs.build_only && (inputs.source == '' || inputs.source == 'all' || inputs.source == 'marginedge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PORTAL_SECRET: ${{ secrets.PORTAL_SECRET }}
      MARGINEDGE_API_KEY: ${{ secrets.MARGINEDGE_API_KEY }}
      TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
      TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
      TOAST_HOST: ${{ vars.TOAST_HOST }}
      APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
      PORTAL_EPOCH: ${{ vars.PORTAL_EPOCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore warehouse state
        run: python -m sdp restore
      - name: Pull (history backfill)
        run: python -m sdp pull --source marginedge --phase history ${{ inputs.backfill && '--backfill' || '' }}
      - name: Transform into warehouse
        run: python -m sdp transform
      - name: Build site + encrypted bundles
        run: python -m sdp build
      - name: Persist warehouse state
        run: python -m sdp persist
      - name: Sanity check (no plaintext data in the artifact)
        run: |
          test ! -f _site/data/dev.json
          ls -la _site _site/data
      # A distinct artifact name: `recent` already uploaded one called github-pages in this same run, and
      # deploy-pages refuses to guess when it finds two ("Multiple artifacts named 'github-pages'").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-history
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-history
