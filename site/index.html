<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Grove Brewery — Store Director Portal</title>
<style>
:root{
  --navy:#1b2449;--green:#94bb36;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --surface:#ffffff;--plane:#f4f5f8;--border:rgba(11,11,11,.10);--good:#006300;--bad:#d03b3b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--sx:#9a9a94;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Brandon Grotesque','Josefin Sans','Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;background:var(--plane);color:var(--ink);font-size:14px}
button{font-family:inherit}
/* ---------- login shell ---------- */
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:50;overflow:hidden}
/* Watermark, bottom-right. A watermark should sit in the room rather than in the way, so it is small, tucked
   into a corner, and faint enough to read as a mark on the surface instead of a picture on the page.
   `screen` blending drops the artwork's dark background out against the navy; the artwork's ground is a very
   dark teal rather than true black, so screen still lifts it enough to show a square edge — the radial mask
   feathers that away well before the image's own border, which is what stops it looking like a pasted tile.
   pointer-events:none so it can never eat a click on the sign-in button. */
#login::before{content:"";position:absolute;
  right:clamp(10px,4vmin,44px);bottom:clamp(10px,4vmin,44px);
  width:min(190px,30vmin);height:min(190px,30vmin);
  background:url('images/jargvis.jpg') center/contain no-repeat;
  mix-blend-mode:screen;opacity:.18;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at center, #000 30%, rgba(0,0,0,.45) 50%, transparent 68%);
          mask-image:radial-gradient(circle at center, #000 30%, rgba(0,0,0,.45) 50%, transparent 68%)}
@media (prefers-reduced-motion:no-preference){#login::before{transition:opacity .6s ease}}
.card{position:relative;z-index:1;background:#fff;border-radius:14px;padding:38px 42px;width:min(400px,calc(100vw - 40px));box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.card h1{font-size:19px;color:var(--navy);margin-bottom:4px}
.card .sub{font-size:12.5px;color:#6b7288;margin-bottom:24px}
#gbtn{display:flex;justify-content:center;min-height:44px}
#status{font-size:13px;color:#6b7288;margin-top:16px;min-height:18px;font-weight:600}
#err{color:#c0392b;font-size:12.5px;margin-top:8px;min-height:16px;font-weight:600}
.foot{margin-top:20px;font-size:10.5px;color:#9aa3c0;text-transform:uppercase;letter-spacing:.1em}
.stamp{margin-top:7px;font-size:11px;color:var(--green);font-weight:600}
.bar{height:5px;border-radius:3px;background:#e0e2ea;margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0%;background:var(--green);transition:width .2s}
/* ---------- app ---------- */
#app{display:none;min-height:100%}
header{background:var(--navy);color:#fff;padding:0 18px;display:flex;align-items:center;gap:14px;height:54px;position:sticky;top:0;z-index:10}
header .brand{font-weight:700;letter-spacing:.02em;font-size:15px}
header .brand span{color:var(--green)}
header nav{display:flex;gap:2px;margin-left:10px;overflow-x:auto}
header nav button{background:transparent;border:0;color:#c9cfe3;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
header nav button.on{background:rgba(255,255,255,.12);color:#fff}
header .who{margin-left:auto;font-size:12px;color:#c9cfe3;white-space:nowrap}
header .signout{background:transparent;border:1px solid rgba(255,255,255,.25);color:#c9cfe3;border-radius:7px;
  padding:5px 10px;margin-left:10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
header .signout:hover{background:rgba(255,255,255,.12);color:#fff}
header .who b{color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.filters label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.filters select,.filters input[type=date]{border:1px solid var(--border);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;background:#fff}
.filters .fresh{margin-left:auto;font-size:11.5px;color:var(--muted)}
main{padding:16px 18px 40px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .v{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;line-height:1.1}
.tile .d{font-size:12px;color:var(--ink2);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.tile .d .up{color:var(--good);font-weight:700}.tile .d .dn{color:var(--bad);font-weight:700}
.tile .d .tg{color:var(--muted)}
/* ---- scorecard: a workbook, not a dashboard ------------------------------------------------
   Deliberately unlike the POS pages: paper-white ground, a spreadsheet-style tab rail down the
   side rather than the portal's pill nav, denser type, and no tiles. The look should tell you at
   a glance that you are reading the company's own sheet rather than live POS numbers. */
body.sheetmode #main{background:#f2f1ec}
#usageWrap{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#usageBox{background:var(--surface);border-radius:12px;max-width:900px;width:100%;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
#usageBox h3{font-size:15px;color:var(--navy)}
#usageBox .x{float:right;background:transparent;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.wb{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.wb .rail{background:#f7f6f2;border-right:1px solid var(--border);padding:8px 0;max-height:calc(100vh - 150px);overflow-y:auto}
.wb .rail h4{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 14px 4px}
.wb .rail button{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;
  padding:7px 12px 7px 11px;font-size:12.5px;color:var(--ink2);cursor:pointer;line-height:1.25}
.wb .rail button:hover{background:#efeee8;color:var(--ink)}
.wb .rail button.on{background:var(--surface);border-left-color:var(--green);color:var(--navy);font-weight:700}
.wb .doc{padding:16px 18px;min-width:0}
.wb .doc h2{font-size:17px;color:var(--navy);margin:0 0 2px}
.wb .src{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.wb table.t{font-size:12px}
.wb table.t th{background:#f7f6f2;position:sticky;top:0;z-index:1}
.wb table.t td{border-bottom:1px solid #f0efe9}
.wb table.t tr:hover td{background:#fbfbf8}
@media(max-width:820px){.wb{grid-template-columns:1fr}.wb .rail{max-height:none;border-right:0;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
  .wb .rail h4{display:none}.wb .rail button{width:auto;border-left:0;border-radius:999px;padding:5px 10px;font-size:12px}
  .wb .rail button.on{background:var(--navy);color:#fff}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;overflow-x:auto}
.panel h3{font-size:13px;color:var(--navy);margin-bottom:2px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
/* Present but quiet: a director should notice it when they want it, not before. */
.pt{display:flex;align-items:center;gap:6px;flex:none}
.find{width:96px;border:1px solid var(--border);background:transparent;border-radius:6px;font-size:11px;
  padding:3px 7px;color:var(--ink);opacity:.45;transition:opacity .15s ease,width .15s ease}
.panel:hover .find{opacity:1}
.find:focus{opacity:1;width:150px;outline:none;border-color:var(--navy)}
.findnote{font-size:11px;margin-top:6px}
@media print{.find,.findnote{display:none}}
.csv{flex:none;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;cursor:pointer;opacity:.45;
  transition:opacity .15s ease,color .15s ease}
.panel:hover .csv{opacity:1}
.csv:hover{color:var(--navy);border-color:var(--navy)}
.csv:focus-visible{opacity:1;outline:2px solid var(--navy);outline-offset:2px}
@media print{.csv{display:none}}
.panel .hint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.panel .cw{position:relative;height:260px}
.panel .cw.tall{height:340px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--grid);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f6;white-space:nowrap}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t td.n{font-weight:700;color:var(--navy);white-space:normal;min-width:120px}
/* Name cells hold the longest text in every table (item names, vendors, events). Left on the global
   white-space:nowrap they push the table past its panel and the right-hand columns get clipped with no
   scrollbar to reach them, so they wrap instead and every table sits in an overflow-x:auto wrapper. */
.tw{overflow-x:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:44px repeat(14,1fr);gap:2px;font-size:11px}
.heat .h{color:var(--muted);text-align:center;padding:2px 0}
.heat .c{height:26px;border-radius:4px;position:relative}
.heat .c:hover::after{content:attr(data-t);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:4px 7px;border-radius:6px;white-space:nowrap;font-size:11px;z-index:5}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef0f6;color:var(--navy)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px}
.tt{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:6px 9px;border-radius:7px;font-size:11.5px;white-space:nowrap;display:none;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* ---------- phone ----------
   The blocker was navigation, not prettiness: at 390px the nav measured 771px inside a 356px box and was
   simply clipped, so Inventory, Events, Activations, Scorecard and Locations could not be reached at all.
   It now scrolls horizontally with a fade at the edge so it is visibly scrollable rather than apparently
   truncated. Everything else here is about getting to the numbers with less thumb: the filter bar was taking
   most of the first screen before a single figure appeared. */
@media (max-width:720px){
  header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:6px}
  header .who{display:none}
  header .signout{margin-left:auto}
  header .brand{font-size:13px;width:100%}

  #nav{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
       scrollbar-width:none;width:100%;gap:2px;
       -webkit-mask-image:linear-gradient(to right,#000 88%,transparent);
               mask-image:linear-gradient(to right,#000 88%,transparent)}
  #nav::-webkit-scrollbar{display:none}
  #nav button{flex:0 0 auto;white-space:nowrap}

  /* The filter bar is controls, not content: it should not own the first screen. */
  .filters{padding:8px 10px;gap:6px 8px}
  .filters label{font-size:9.5px;margin-right:0}
  .filters .seg button{padding:4px 8px;font-size:11.5px}
  .filters select,.filters input[type=date]{font-size:12px;padding:4px 7px}
  .filters .fresh{margin-left:0;width:100%;font-size:10.5px}

  main{padding:10px}
  .grid{gap:10px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
  .tile{padding:10px 12px}
  .tile .v{font-size:21px}
  .tile .l{font-size:9.5px}
  .tile .d{font-size:11px;gap:6px}
  .panel{padding:12px 12px}
  .panel .cw{height:200px}
  .cols2,.cols3{grid-template-columns:1fr}

  /* Filter and CSV are desktop-hover affordances; on a touch screen they are always-on or useless. */
  .csv,.find{opacity:1}
  .find{width:84px}
  .find:focus{width:120px}

  table.t{font-size:12px}
  table.t th,table.t td{padding:5px 6px}
  table.t td.n{min-width:96px}
}
/* ---------- v2 ---------- */
.seg button{white-space:nowrap}
.tg{color:var(--muted)}
.src{font-size:11.5px;color:var(--muted);line-height:1.45}
header nav{flex:1;min-width:0;scrollbar-width:thin}
header nav button{padding:8px 9px;font-size:12.5px}
header .brand{font-size:14px;white-space:nowrap}
.prov{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:#fff4d6;color:#8a5a00;border:1px solid #f0d48a;vertical-align:1px;cursor:help}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:#f1f1ee;padding:1px 4px;border-radius:4px}
.ackbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ackb{border:1px solid var(--border);background:#fff;color:var(--ink2);border-radius:6px;font-size:11px;font-weight:600;padding:3px 8px;cursor:pointer}
.ackb:hover{border-color:var(--navy);color:var(--navy)}
.acknote{border:1px solid var(--border);border-radius:6px;font:inherit;font-size:12px;padding:3px 7px;min-width:180px}
tr.resolved td{opacity:.55}
tr.resolved td.n{text-decoration:line-through;text-decoration-color:var(--muted)}
.fcw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.fcd{border:1px solid var(--border);border-radius:10px;padding:9px 10px;min-width:0}
.fcd.wet{background:#f2f7fd;border-color:#cfe0f5}
.fcd .fd{font-size:11.5px;font-weight:700;color:var(--navy)}
.fcd .fv{font-size:19px;font-weight:700;color:var(--navy);margin:3px 0}
.fcd .fw{font-size:11px;color:var(--ink2);line-height:1.35}
.onepager{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px 26px;max-width:900px;margin:0 auto 18px}
.onepager .oph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:8px;margin-bottom:10px}
.onepager .opt{font-size:22px;font-weight:700;color:var(--navy)}
.onepager .opl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 4px}
.onepager .opc{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.onepager .oplines{height:74px;background:repeating-linear-gradient(to bottom,transparent,transparent 23px,var(--grid) 23px,var(--grid) 24px)}
.onepager table.t td,.onepager table.t th{padding:4px 6px}
@media (max-width:720px){#nav{flex:0 0 100%;order:3}.filters .seg{max-width:100%;overflow-x:auto}.fcw{grid-template-columns:repeat(2,minmax(0,1fr))}.onepager{padding:14px}.onepager .opc{grid-template-columns:1fr}}
@media print{
  header,.filters,.noprint,.pt{display:none !important}
  body{background:#fff;font-size:11.5px} main{padding:0;max-width:none}
  .onepager{border:0;border-radius:0;padding:0;margin:0;max-width:none;page-break-after:always}
  .onepager:last-child{page-break-after:auto}
  .panel{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>

<div id="login">
 <div class="card">
  <h1>Big Grove Brewery</h1>
  <div class="sub">Store Director Portal — sign in with your company Google account</div>
  <div id="gbtn"></div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div id="status"></div>
  <div id="err"></div>
  <div class="foot">Authorized personnel only</div>
  <div class="stamp" id="stamp"></div>
 </div>
</div>

<div id="app">
 <header>
  <div class="brand">BIG GROVE <span>STORE DIRECTOR PORTAL</span></div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
  <button id="usage" class="signout" title="Portal usage" hidden>Usage</button>
  <button id="signout" class="signout" title="Sign out">Sign out</button>
 </header>
 <div class="filters" id="filters">
  <label>Location</label><select id="locSel"></select>
  <label>Range</label>
  <div class="seg" id="rangeSeg"></div>
  <input type="date" id="d0"> <span style="color:var(--muted)">to</span> <input type="date" id="d1">
  <label>Compare</label>
  <div class="seg" id="cmpSeg"><button data-c="prior" class="on">Prior period</button><button data-c="ly" title="Same weekdays a year ago (364 days back), with holidays matched to the same holiday">Last year</button></div>
  <button id="opBtn" class="ackb" title="A printable one-page week for the selected taproom" style="padding:6px 10px">Weekly one-pager</button>
  <div class="fresh" id="fresh"></div>
 </div>
 <main id="main"></main>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script>
/* =========================================================================================
   LOGIN SHELL — same protocol as the Sales Portal: Google ID token -> Apps Script -> bundle keys
   ========================================================================================= */
var CFG = {
  CLIENT_ID: '169287489700-t5en62nibhp9ttn24vfimd7k974dgl9i.apps.googleusercontent.com',
  API_URL:   'https://script.google.com/macros/s/AKfycbzaXWDdxKjR6s9n2AqDB2lePy2Gg4GxTMCmlS3bKhtTfev539hVoooSeBeC5xuFv2PBNQ/exec'
};
function $(id){return document.getElementById(id);}
function setStatus(t){$('status').textContent=t;}
function setErr(t){$('err').textContent=t;setStatus('');$('bar').style.display='none';}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
/* Publishing the site swaps index.html and the encrypted bundles as separate files, so for a few seconds
   after a deploy the new page is live while a bundle it asks for is still the old one or briefly absent.
   Signing in during that window used to hang forever on a 404, which reads to the user as "the login is
   broken" rather than "the site is mid-update". Retry a few times with backoff instead: a deploy window is
   seconds long, so waiting it out costs nothing and turns the most alarming failure mode into a short pause. */
async function fetchOnce(name){
  var r=await fetch(name,{cache:'no-store'});
  if(!r.ok) throw new Error(name+' HTTP '+r.status);
  return r;
}
async function fetchWithRetry(name){
  var waits=[900,2000,3500,5000], last=null;
  for(var a=0;a<=waits.length;a++){
    try{ return await fetchOnce(name); }
    catch(e){
      last=e;
      // A 404 or a 5xx here is almost always the deploy window; a hard network error deserves the same patience.
      if(a===waits.length) break;
      setStatus('The portal is updating — retrying…');
      await new Promise(function(r){setTimeout(r,waits[a]);});
    }
  }
  throw last;
}
async function fetchBin(name,pct0,pct1){
  var r=await fetchWithRetry(name);
  var len=+r.headers.get('Content-Length')||0,got=0,chunks=[],rd=r.body.getReader();
  for(;;){var c=await rd.read();if(c.done)break;chunks.push(c.value);got+=c.value.length;if(len)$('barfill').style.width=(pct0+(pct1-pct0)*(got/len))+'%';}
  var buf=new Uint8Array(got),o=0;for(var i=0;i<chunks.length;i++){buf.set(chunks[i],o);o+=chunks[i].length;}return buf;
}
async function decrypt(buf,keyB64){
  var key=await crypto.subtle.importKey('raw',ub64(keyB64),'AES-GCM',false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12)));
}
async function gunzipText(u8){
  if(typeof DecompressionStream!=='undefined'){return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
  await new Promise(function(res,rej){var s=document.createElement('script');s.src='vendor/pako.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return pako.ungzip(u8,{to:'string'});
}
/* Sign out. Beyond the obvious reason, this is the fix when someone's ACCESS changes: the signed-in session
   caches the bundle keys the backend handed out, so a role change (say, being granted the leadership
   scorecard) does not reach an open session until it signs in again. Google's auto-select is disabled too,
   otherwise the next page load silently signs the same account straight back in. */
function signOut(){
  try{ sessionStorage.removeItem('sdp_auth'); }catch(e){}
  try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}

var DETAIL_KEYS = {}, DETAIL = {}, DETAIL_ERR = {};
async function loadDetail(loc){

async function boot(auth){

  // per taproom they cover, plus the scorecard for admins. They are merged here rather than server-side so a
  // director's bundles stay the same files everyone else uses.

  // location id and is assigned key by key. Assigning the whole object would make the last bundle win and a
  // two-taproom director would silently see only one.
  var data=null;

/* Apps Script intermittently leaves a POST hanging for ~30 seconds and then failing, while the script itself
   runs and completes in about two. Measured repeatedly on 2026-09-15: the same call failed at 32.7s, 32.1s and
   32.0s, and succeeded at 1.5s and 0.75s minutes apart, with every execution logged Completed server-side and
   no Google incident posted. A single-shot fetch therefore drops the user on the sign-in screen often enough
   to read as "sign-in keeps failing", when waiting a couple of seconds and asking again nearly always works.
   So: a short deadline rather than the browser's long one, and three tries. Only transport failures retry —
   a real answer from the script, including a refusal, is final and must not be asked again. */
async function scriptPost(body, onRetry){
  var waits=[700,1800], last=null;
  for(var a=0;a<=waits.length;a++){
    var ctl=new AbortController();
    // 8s, not 12: a working call answers in 0.75-2.4s, so eight seconds is four times the slowest good one
    // and still leaves the worst case (three dead tries, ~27s) shorter than the single 32s hang it replaces.
    var timer=setTimeout(function(){ctl.abort();}, 8000);
    try{
      var r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                                     body:body, signal:ctl.signal});
      clearTimeout(timer);
      return r;
    }catch(e){
      clearTimeout(timer); last=e;
      if(a===waits.length) break;
      if(onRetry) onRetry(a+1);
      await new Promise(function(res){setTimeout(res,waits[a]);});
    }
  }
  throw last||new Error('sign-in service unreachable');
}
async function onCred(resp){

    });

/* ---------- exception digest ----------
   Deliberately short. Every line cleared a threshold in metrics.py, so an empty digest means "nothing needs
   you", which is a useful answer rather than an empty panel. */
function digestBlock(){
  var groups=[];
  locIds().forEach(function(l){
    var d=(D.digest||{})[l]; if(!d||!d.length) return;
    var loc=(D.locations.filter(function(x){return x.id===l;})[0]||{name:l});
    groups.push({name:loc.name, id:l, items:d});
  });
  var multi=locIds().length>1;
  if(!groups.length){
    return panel('What changed','Nothing crossed a threshold in the last 28 days',
      '<div class="empty">No exceptions — sales, labor, COGS, comps, voids, cash and inventory are all within their normal ranges.</div>');
  }
  var warn=groups.reduce(function(p,g){return p+g.items.filter(function(i){return i[0]==='warn';}).length;},0);
  var ico={warn:'▲', info:'•', good:'▲'};
  var col={warn:'var(--bad,#b4413c)', info:'var(--muted,#6b7280)', good:'var(--good,#2e7d5b)'};
  return panel('What changed', (warn?warn+' thing'+(warn===1?'':'s')+' worth a look':'Nothing urgent')+' · last 28 days vs the 28 before',
    groups.map(function(g){
      return (multi?'<div class="hint" style="margin-top:10px"><b>'+esc(g.name)+'</b></div>':'')
        +'<table class="t">'+g.items.map(function(i){
          var _a=ACKS&&ACKS[g.id+'|'+i[4]];
          return '<tr'+(_a&&_a.state==='resolved'?' class="resolved"':'')+'><td style="width:18px;color:'+col[i[0]]+'">'+(i[0]==='good'?'▼':ico[i[0]])+'</td>'
            +'<td style="width:74px"><span class="pill">'+esc(i[1])+'</span></td>'
            +'<td class="n" style="white-space:normal">'+esc(i[2])+'</td>'
            +'<td class="r" style="color:var(--muted)">'+esc(i[3]||'')+'</td>'+ackCell(g.id,i)+'</tr>';
        }).join('')+'</table>';
    }).join(''));
}

/* ---------- month-to-date pacing ----------
   Weighted by each location's own weekday profile on both sides, so "ahead" and "behind" compare like with
   like. A straight run-rate in a taproom is wrong in a predictable direction: it understates with a weekend
   still to come and overstates just after one. */
function pacingBlock(){
  var rows=[];
  locIds().forEach(function(l){
    var p=(D.pacing||{})[l]; if(!p||!p.month) return;
    var loc=(D.locations.filter(function(x){return x.id===l;})[0]||{name:l});
    rows.push({loc:loc.name, p:p});
  });
  if(!rows.length) return '';
  var any=rows.some(function(r){return r.p.target;});
  var T={net:0,target:0,prorata:0,forecast:0};
  rows.forEach(function(r){ T.net+=r.p.mtd.net||0; T.target+=r.p.target||0; T.prorata+=r.p.prorata||0; T.forecast+=r.p.forecast||0; });
  var pace=T.prorata?T.net/T.prorata:null, fc=T.target?T.forecast/T.target:null;
  var m=rows[0].p, sub=m.days_elapsed+' of '+m.days_in_month+' days'+(m.elapsed_share!=null?' · '+fp(m.elapsed_share,0)+' of a typical month\'s trade':'');
  function band(v){ return v==null?'':(v>=1?' style="color:var(--good,#2e7d5b)"':(v>=0.95?'':' style="color:var(--bad,#b4413c)"')); }
  return panel('Month to date — '+esc(m.month), sub,
    '<div class="grid tiles" style="margin-bottom:10px">'
    +tile('MTD net sales',fk(T.net),'', any?'<span class="tg">pace target '+fk(T.prorata)+'</span>':'')
    +(any?tile('Pace',(pace!=null?'<span'+band(pace)+'>'+fp(pace,0)+'</span>':'—'),'','<span class="tg">vs where we should be</span>'):'')
    +tile('Forecast to month end',fk(T.forecast),'','<span class="tg">weekday-weighted</span>')
    +(any?tile('Forecast vs target',(fc!=null?'<span'+band(fc)+'>'+fp(fc,0)+'</span>':'—'),'','<span class="tg">target '+fk(T.target)+'</span>'):'')
    +'</div>'
    +(rows.length>1?'<div class="tw"><table class="t"><tr><th>Location</th><th class="r">MTD</th><th class="r">Pace target</th><th class="r">Pace</th><th class="r">Forecast</th><th class="r">Target</th><th class="r">vs target</th></tr>'
      +rows.map(function(r){var p=r.p;
        return '<tr><td class="n">'+esc(r.loc)+'</td><td class="r">'+fk(p.mtd.net)+'</td><td class="r">'+(p.prorata?fk(p.prorata):'—')+'</td>'
          +'<td class="r"'+band(p.pace_pct)+'>'+(p.pace_pct!=null?fp(p.pace_pct,0):'—')+'</td>'
          +'<td class="r">'+fk(p.forecast)+'</td><td class="r">'+(p.target?fk(p.target):'—')+'</td>'
          +'<td class="r"'+band(p.forecast_pct)+'>'+(p.forecast_pct!=null?fp(p.forecast_pct,0):'—')+'</td></tr>';}).join('')
      +'</table></div>':'')
    +(any?'':'<div class="src">No sales target set for '+esc(m.month)+' in inputs/targets.csv, so only the forecast is shown.</div>'));
}

function pgInventory(m){
  var cpn=compliancePanel();
  var h=(cpn?'<div class="grid" style="margin-bottom:14px">'+cpn+'</div>':'')+'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(640px,1fr))">';
  locIds().forEach(function(l){
    var loc=D.locations.filter(function(x){return x.id===l;})[0], inv=D.inventory[l]||[];
    if(!inv.length){h+=panel(loc.name,'No inventory counts yet','<div class="empty">Add counts to inputs/inventory_counts.csv or enable the MarginEdge inventory endpoint.</div>');return;}
    var tot=inv.reduce(function(p,c){return p+c.value;},0);
    var canDrill=!!DETAIL_KEYS[l];
    /* Each bucket is counted on its own cadence, and buckets do get left off a sheet entirely. Two things follow.
       (1) The window shown must be the ROW's window, not the first row's — Solon's beer was last counted in June
       while its food is counted weekly, and showing both under one "Sep 14 vs Sep 7" heading made a four-month-old
       number look current. (2) An ending value of zero under a non-zero beginning is a bucket that was not on the
       sheet, not a bucket that ran to nothing. Subtracting it yields usage = everything you started with plus
       everything you bought, which lands at a believable-looking cost percentage and is entirely fictional. The
       honest output there is no number at all. */
    var newest=inv.reduce(function(p,c){return c.date>p?c.date:p;},'');
    var anyGap=inv.some(function(r){return r.date!==newest||r.value===0;});
    h+=panel(loc.name+' — on hand '+fk(tot),'Most recent count '+fdate(newest)
        +(anyGap?' · <b>not every category was counted then</b> — each row shows the window it was actually measured over':' · all categories counted together'),
      '<table class="t"><tr><th>Category</th><th>Counted</th><th class="r">Begin</th><th class="r">Purchases</th><th class="r">End</th><th class="r">Usage</th><th class="r">Sales</th><th class="r">Actual cost %</th><th class="r">Wks on hand</th></tr>'
      +inv.map(function(r){
        // An ending value of exactly zero for a whole category is never a real state in a taproom that stocks it;
        // it means the category had no lines on the sheet. Treated as uncounted whether or not there is a prior.
        var missing=(r.value===0);
        var stale=(r.date!==newest);                     // counted on an older date than the rest
        var days=r.prev_date?(pd(r.date)-pd(r.prev_date))/864e5:null;
        var woh=(!missing&&r.usage&&days)?r.value/(r.usage/days*7):null;
        var bk=BUCKETS.filter(function(z){return z[0]===r.bucket;})[0];
        var win=r.prev_date?(fdate(r.prev_date)+' → '+fdate(r.date)):('first count '+fdate(r.date));
        var warn='color:var(--bad);font-weight:700';
        return '<tr><td class="n"><i class="sw" style="background:'+css(bk?bk[3]:'sx')+'"></i>'+esc(r.bucket)+'</td>'
          +'<td style="font-size:11.5px'+(stale?';color:var(--bad);font-weight:700':';color:var(--muted)')+'">'+win
            +(stale?' <span title="Older than this location\'s most recent count">stale</span>':'')+'</td>'
          +'<td class="r">'+fm(r.prev_value)+'</td><td class="r">'+fm(r.purchases)+'</td>'
          +(missing?'<td class="r" style="'+warn+'" title="This category had no lines on the count sheet, so there is no ending value to subtract">not counted</td>'
                   :'<td class="r">'+fm(r.value)+'</td>')
          +(missing?'<td class="r">—</td><td class="r">'+fm(r.sales)+'</td><td class="r">—</td><td class="r">—</td>'
                   :'<td class="r">'+fm(r.usage)+'</td><td class="r">'+fm(r.sales)+'</td><td class="r">'+fp(r.sales?r.usage/r.sales:null)+'</td><td class="r">'+(woh!=null?woh.toFixed(1):'—')+'</td>')
          +'</tr>';}).join('')+'</table>'
      +(anyGap?'<div class="hint" style="margin-top:8px">A category reading <b style="color:var(--bad)">not counted</b> was missing from the latest sheet, so its usage and cost cannot be worked out — begin plus purchases with nothing subtracted would produce a plausible-looking number that means nothing. A <b style="color:var(--bad)">stale</b> window was measured over different dates than the rest of this table and is not comparable to them.</div>':'')
      +(canDrill?'<div style="margin-top:10px"><button class="signout" data-drill="'+esc(l)+'">Count sheet &amp; per-product variance</button></div><div id="drill_'+esc(l)+'"></div>'
                :'<div class="hint" style="margin-top:10px;font-size:11.5px;color:var(--muted)">Per-product detail is unavailable for this location.</div>'));
  });
  m.innerHTML=h+'</div>';
  m.querySelectorAll('button[data-drill]').forEach(function(b){ b.onclick=function(){ drill(b.dataset.drill, b); }; });
}

function drill(loc, btn){
  var box=$('drill_'+loc);
  if(!box) return;
  if(box.dataset.open==='1'){ box.dataset.open='0'; box.innerHTML=''; btn.textContent='Count sheet & per-product variance'; return; }
  box.dataset.open='1'; btn.textContent='Hide detail';
  box.innerHTML='<div class="empty">Loading count sheet…</div>';
  loadDetail(loc).then(function(d){ if(box.dataset.open==='1') box.innerHTML=drillHtml(d); })
    .catch(function(e){ DETAIL_ERR[loc]=e.message; if(box.dataset.open==='1') box.innerHTML='<div class="empty">Could not load the count sheet. '+esc(e.message)+'</div>'; });
}

function drillHtml(d){

  var h='';
  if((d.variance||[]).length){
    var w=d.window||[], dead=d.variance.filter(function(r){return r[7];});
    h+='<h3 style="margin-top:14px">Per-product variance</h3>'
      +'<div class="src">'+fdate(w[0])+' → '+fdate(w[1])+' · '+w[2]+' days · begin + purchases − end, valued in dollars because counted units and purchase units are not the same thing</div>'
      +'<div class="tw"><table class="t"><tr><th>Product</th><th>Category</th><th class="r">Begin</th><th class="r">Purchases</th><th class="r">End</th><th class="r">Usage</th><th class="r">Wks on hand</th><th class="r">On hand</th></tr>'
      +d.variance.slice(0,150).map(function(r){
         var bk=BUCKETS.filter(function(z){return z[0]===r[1];})[0];
         return '<tr'+(r[7]?' style="opacity:.75"':'')+'><td class="n">'+esc(r[0])+(r[7]?' <span class="tg">no movement</span>':'')+'</td>'

       }).join('')+'</table></div>'
      +(dead.length?'<div class="src">'+dead.length+' product'+(dead.length===1?'':'s')+' counted with no depletion over the period.</div>':'')
      +(function(){var c=d.coverage; if(!c||!c[1]) return ''; var pct=c[0]/c[1];
         return pct>0.995?'':'<div class="src">Covers '+fp(pct)+' of purchases in this window — the rest was spent on products that are not on a count sheet, so it shows in the category totals above but cannot be attributed to a product here.</div>';})();
  }
  if((d.sheet||[]).length){
    var sec=null;
    h+='<h3 style="margin-top:18px">Latest count sheet</h3><div class="src">As counted, by storage section</div>'
      +'<div class="tw"><table class="t"><tr><th>Product</th><th class="r">Qty</th><th>Unit</th><th class="r">Unit price</th><th class="r">Value</th></tr>'
      +d.sheet.map(function(r){
         var head='';
         if(r[0]!==sec){ sec=r[0]; head='<tr><td colspan="5" class="n" style="padding-top:12px"><strong>'+esc(sec||'(no section)')+'</strong></td></tr>'; }
         return head+'<tr><td class="n">'+esc(r[1])+'</td><td class="r">'+fn(r[3])+'</td><td>'+esc(r[4]||'')+'</td><td class="r">'+fm(r[5])+'</td><td class="r">'+fm(r[6])+'</td></tr>';
       }).join('')+'</table></div>';
  }
  if((d.events||[]).length>1){
    h+='<h3 style="margin-top:18px">Count history</h3><div class="tw"><table class="t"><tr><th>Date</th><th>Count sheet</th><th>Status</th><th class="r">Total value</th></tr>'
      +d.events.map(function(r){return '<tr><td class="n">'+fdate(r[0])+'</td><td>'+esc(r[1]||'')+'</td><td>'+esc(r[2]||'')+'</td><td class="r">'+fm(r[3])+'</td></tr>';}).join('')+'</table></div>';

/* ---------- tender detail + voids ---------- */
function tenderAndVoids(){

    var t={}; locIds().forEach(function(l){(D.tender&&D.tender[l]||[]).forEach(function(r){
      var k=r[0]+'||'+r[1]; var o=t[k]||(t[k]={type:r[0],card:r[1],amt:0,tips:0,ref:0,n:0});
      o.amt+=r[2]; o.tips+=r[3]; o.ref+=r[4]; o.n+=r[5];});});
    var tl=Object.keys(t).map(function(k){return t[k];}).sort(function(a,b){return b.amt-a.amt;});

        +'<td class="r">'+fp(tt?x.amt/tt:null)+'</td><td class="r">'+fm(x.tips)+'</td><td class="r">'+fp(x.amt?x.tips/x.amt:null)+'</td>'
        +'<td class="r">'+(x.ref?fm(x.ref):'—')+'</td></tr>';}).join('')+'</table></div>'
      +(tr?'<div class="src">'+fm(tr)+' refunded over the period.</div>':'')):'<div class="empty">No payments in this window.</div>';
  }
  if($('voids')){
    var v={orders:0,value:0,items:0,item_value:0,orders_ok:0,net_ok:0,valued:0,by:{}};
    locIds().forEach(function(l){ var x=(D.voids||{})[l]; if(!x) return;
      v.orders+=x.orders||0; v.value+=x.value||0; v.items+=x.items||0; v.item_value+=x.item_value||0;
      v.orders_ok+=x.orders_ok||0; v.net_ok+=x.net_ok||0; v.valued+=x.valued||0;
      (x.by_day||[]).forEach(function(r){ var o=v.by[r[0]]||(v.by[r[0]]=[0,0]); o[0]+=r[1]; o[1]+=r[2]; }); });
    if(!v.orders && !v.items){ $('voids').innerHTML='<div class="empty">No voids in this window — worth a glance at whether voids are being recorded at all.</div>'; }
    else{
      var days=Object.keys(v.by).sort(), rate=v.orders_ok?v.orders/(v.orders+v.orders_ok):null;
      var worst=days.map(function(d){return [d,v.by[d][0],v.by[d][1]];}).sort(function(a,b){return b[2]-a[2];}).slice(0,8);
      // Value is only known for orders pulled since voided_value was added. Where it is missing, say so —
      // showing $0.00 would read as "these voids cost nothing", which is the opposite of the truth.
      var partial = v.orders && v.valued < v.orders;
      $('voids').innerHTML='<div class="hint" style="margin-bottom:8px"><b>'+fn(v.orders)+'</b> voided orders'
        +(v.valued?' worth '+fm(v.value):'')+(rate!=null?' · '+fp(rate)+' of orders':'')
        +(v.items?' · '+fn(v.items)+' voided items worth '+fm(v.item_value):'')+'</div>'
        +(worst.length?'<table class="t"><tr><th>Heaviest days</th><th class="r">Voids</th><th class="r">Value</th></tr>'
          +worst.map(function(x){return '<tr><td class="n">'+fdate(x[0])+'</td><td class="r">'+fn(x[1])+'</td><td class="r">'+(x[2]?fm(x[2]):'—')+'</td></tr>';}).join('')
          +'</table>':'')
        +(partial?'<div class="src">Void values are recorded from '+esc(D.meta.through)+' backwards only as far as the data has been re-pulled — '
          +fn(v.orders-v.valued)+' of these voids predate that and show a count without a value.</div>':'');
    }
  }
}

/* ---------- sales vs labor by hour ----------
   Both sides are averages over the same 8-week window: sales per business day from item timestamps, labor
   per business day from shifts sliced at hour boundaries. Dividing them is only meaningful because both use
   the POS business date and the same local clock, so a 1am hour belongs to the night before on both sides. */
function hourlyLaborViews(){
  var sales={}, lab={}, labH={};
  locIds().forEach(function(l){
    (D.hourly[l]||[]).forEach(function(r){ var k=r[0]+':'+r[1]; sales[k]=(sales[k]||0)+r[2]; });
    ((D.labor_hourly||{})[l]||[]).forEach(function(r){
      var k=r[0]+':'+r[1], n=r[4]||1;
      lab[k]=(lab[k]||0)+r[3]/n;            // wage cost per business day, so it matches sales per business day
      labH[k]=(labH[k]||0)+r[2]/n;
    });
  });
  var have=Object.keys(lab).length;
  var hrs=[]; for(var i=6;i<24;i++)hrs.push(i);

  // --- average day: sales bars against labor % line
  var byHour=hrs.map(function(h){
    var sN=0,lC=0,lH=0;
    [0,1,2,3,4,5,6].forEach(function(d){ sN+=sales[d+':'+h]||0; lC+=lab[d+':'+h]||0; lH+=labH[d+':'+h]||0; });
    return {h:h, net:sN/7, cost:lC/7, hours:lH/7};
  });
  if($('c_splh')){
    if(!have){ var b=$('c_splh'); if(b&&b.parentNode) b.parentNode.innerHTML='<div class="empty">No clock-in/clock-out data in this window.</div>'; }
    else mk('c_splh',{data:{labels:byHour.map(function(x){return hLabel(x.h);}),datasets:[
        {type:'bar',label:'Net sales',data:byHour.map(function(x){return x.net;}),backgroundColor:css('s1'),borderRadius:3,order:2,yAxisID:'y'},
        {type:'line',label:'Labor % of sales',data:byHour.map(function(x){return x.net?x.cost/x.net:null;}),borderColor:css('s3'),borderWidth:2,pointRadius:0,tension:.3,order:1,yAxisID:'y1'}]},
      options:baseOpts({scales:{
        x:{grid:{display:false}},
        y:{beginAtZero:true,grid:{color:css('grid')},border:{display:false},ticks:{callback:function(v){return fk(v);}}},
        y1:{position:'right',beginAtZero:true,grid:{display:false},border:{display:false},ticks:{callback:function(v){return fp(v,0);}}}},
        plugins:{legend:{display:true,position:'bottom'},tooltip:{callbacks:{label:function(c){
          return c.dataset.type==='line' ? ' Labor: '+fp(c.parsed.y) : ' Sales: '+fm(c.parsed.y);}}}}})});
  }

  // --- weekday x hour, coloured by labor % (capped at 60% so one dead hour does not flatten the rest)
  if($('heatLab')){
    if(!have){ $('heatLab').innerHTML='<div class="empty">No clock-in/clock-out data in this window.</div>'; return; }
    var dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], CAP=0.6;
    var hh='<div class="heat"><div></div>'+hrs.map(function(x){return '<div class="h">'+hLabel(x)+'</div>';}).join('');
    [1,2,3,4,5,6,0].forEach(function(d){
      hh+='<div class="h" style="text-align:left;line-height:26px">'+dn[d]+'</div>'+hrs.map(function(x){
        var k=d+':'+x, n=sales[k]||0, c=lab[k]||0;
        if(!c && !n) return '<div class="c" data-t="'+dn[d]+' '+hLabel(x)+' — closed" style="background:rgba(0,0,0,.04)"></div>';
        var pct=n?c/n:null, t=pct==null?1:Math.min(pct/CAP,1);
        var tip=dn[d]+' '+hLabel(x)+' — '+(pct==null?'labor with no sales':fp(pct)+' labor · '+fm(n)+' sales · '+fn(Math.round((labH[k]||0)*10)/10)+' h');
        return '<div class="c" data-t="'+esc(tip)+'" style="background:rgba(214,84,42,'+(0.08+0.92*t).toFixed(2)+')"></div>';
      }).join('');
    });
    $('heatLab').innerHTML=hh+'</div>';
  }
}
function hLabel(x){ return x>12?(x-12)+'p':(x===12?'12p':x+'a'); }

/* ---------- cash management ---------- */
function hasCash(){ return locIds().some(function(l){ var c=(D.cash||{})[l]; return c && c.totals; }); }

function cashPanels(){
  if(!hasCash()) return;
  var T={over:0,short:0,payouts:0,entries:0,reversed:0,collected:0,closeouts:0,exact:0,over_n:0,short_n:0,nosales:0,unrecognised:0};
  var days={}, emps={}, draw={}, pay={}, nos={}, deps={}, cons=[];
  locIds().forEach(function(l){
    var c=(D.cash||{})[l]; if(!c||!c.totals) return;
    ['over','short','payouts','entries','reversed','collected','closeouts','exact','over_n','short_n','nosales','unrecognised']
      .forEach(function(k){ T[k]+=c.totals[k]||0; });
    (c.days||[]).forEach(function(r){ var o=days[r[0]]||(days[r[0]]=[0,0]); o[0]+=r[1]; o[1]+=r[2]; });
    (c.by_employee||[]).forEach(function(r){ var o=emps[r[0]]||(emps[r[0]]=[0,0,0,0,0]); o[0]+=r[1]; o[1]+=r[2]; o[2]+=r[3]; o[3]+=r[4]; o[4]+=r[5]; });
    (c.by_drawer||[]).forEach(function(r){ var o=draw[r[0]]||(draw[r[0]]=[0,0,0,0,0,null]); o[0]+=r[1]; o[1]+=r[2]; o[2]+=r[3]; o[3]+=r[4]; o[4]+=r[5]; o[5]=r[6]; });
    if(c.consistent_shortfall) cons.push([l, c.consistent_shortfall]);
    (c.payouts||[]).forEach(function(r){ var o=pay[r[0]]||(pay[r[0]]=[0,0]); o[0]+=r[1]; o[1]+=r[2]; });
    (c.nosales||[]).forEach(function(r){ nos[r[0]]=(nos[r[0]]||0)+r[1]; });
    (c.deposits||[]).forEach(function(r){ var o=deps[r[0]]||(deps[r[0]]=[0,0]); o[0]+=r[1]; o[1]+=r[2]; });
  });
  if($('cashDay')){
    var dl=Object.keys(days).sort(), net=T.over-T.short;
    var worst=dl.map(function(d){return [d,days[d][0],days[d][1]];}).filter(function(x){return x[1]||x[2];})
      .sort(function(a,b){return (b[2]-b[1])-(a[2]-a[1]);}).slice(0,10);
    /* A drawer that balanced and a drawer nobody counted are not the same thing, and the old version of this
       panel showed both as nothing. Lead with how many close-outs there WERE: with none, every figure below is
       an absence of measurement, not a clean result, and the panel says so instead of printing zeros. */
    var acc = T.closeouts ? (T.exact/T.closeouts) : null;
    $('cashDay').innerHTML=(T.closeouts
        ? '<div class="hint" style="margin-bottom:8px">'
          +fn(T.closeouts)+' close-outs · <b>'+fp(acc,0)+' balanced exactly</b> · '
          +fn(T.over_n)+' over, '+fn(T.short_n)+' short · '
          +'over '+fm(T.over)+' · short '+fm(T.short)+' · <b style="color:'+(net<0?'var(--bad,#b4413c)':'var(--good,#2e7d5b)')+'">net '+(net>0?'+':'')+fm(net)+'</b>'
          +(T.collected?' · '+fm(T.collected)+' cash collected':'')+'</div>'
        : '<div class="hint" style="margin-bottom:8px"><b style="color:var(--bad,#b4413c)">No drawer close-outs were recorded in this range.</b> '
          +'Over/short cannot be measured without them — the figures below are missing, not zero.'
          +(T.collected?' '+fm(T.collected)+' of cash was collected in the same period.':'')+'</div>')
      +(worst.length?'<table class="t"><tr><th>Worst days</th><th class="r">Over</th><th class="r">Short</th><th class="r">Net</th></tr>'
        +worst.map(function(x){var n=x[1]-x[2];return '<tr><td class="n">'+fdate(x[0])+'</td><td class="r">'+(x[1]?fm(x[1]):'—')+'</td>'
          +'<td class="r">'+(x[2]?fm(x[2]):'—')+'</td><td class="r" style="color:'+(n<0?'var(--bad,#b4413c)':'inherit')+'">'+(n>0?'+':'')+fm(n)+'</td></tr>';}).join('')
        +'</table>':(T.closeouts?'<div class="empty">Every close-out in this range balanced exactly — nothing over or short.</div>':''))
      +(T.unrecognised?'<div class="hint" style="margin-top:8px;color:var(--bad,#b4413c)">'+fn(T.unrecognised)+' cash entries had a type this view does not recognise and were not counted anywhere. Worth reporting.</div>':'')
      +(T.reversed?'<div class="src">'+fn(T.reversed)+' entries were corrections and have been netted out of every figure here, along with the entries they reversed.</div>':'');
  }
  if($('cashWho')){
    var dr=Object.keys(draw).sort(function(a,b){return draw[b][4]-draw[a][4];});
    var el=Object.keys(emps).sort(function(a,b){return emps[b][1]-emps[a][1];});
    var pl=Object.keys(pay).sort(function(a,b){return pay[b][1]-pay[a][1];});
    var nl=Object.keys(nos).sort(function(a,b){return nos[b]-nos[a];});
    var dl2=Object.keys(deps).sort(), dtot=dl2.reduce(function(p,c){return p+deps[c][0];},0);
    $('cashWho').innerHTML=
      /* The float test, first and in plain words, because it decides whether anyone should be having a
         conversation about this at all. */
      (cons.length?cons.map(function(x){var l=x[0],k=x[1];

/* ---------- per-server performance ----------
   Names are the short form the employee directory builds (first name, last initial). Sorted by net sales, but
   the columns that matter for a conversation are the rates, not the ranking. */
function hasServers(){ return locIds().some(function(l){ return ((D.servers||{})[l]||[]).length; }); }

function serverPanel(){
  var box=$('servers'); if(!box) return;
  var rows=[];
  locIds().forEach(function(l){
    var loc=(D.locations.filter(function(x){return x.id===l;})[0]||{name:l});
    ((D.servers||{})[l]||[]).forEach(function(r){ rows.push({loc:loc.name, name:r[0], orders:r[1], net:r[2], guests:r[3],
      avg:r[4], perGuest:r[5], hours:r[6], splh:r[7], disc:r[8], tip:r[9], voids:r[10], voidValue:r[11]}); });
  });
  if(!rows.length){ box.innerHTML='<div class="empty">No server-level data in this window.</div>'; return; }
  rows.sort(function(a,b){return b.net-a.net;});
  var multi=locIds().length>1;
  // Medians, so a row can be read against the group rather than in isolation.
  function med(k){ var v=rows.map(function(r){return r[k];}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
    return v.length?v[Math.floor(v.length/2)]:null; }
  var mAvg=med('avg'), mSplh=med('splh');
  box.innerHTML='<div class="tw"><table class="t"><tr>'+(multi?'<th>Location</th>':'')
    +'<th>Server</th><th class="r">Orders</th><th class="r">Net sales</th><th class="r">Avg check</th>'
    +'<th class="r">Per guest</th><th class="r">Hours</th><th class="r">Sales / hr</th><th class="r">Comp %</th><th class="r">Tip %</th><th class="r">Voids</th></tr>'
    +rows.map(function(r){
      function mark(v,m){ if(v==null||m==null) return ''; return v>=m*1.15?' style="color:var(--good,#2e7d5b)"':(v<=m*0.85?' style="color:var(--bad,#b4413c)"':''); }
      return '<tr>'+(multi?'<td>'+esc(r.loc)+'</td>':'')
        +'<td class="n">'+esc(r.name)+'</td><td class="r">'+fn(r.orders)+'</td><td class="r">'+fm(r.net)+'</td>'
        +'<td class="r"'+mark(r.avg,mAvg)+'>'+fm(r.avg)+'</td><td class="r">'+(r.perGuest!=null?fm(r.perGuest):'—')+'</td>'
        +'<td class="r">'+(r.hours!=null?fn(r.hours):'—')+'</td>'
        +'<td class="r"'+mark(r.splh,mSplh)+'>'+(r.splh!=null?fm(r.splh,0):'—')+'</td>'
        +'<td class="r">'+(r.disc!=null?fp(r.disc):'—')+'</td><td class="r">'+(r.tip!=null?fp(r.tip):'—')+'</td>'
        +'<td class="r">'+(r.voids?fn(r.voids)+(r.voidValue?' · '+fm(r.voidValue):''):'—')+'</td></tr>';
    }).join('')+'</table></div>'
    +'<div class="src">Green and red mark 15% above or below the median for that column, not a target. '
    +'Average check depends heavily on section and shift, so read it alongside hours rather than on its own.</div>';
}

/* ---------- schedule vs actual ----------
   Only rendered when Toast actually returned scheduled shifts. A restaurant that does not build its schedule
   in Toast has no schedule to compare against, and an empty panel claiming 100% adherence would be a lie. */
function hasSchedule(){ return locIds().some(function(l){ var s=(D.schedule||{})[l]; return s && (s.daily||[]).length; }); }

function scheduleViews(){
  if(!hasSchedule()) return;
  var day={}, jobs={}, punct={n:0,early:0,on_time:0,late:0,lateSum:0}, unsched=0, noshow=0, worst=[];
  locIds().forEach(function(l){
    var s=(D.schedule||{})[l]; if(!s||!s.daily) return;
    s.daily.forEach(function(r){ var o=day[r[0]]||(day[r[0]]=[0,0]); o[0]+=r[1]; o[1]+=r[2]; });
    (s.jobs||[]).forEach(function(r){ var o=jobs[r[0]]||(jobs[r[0]]=[0,0,0]); o[0]+=r[1]; o[1]+=r[2]; o[2]+=r[3]; });
    var p=s.punctuality||{};
    punct.n+=p.n||0; punct.early+=p.early||0; punct.on_time+=p.on_time||0; punct.late+=p.late||0;
    if(p.avg_late&&p.late) punct.lateSum+=p.avg_late*p.late;
    (p.worst||[]).forEach(function(w){ worst.push(w); });
    unsched+=s.unscheduled_hours||0; noshow+=s.no_show_hours||0;
  });
  var ds=Object.keys(day).sort();
  if($('c_sched')) mk('c_sched',{data:{labels:ds.map(fdate),datasets:[
      {type:'bar',label:'Scheduled',data:ds.map(function(d){return day[d][0];}),backgroundColor:css('s2'),borderRadius:3,order:2},
      {type:'line',label:'Worked',data:ds.map(function(d){return day[d][1];}),borderColor:css('s3'),borderWidth:2,pointRadius:0,tension:.25,order:1}]},
    options:baseOpts({scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:10}},
      y:{beginAtZero:true,grid:{color:css('grid')},border:{display:false},ticks:{callback:function(v){return fn(v)+' h';}}}},
      plugins:{legend:{display:true,position:'bottom'},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fn(Math.round(c.parsed.y))+' h';}}}}})});

  if($('schedTbl')){
    var jl=Object.keys(jobs).sort(function(a,b){return jobs[b][1]-jobs[a][1];});
    var tS=jl.reduce(function(p,c){return p+jobs[c][0];},0), tA=jl.reduce(function(p,c){return p+jobs[c][1];},0);
    var avgLate=punct.late?punct.lateSum/punct.late:null;
    worst.sort(function(a,b){return b[2]-a[2];});
    $('schedTbl').innerHTML=
      '<div class="hint" style="margin-bottom:8px">'+fn(Math.round(tS))+' h scheduled · <b>'+fn(Math.round(tA))+' h</b> worked'
        +(tS?' ('+(tA>tS?'+':'')+fp((tA-tS)/tS)+')':'')+'</div>'
      +'<table class="t"><tr><th>Job</th><th class="r">Scheduled</th><th class="r">Worked</th><th class="r">Diff</th></tr>'
      +jl.map(function(j){var v=jobs[j],d=v[1]-v[0];
        return '<tr><td class="n">'+esc(j)+'</td><td class="r">'+fn(Math.round(v[0]))+' h</td><td class="r">'+fn(Math.round(v[1]))+' h</td>'
          +'<td class="r" style="color:'+(d>0.5?'var(--bad,#b4413c)':(d<-0.5?'var(--good,#2e7d5b)':'inherit'))+'">'+(d>0?'+':'')+fn(Math.round(d))+' h</td></tr>';}).join('')
      +'</table>'
      +'<div class="hint" style="margin-top:12px"><b>Clock-in</b> vs scheduled start, '+fn(punct.n)+' matched shifts: '
        +fn(punct.on_time)+' on time (±5 min) · '+fn(punct.early)+' early · <b>'+fn(punct.late)+' late</b>'
        +(avgLate?' averaging '+avgLate.toFixed(0)+' min':'')+'</div>'
      +(worst.length?'<div class="tw"><table class="t" style="margin-top:8px"><tr><th>Date</th><th>Job</th><th class="r">Minutes late</th></tr>'
        +worst.slice(0,10).map(function(w){return '<tr><td class="n">'+fdate(w[0])+'</td><td>'+esc(w[1])+'</td><td class="r">'+fn(w[2])+'</td></tr>';}).join('')
        +'</table></div>':'')
      +((unsched>0.5||noshow>0.5)?'<div class="src">'+(unsched>0.5?fn(Math.round(unsched))+' h worked with no shift on the schedule. ':'')
        +(noshow>0.5?fn(Math.round(noshow))+' h scheduled but never worked.':'')+'</div>':'');
  }
}

/* ---------- purchase price tracking (lazy, shares the inventory detail bundle) ---------- */
function priceDrill(loc, btn){
  var box=$('pdrill_'+loc);
  if(!box) return;
  if(box.dataset.open==='1'){ box.dataset.open='0'; box.innerHTML=''; btn.textContent='Price movers, history & vendor comparison'; return; }
  box.dataset.open='1'; btn.textContent='Hide price detail';
  box.innerHTML='<div class="empty">Loading purchase history…</div>';

    .catch(function(e){ if(box.dataset.open==='1') box.innerHTML='<div class="empty">Could not load purchase history. '+esc(e.message)+'</div>'; });

function priceHtml(d){

      +'<div class="tw"><table class="t"><tr><th>Product</th><th>Vendor</th><th>Category</th><th class="r">Was</th><th class="r">Now</th><th class="r">Change</th><th class="r">Impact</th><th class="r">Buys</th></tr>'

           +'<td><i class="sw" style="background:'+css(bk?bk[3]:'sx')+'"></i>'+esc(r[2])+'</td>'
           +'<td class="r">'+fm(r[3])+'</td><td class="r">'+fm(r[4])+'</td>'
           +'<td class="r" style="color:'+(up?'var(--bad,#b4413c)':'var(--good,#2e7d5b)')+'">'+(up?'+':'')+fp(r[5])+'</td>'

  } else {

      +vc.map(function(r){

           +'<td class="r">'+fp(r[3])+'</td></tr>';

  }
  var ser=d.price_series||[];

      +'<div class="tw"><table class="t"><tr><th>Product</th><th>Category</th><th class="r">First</th><th class="r">Last</th><th class="r">Change</th><th>Trend</th></tr>'
      +ser.map(function(r){

           +'<td class="r">'+fm(f)+'</td><td class="r">'+fm(l)+'</td><td class="r">'+(ch==null?'—':((ch>0?'+':'')+fp(ch)))+'</td>'

/* A sparkline as inline SVG: enough to see the shape of a price without a chart library or a tooltip. */
function spark(vals){
  if(!vals||vals.length<2) return '';
  var w=110,hh=20,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  var pts=vals.map(function(v,i){return (i*(w-2)/(vals.length-1)+1).toFixed(1)+','+(hh-1-((v-mn)/rg)*(hh-2)).toFixed(1);}).join(' ');
  var rising=vals[vals.length-1]>vals[0];
  return '<svg width="'+w+'" height="'+hh+'" viewBox="0 0 '+w+' '+hh+'" aria-hidden="true" style="vertical-align:middle">'
    +'<polyline points="'+pts+'" fill="none" stroke="'+(rising?'#b4413c':'#2e7d5b')+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ---------- Tripleseat events ---------- */
function hasEvents(){ return locIds().some(function(l){return ((D.events||{})[l]||[]).length;}); }
function evRows(){ var out=[]; locIds().forEach(function(l){((D.events||{})[l]||[]).forEach(function(r){ out.push({loc:l,id:r[0],name:r[1],d:r[2],status:r[3],guests:r[4],booked:r[5],actual:r[6],fb:r[7],dep:r[8],style:r[9]}); });}); return out.sort(function(a,b){return a.d<b.d?-1:1;}); }
function evIsDef(st){ return /^(definite|confirmed)/i.test(st||''); }
function evValue(e){ return (e.actual!=null&&e.actual>0)?e.actual:(e.booked||0); }

function pgEvents(m){
  if(!hasEvents()){ m.innerHTML='<div class="panel"><h3>Events</h3><div class="empty">No Tripleseat data yet. Once the Tripleseat credentials are set, booked private events and the lead pipeline appear here.</div></div>'; return; }
  var a=S.d0,b=S.d1,T=D.meta.through;

  var rev=defIn.reduce(function(p,c){return p+evValue(c);},0), gu=defIn.reduce(function(p,c){return p+(c.guests||0);},0);
  var futDef=future.filter(function(e){return evIsDef(e.status);});
  var futRev=futDef.reduce(function(p,c){return p+(c.booked||0);},0);
  var k=kpis(a,b);
  m.innerHTML='<div class="grid tiles">'
    +tile('Events in range',fn(defIn.length),'<span class="tg">'+fn(inRange.length-defIn.length)+' tentative/other</span>')
    +tile('Event revenue',fk(rev),'',k.net?'<span class="tg">'+fp(rev/k.net)+' of net sales</span>':'')
    +tile('Event guests',fn(gu),'<span class="tg">'+fm(gu?rev/gu:null,2)+' per guest</span>')
    +tile('Booked ahead',fk(futRev),'<span class="tg">'+fn(futDef.length)+' confirmed events</span>')
    +tile('Avg event value',fm(defIn.length?rev/defIn.length:null,0),'')
    +'</div>'
    +'<div class="grid cols2" style="margin-top:14px">'
    +panel('Event revenue by month','Booked (contracted) vs actual billed, from Tripleseat',chartBox('c_evm',true))
    +panel('Lead pipeline','Inbound enquiries by status','<div id="evLead"></div>')
    +'</div>'
    +'<div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(560px,1fr))">'
    +panel('Upcoming events','Confirmed and tentative bookings after '+fdate(T),'<div id="evUp"></div>')
    +panel('Events in the selected range','Definite events counted in the revenue tile above','<div id="evIn"></div>')
    +'</div>';
  var mm={}; locIds().forEach(function(l){var e=(D.events_monthly||{})[l]||{};Object.keys(e).forEach(function(mo){var o=mm[mo]||(mm[mo]={n:0,booked:0,actual:0,guests:0});o.n+=e[mo][0];o.booked+=e[mo][1];o.actual+=e[mo][2];o.guests+=e[mo][3];});});
  var ms=Object.keys(mm).sort().slice(-14);
  mk('c_evm',{type:'bar',data:{labels:ms.map(fmon),datasets:[
      {label:'Booked',data:ms.map(function(x){return mm[x].booked;}),backgroundColor:css('s1'),borderRadius:4,maxBarThickness:34},
      {label:'Actual billed',data:ms.map(function(x){return mm[x].actual;}),backgroundColor:css('s3'),borderRadius:4,maxBarThickness:34}]},
    options:baseOpts({plugins:{legend:{display:true,position:'bottom'},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fk(c.parsed.y)+'  ('+fn(mm[ms[c.dataIndex]].n)+' events)';}}}}})});
  function evTable(list,showStatus){
    if(!list.length) return '<div class="empty">None in this window.</div>';
    var multi=locIds().length>1;
    return '<div style="overflow-x:auto"><table class="t"><tr><th>Date</th>'+(multi?'<th>Location</th>':'')+'<th>Event</th>'+(showStatus?'<th>Status</th>':'')+'<th class="r">Guests</th><th class="r">Booked</th><th class="r">Actual</th></tr>'
      +list.slice(0,40).map(function(e){var L=D.locations.filter(function(z){return z.id===e.loc;})[0];
        return '<tr><td>'+fdate(e.d)+'</td>'+(multi?'<td>'+esc(L?L.name:e.loc)+'</td>':'')+'<td class="n">'+esc(e.name)+'</td>'
        +(showStatus?'<td><span class="pill"'+(evIsDef(e.status)?' style="background:#e6f4ea;color:var(--good)"':'')+'>'+esc(e.status||'')+'</span></td>':'')
        +'<td class="r">'+fn(e.guests)+'</td><td class="r">'+fm(e.booked)+'</td><td class="r">'+(e.actual!=null&&e.actual>0?fm(e.actual):'—')+'</td></tr>';}).join('')
      +'</table>'+(list.length>40?'<div class="hint" style="margin-top:6px">Showing 40 of '+fn(list.length)+'</div>':'')+'</div>';

  var lk=Object.keys(ld).sort(function(x,y){return ld[y].n-ld[x].n;}), lt=lk.reduce(function(p,c){return p+ld[c].n;},0);

    :'<div class="empty">No leads in this window.</div>';

/* Does [a,b] at this location overlap any activation other than `except`? Used to keep a promo's baseline
   weeks clean of other promos. */
function actOverlaps(loc, a, b, except){
  return (D.activations||[]).some(function(z){
    if(z.loc!==loc || z===except) return false;
    if(except && z.s===except.s && z.name===except.name) return false;
    var zs=z.s, ze=z.e||z.s;
    return !(ze<a || zs>b);
  });
}

function pgActivations(m){
  var acts=D.activations.filter(function(x){return locIds().indexOf(x.loc)>=0;}).map(function(x){
    return {loc:x.loc,s:x.s,e:x.e,name:x.name,type:x.type||'Promo',cost:x.cost,owner:x.owner,notes:x.notes,src:'csv'};});
  if(S.actSrc!=='csv'){
    evRows().filter(function(e){return evIsDef(e.status)&&e.d<=D.meta.through;}).forEach(function(e){
      acts.push({loc:e.loc,s:e.d,e:e.d,name:e.name,type:'Private event',cost:0,owner:'Events',
                 notes:fn(e.guests)+' guests',src:'tripleseat',value:evValue(e)});});
  }
  if(S.actSrc==='events') acts=acts.filter(function(x){return x.src==='tripleseat';});
  acts.sort(function(x,y){return y.s<x.s?-1:1;});
  if(!acts.length){m.innerHTML='<div class="panel"><div class="empty">Nothing in this view — add rows to inputs/activations.csv, or connect Tripleseat for private events.</div></div>';return;}
  var rows=acts.map(function(x){
    var e=x.e||x.s, n=(pd(e)-pd(x.s))/864e5+1;
    var ev=sumRows(rowsIn(x.loc,x.s,e));
    var loc=D.locations.filter(function(z){return z.id===x.loc;})[0];
    // Lift-vs-baseline answers "did this bring in business we wouldn't otherwise have had?" — a fair question
    // for a marketing promo. A booked private event is different: its revenue is already inside the day's net
    // sales, so a day-over-day delta measures the rest of the taproom, not the event. Events report their
    // contracted value instead; only marketing activations get a baseline.
    var baseline=null, lift=null, bn=0, noisy=false, spread=null;
    if(x.src!=='tripleseat'){
      // Two corrections to a naive baseline:
      //
      // 1. Skip any comparison week that overlaps ANOTHER activation at this location. A promo that runs every
      //    fortnight would otherwise be measured partly against itself, which drags the baseline up and makes
      //    a real lift look like nothing.
      // 2. Keep the per-week figures, not just their mean, so the spread between ordinary weeks is known. A
      //    lift smaller than the normal week-to-week variation is not evidence of anything, and saying so is
      //    the difference between a measurement and a number that flatters whoever ran the promo.
      var weeks=[];
      for(var w=1;w<=4;w++){
        var bs=addDays(x.s,-7*w), be=addDays(e,-7*w);
        if(actOverlaps(x.loc,bs,be,x)) continue;
        var r=sumRows(rowsIn(x.loc,bs,be));
        if(r.days) weeks.push(r.net);
      }
      bn=weeks.length;
      if(bn){
        baseline=weeks.reduce(function(p,c){return p+c;},0)/bn;
        lift=ev.net-baseline;
        if(bn>1){
          var mu=baseline, va=weeks.reduce(function(p,c){return p+(c-mu)*(c-mu);},0)/(bn-1);
          spread=Math.sqrt(va);
          noisy=spread>0&&Math.abs(lift)<spread;
        }
      }
    }
    return {x:x,loc:loc?loc.name:x.loc,days:n,net:ev.net,guests:ev.guests,baseline:baseline,lift:lift,bn:bn,
            noisy:noisy,spread:spread,
            value:(x.src==='tripleseat'?(x.value||0):null), roi:(lift!=null&&x.cost)?lift/x.cost:null};
  });
  var mk_=rows.filter(function(r){return r.x.src!=='tripleseat';}), evs=rows.filter(function(r){return r.x.src==='tripleseat';});
  var tc=mk_.reduce(function(p,c){return p+(c.x.cost||0);},0), tl=mk_.reduce(function(p,c){return p+(c.lift||0);},0);
  var evVal=evs.reduce(function(p,c){return p+(c.value||0);},0);
  var nEv=evs.length;
  var seg=hasEvents()?('<div class="seg" style="margin-left:auto">'+['all','csv','events'].map(function(v){return '<button data-as="'+v+'"'+((S.actSrc||'all')===v?' class="on"':'')+'>'+({all:'All',csv:'Marketing only',events:'Events only'})[v]+'</button>';}).join('')+'</div>'):'';
  m.innerHTML='<div class="grid tiles">'+tile('Activations',fn(rows.length),(nEv?'<span class="tg">'+fn(mk_.length)+' marketing · '+fn(nEv)+' events</span>':''))
    +tile('Marketing spend',fk(tc),'')
    +tile('Marketing lift',fk(tl),'<span class="tg">vs 4-week same-weekday baseline</span>')
    +tile('Lift ÷ cost',tc?(tl/tc).toFixed(1)+'×':'—','<span class="tg">marketing only</span>')
    +(nEv?tile('Event revenue',fk(evVal),'<span class="tg">contracted value, already in net sales</span>'):'')+'</div>'
    +'<div class="panel" style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px"><h3 style="margin:0">Activation log</h3>'+seg+'</div><div class="hint">Lift = net sales on activation days minus the average of the same weekdays in the prior 4 weeks, ignoring any week that overlapped another activation here. Marketing promos come from inputs/activations.csv and are measured against that baseline; private events come from Tripleseat and show their contracted value, which is already counted inside net sales. <b>Lift is a comparison, not proof of cause</b> — weather, holidays and anything else happening that week land in it too, which is why a lift smaller than the ordinary week-to-week spread is marked as within normal variation.</div>'
    +'<div style="overflow-x:auto"><table class="t"><tr><th>Date</th><th>Location</th><th>Activation</th><th>Type</th><th>Owner</th><th class="r">Cost</th><th class="r">Booked</th><th class="r">Net sales</th><th class="r">Baseline</th><th class="r">Lift</th><th class="r">Lift ÷ cost</th><th>Confidence</th><th>Notes</th></tr>'
    +rows.map(function(r){return '<tr><td>'+fdate(r.x.s)+(r.days>1?'–'+fdate(r.x.e):'')+'</td><td>'+esc(r.loc)+'</td><td class="n">'+esc(r.x.name)+'</td><td><span class="pill">'+esc(r.x.type||'')+'</span></td><td>'+esc(r.x.owner||'')+'</td><td class="r">'+(r.x.src==='tripleseat'?'—':fm(r.x.cost))+'</td><td class="r">'+(r.value!=null?fm(r.value):'—')+'</td><td class="r">'+fm(r.net)+'</td><td class="r">'+(r.baseline!=null?fm(r.baseline):'—')+'</td><td class="r"'+(r.lift!=null?' style="color:'+(r.lift>=0?'var(--good)':'var(--bad)')+';font-weight:700"':'')+'>'+(r.lift!=null?(r.lift>=0?'+':'')+fm(r.lift):'—')+'</td><td class="r">'+(r.roi!=null?r.roi.toFixed(1)+'×':'—')+'</td>'
      +'<td style="white-space:normal;max-width:190px">'+(r.x.src==='tripleseat'?'<span class="tg">booked value</span>'
        :(r.bn===0?'<span class="tg">no clean baseline weeks</span>'
        :(r.noisy?'<span class="pill" style="background:#fdf1e7;color:#8a5a2b">within normal variation</span>'
        :'<span class="tg">'+r.bn+' baseline week'+(r.bn===1?'':'s')+(r.spread?' · ±'+fk(r.spread)+' typical':'')+'</span>')))+'</td>'
      +'<td style="white-space:normal;max-width:260px">'+esc(r.x.notes||'')+'</td></tr>';}).join('')+'</table></div></div>';
  m.querySelectorAll('[data-as]').forEach(function(b){b.onclick=function(){S.actSrc=b.dataset.as;render();};});
}

/* ---------- cross-location benchmarking ----------
   Indexed against the MEDIAN, not the average, and on rates rather than totals. Totals mostly measure how big
   a taproom is; rates measure how well it is run, which is the only comparison that is fair to a small site or
   to one that opened partway through the year and has no prior period of its own to be judged against.
   The median rather than the mean because with six locations one outlier drags an average badly. */
function benchmarkPanel(rows){
  var metrics=[
    {k:'ppa',   label:'Sales per guest',   fmt:'money', good:1},
    {k:'check', label:'Average check',     fmt:'money', good:1},
    {k:'splh',  label:'Sales / labor hour',fmt:'money0',good:1},
    {k:'labor', label:'Labor %',           fmt:'pct',   good:-1},
    {k:'purch', label:'Purchases %',       fmt:'pct',   good:-1},
    {k:'disc',  label:'Discount %',        fmt:'pct',   good:-1},
    {k:'count', label:'Counts made',       fmt:'pct',   good:1}
  ];
  if(rows.some(function(r){return r.l.seats;})) metrics.push({k:'seat', label:'Sales / seat / day', fmt:'money', good:1});
  var vals=rows.map(function(r){var s=r.s;return {
    name:r.l.name, partial:r.partial,
    ppa:s.guests?s.net/s.guests:null, check:s.checks?s.net/s.checks:null, splh:s.lh?s.net/s.lh:null,
    labor:s.net?s.lc/s.net:null, purch:s.net?s.p/s.net:null, disc:s.net?s.disc/s.net:null,
    count:((D.compliance||{})[r.l.id]||{}).score, seat:(r.l.seats&&s.days)?s.net/s.days/r.l.seats:null };});
  if(vals.length<2) return '';
  function median(k){var v=vals.map(function(x){return x[k];}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
    if(!v.length) return null; var m=Math.floor(v.length/2); return v.length%2?v[m]:(v[m-1]+v[m])/2; }
  var med={}; metrics.forEach(function(m){med[m.k]=median(m.k);});
  function show(v,f){ return v==null?'—':(f==='pct'?fp(v):(f==='money0'?fm(v,0):fm(v,2))); }
  return panel('How the taprooms compare','Selected date range · indexed against the group median · rates, not totals, so size is not mistaken for performance',
    '<div class="tw"><table class="t"><tr><th>Location</th>'
    +metrics.map(function(m){return '<th class="r">'+esc(m.label)+'</th>';}).join('')+'</tr>'
    +vals.map(function(x){
      return '<tr><td class="n">'+esc(x.name)+(x.partial?' <span class="pill">new</span>':'')+'</td>'
        +metrics.map(function(m){
          var v=x[m.k], mm=med[m.k];
          var idx=(v!=null&&mm)?v/mm:null;
          // 5% either side of the median is not a difference worth colouring.
          var col=''; if(idx!=null&&Math.abs(idx-1)>=0.05) col=((idx>1?1:-1)===m.good)?'var(--good,#2e7d5b)':'var(--bad,#b4413c)';
          // Rounding a 0.3% gap to "-0%" looks like a defect; anything that rounds to nothing is "par".
            var gap=idx==null?null:(Math.abs(idx-1)<0.005?'par':(idx>=1?'+':'')+fp(idx-1,0));
            return '<td class="r"'+(col?' style="color:'+col+'"':'')+'>'+show(v,m.fmt)
            +(gap?'<div style="font-size:10.5px;color:var(--muted)">'+gap+'</div>':'')+'</td>';
        }).join('')+'</tr>';
    }).join('')
    +'<tr style="border-top:2px solid var(--grid,#e5e7eb)"><td class="n"><b>Group median</b></td>'
    +metrics.map(function(m){return '<td class="r"><b>'+show(med[m.k],m.fmt)+'</b></td>';}).join('')+'</tr>'
    +'</table></div>'
    +'<div class="hint" style="margin-top:10px">Green means better than the median for that measure — which is a higher number for sales rates and a lower one for labour, purchases and discounts. Differences under 5% are left uncoloured.'+(vals.some(function(x){return x.partial;})?' A taproom marked <span class="pill">new</span> has no prior period of its own, so this is the only comparison available to it.':'')+'</div>');
}

  var rows=D.locations.map(function(l){ var s=sumRows(rowsIn(l.id,a,b)), p=sumRows(rowsIn(l.id,cw[0],cw[1],cw[2]));

  var wkAll={}; D.locations.forEach(function(l){rowsIn(l.id,a,b).forEach(function(r){var d=pd(r[0]);d.setDate(d.getDate()-((d.getDay()+6)%7));var w=ds(d);var o=wkAll[w]||(wkAll[w]={_n:0});if(l.id===D.locations[0].id)o._n++;var q=o[l.id]||(o[l.id]={net:0,lc:0});q.net+=r[K.net];q.lc+=r[K.lc];});});
  var wks=Object.keys(wkAll).sort();
  var c1=lineCfg(wks.map(function(w){return wkLabel(w,wkAll[w]);}),D.locations.map(function(l,i){return {label:l.name,data:wks.map(function(w){return wkAll[w][l.id]?wkAll[w][l.id].net:null;}),borderColor:css(LOCCOL[i%8])};})); c1.options.plugins.legend={display:true,position:'bottom'}; mk('c_locs',c1);
  var c2=lineCfg(wks.map(function(w){return wkLabel(w,wkAll[w]);}),D.locations.map(function(l,i){return {label:l.name,data:wks.map(function(w){var q=wkAll[w][l.id];return q&&q.net?q.lc/q.net:null;}),borderColor:css(LOCCOL[i%8]),fmt:'pct'};})); c2.options.plugins.legend={display:true,position:'bottom'}; c2.options.scales.y.ticks.callback=function(v){return fp(v,0);}; mk('c_loclab',c2);
}

/* ---------- Leadership Scorecard (Google Sheets, shown as the sheet formats it) ---------- */
function hasScorecard(){ return !!(D.scorecard && (((D.scorecard.metrics||[]).length)||((D.scorecard.tabs||[]).length))); }
function scTabs(){ return (D.scorecard.tabs||[]); }
// Tabs other than the headline scorecard have no common shape, so they are rendered as the sheet's own grid:
// first row as headers, blank-padded columns dropped, numeric-looking cells right-aligned.
function scGrid(t){
  var g=t.grid||[]; if(!g.length) return '<div class="empty">This tab has no cell data — it may be chart-only.</div>';
  var w=0; g.forEach(function(r){ for(var i=r.length-1;i>=0;i--){ if(String(r[i]).trim()){ if(i+1>w)w=i+1; break; } } });
  if(!w) return '<div class="empty">This tab is empty.</div>';
  function isNum(v){ return /^[-+(]?[$]?[\d,]+(\.\d+)?[%)]?$/.test(String(v).trim()) && /\d/.test(String(v)); }
  var head=g[0]||[], body=g.slice(1);
  var h='<div class="tw"><table class="t"><tr>'+Array.from({length:w}).map(function(_,i){return '<th'+(isNum(body.length&&body[0]?body[0][i]:'')?' class="r"':'')+'>'+esc(head[i]||'')+'</th>';}).join('')+'</tr>';
  h+=body.map(function(r){
    var blank=true; for(var i=0;i<w;i++) if(String(r[i]||'').trim()) blank=false;
    if(blank) return '<tr><td colspan="'+w+'" style="height:6px;border:0"></td></tr>';
    return '<tr>'+Array.from({length:w}).map(function(_,i){var v=String(r[i]||'');return '<td'+(isNum(v)?' class="r"':(i===0||i===1?' class="n"':''))+'>'+esc(v)+'</td>';}).join('')+'</tr>';
  }).join('');
  return h+'</table></div>'+(t.truncated?'<div class="hint" style="margin-top:6px">Showing the first '+fn(g.length)+' of '+fn(t.rows)+' rows and '+fn(Math.min(w,t.cols))+' of '+fn(t.cols)+' columns — this tab was capped so the portal stays quick to load.</div>':'');
}
function scWeeks(){ return (D.scorecard.weeks||[]).slice(); }

function pgScorecard(m){

// The headline tab is the one with a known shape (owner / metric / goal / weekly cells), so it gets a real
// reading layout: pick a metric, see it plotted against its goal, with the weekly grid underneath.
function scPrimary(SC){
  var weeks=scWeeks(), mets=SC.metrics||[];
  var shown=Math.min(weeks.length,S.scWeeks||13);
  var sel=S.scMetric||(mets.filter(function(x){return Object.keys(x.cells||{}).length>2;})[0]||mets[0]).metric;
  var selM=mets.filter(function(x){return x.metric===sel;})[0]||mets[0];
  function disp(mt,w){ var c=(mt.cells||{})[w]; return c?c[1]:'—'; }
  var wk=weeks.slice(0,shown);
  var h='<h2>'+esc(SC.sheet||'')+'</h2><div class="src">From '+esc(SC.workbook||'Google Sheets')+' · refreshed nightly · figures shown exactly as the sheet formats them</div>'
    +'<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px">'
    +'<div style="font-weight:700;color:var(--navy)">'+esc(selM.metric)+'</div>'
    +(selM.goal&&selM.goal[1]?'<div class="hint">goal '+esc(selM.goal[1])+'</div>':'')
    +'<div class="seg" style="margin-left:auto">'+[13,26,52].map(function(n){return '<button data-w="'+n+'"'+(shown===n?' class="on"':'')+'>'+n+'w</button>';}).join('')+'</div></div>'
    +chartBox('c_sc',true)
    +'<div class="hint" style="margin:14px 0 6px">Click a row to plot it. Newest week first, as in the sheet.</div>'
    +'<div class="tw"><table class="t"><tr><th>Owner</th><th>Metric</th><th class="r">Goal</th>'
    +wk.map(function(w){return '<th class="r">'+esc(w)+'</th>';}).join('')+'</tr>'
    +mets.map(function(x){
        return '<tr data-m="'+esc(x.metric)+'" style="cursor:pointer'+(x.metric===sel?';background:#f4f7ff':'')+'">'
          +'<td>'+(x.owner?'<span class="pill">'+esc(x.owner)+'</span>':'')+'</td>'
          +'<td class="n">'+esc(x.metric)+'</td>'
          +'<td class="r">'+(x.goal&&x.goal[1]?esc(x.goal[1]):'—')+'</td>'
          +wk.map(function(w){return '<td class="r">'+esc(disp(x,w))+'</td>';}).join('')+'</tr>';
      }).join('')+'</table></div>';
  return h;

function scChart(SC){
  var weeks=scWeeks(), mets=SC.metrics||[];
  var shown=Math.min(weeks.length,S.scWeeks||13);
  var sel=S.scMetric||(mets.filter(function(x){return Object.keys(x.cells||{}).length>2;})[0]||mets[0]).metric;
  var selM=mets.filter(function(x){return x.metric===sel;})[0]||mets[0];
  function num(mt,w){ var c=(mt.cells||{})[w]; return c&&c[0]!=null?c[0]:null; }
  function disp(mt,w){ var c=(mt.cells||{})[w]; return c?c[1]:'—'; }
  // The sheet reads newest-first; a time series has to run forwards to mean anything, so reverse for the chart.
  var series=weeks.slice().reverse().slice(-shown);
  var goal=selM.goal&&selM.goal[0]!=null?selM.goal[0]:null;
  var pct=/%$/.test((disp(selM,series[series.length-1])||'').trim());
  var sets=[{label:selM.metric,data:series.map(function(w){return num(selM,w);}),borderColor:css('s1'),fill:false}];
  if(goal!=null) sets.push({label:'Goal',data:series.map(function(){return goal;}),borderColor:css('s3'),borderDash:[5,4],pointRadius:0});
  var cfg=lineCfg(series,sets);
  cfg.options.plugins.legend={display:goal!=null,position:'bottom'};
  if(pct) cfg.options.scales.y.ticks.callback=function(v){return fp(v,1);};
  cfg.options.plugins.tooltip={callbacks:{label:function(c){var w=series[c.dataIndex];
    return ' '+(c.dataset.label==='Goal'?('Goal: '+(pct?fp(goal,1):fm(goal))):disp(selM,w));}}};
  mk('c_sc',cfg);
}

// The session token lives in the stored auth blob, not on the profile object the app keeps in memory.
