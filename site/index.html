<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Grove Brewery — Store Director Portal</title>
<style>
:root{
  --navy:#1b2449;--green:#94bb36;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --surface:#ffffff;--plane:#f4f5f8;--border:rgba(11,11,11,.10);--good:#006300;--bad:#d03b3b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--sx:#9a9a94;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Brandon Grotesque','Josefin Sans','Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;background:var(--plane);color:var(--ink);font-size:14px}
button{font-family:inherit}
/* ---------- login shell ---------- */
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:50}
.card{background:#fff;border-radius:14px;padding:38px 42px;width:min(400px,calc(100vw - 40px));box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.card h1{font-size:19px;color:var(--navy);margin-bottom:4px}
.card .sub{font-size:12.5px;color:#6b7288;margin-bottom:24px}
#gbtn{display:flex;justify-content:center;min-height:44px}
#status{font-size:13px;color:#6b7288;margin-top:16px;min-height:18px;font-weight:600}
#err{color:#c0392b;font-size:12.5px;margin-top:8px;min-height:16px;font-weight:600}
.foot{margin-top:20px;font-size:10.5px;color:#9aa3c0;text-transform:uppercase;letter-spacing:.1em}
.stamp{margin-top:7px;font-size:11px;color:var(--green);font-weight:600}
.bar{height:5px;border-radius:3px;background:#e0e2ea;margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0%;background:var(--green);transition:width .2s}
/* ---------- app ---------- */
#app{display:none;min-height:100%}
header{background:var(--navy);color:#fff;padding:0 18px;display:flex;align-items:center;gap:14px;height:54px;position:sticky;top:0;z-index:10}
header .brand{font-weight:700;letter-spacing:.02em;font-size:15px}
header .brand span{color:var(--green)}
header nav{display:flex;gap:2px;margin-left:10px;overflow-x:auto}
header nav button{background:transparent;border:0;color:#c9cfe3;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
header nav button.on{background:rgba(255,255,255,.12);color:#fff}
header .who{margin-left:auto;font-size:12px;color:#c9cfe3;white-space:nowrap}
header .signout{background:transparent;border:1px solid rgba(255,255,255,.25);color:#c9cfe3;border-radius:7px;
  padding:5px 10px;margin-left:10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
header .signout:hover{background:rgba(255,255,255,.12);color:#fff}
header .who b{color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.filters label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.filters select,.filters input[type=date]{border:1px solid var(--border);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;background:#fff}
.filters .fresh{margin-left:auto;font-size:11.5px;color:var(--muted)}
main{padding:16px 18px 40px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .v{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;line-height:1.1}
.tile .d{font-size:12px;color:var(--ink2);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.tile .d .up{color:var(--good);font-weight:700}.tile .d .dn{color:var(--bad);font-weight:700}
.tile .d .tg{color:var(--muted)}
/* ---- scorecard: a workbook, not a dashboard ------------------------------------------------
   Deliberately unlike the POS pages: paper-white ground, a spreadsheet-style tab rail down the
   side rather than the portal's pill nav, denser type, and no tiles. The look should tell you at
   a glance that you are reading the company's own sheet rather than live POS numbers. */
body.sheetmode #main{background:#f2f1ec}
#usageWrap{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#usageBox{background:var(--surface);border-radius:12px;max-width:900px;width:100%;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
#usageBox h3{font-size:15px;color:var(--navy)}
#usageBox .x{float:right;background:transparent;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.wb{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.wb .rail{background:#f7f6f2;border-right:1px solid var(--border);padding:8px 0;max-height:calc(100vh - 150px);overflow-y:auto}
.wb .rail h4{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 14px 4px}
.wb .rail button{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;
  padding:7px 12px 7px 11px;font-size:12.5px;color:var(--ink2);cursor:pointer;line-height:1.25}
.wb .rail button:hover{background:#efeee8;color:var(--ink)}
.wb .rail button.on{background:var(--surface);border-left-color:var(--green);color:var(--navy);font-weight:700}
.wb .doc{padding:16px 18px;min-width:0}
.wb .doc h2{font-size:17px;color:var(--navy);margin:0 0 2px}
.wb .src{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.wb table.t{font-size:12px}
.wb table.t th{background:#f7f6f2;position:sticky;top:0;z-index:1}
.wb table.t td{border-bottom:1px solid #f0efe9}
.wb table.t tr:hover td{background:#fbfbf8}
@media(max-width:820px){.wb{grid-template-columns:1fr}.wb .rail{max-height:none;border-right:0;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
  .wb .rail h4{display:none}.wb .rail button{width:auto;border-left:0;border-radius:999px;padding:5px 10px;font-size:12px}
  .wb .rail button.on{background:var(--navy);color:#fff}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;overflow-x:auto}
.panel h3{font-size:13px;color:var(--navy);margin-bottom:2px}
.panel .hint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.panel .cw{position:relative;height:260px}
.panel .cw.tall{height:340px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--grid);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f6;white-space:nowrap}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t td.n{font-weight:700;color:var(--navy);white-space:normal;min-width:120px}
/* Name cells hold the longest text in every table (item names, vendors, events). Left on the global
   white-space:nowrap they push the table past its panel and the right-hand columns get clipped with no
   scrollbar to reach them, so they wrap instead and every table sits in an overflow-x:auto wrapper. */
.tw{overflow-x:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:44px repeat(14,1fr);gap:2px;font-size:11px}
.heat .h{color:var(--muted);text-align:center;padding:2px 0}
.heat .c{height:26px;border-radius:4px;position:relative}
.heat .c:hover::after{content:attr(data-t);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:4px 7px;border-radius:6px;white-space:nowrap;font-size:11px;z-index:5}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef0f6;color:var(--navy)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px}
.tt{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:6px 9px;border-radius:7px;font-size:11.5px;white-space:nowrap;display:none;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (max-width:720px){header{height:auto;flex-wrap:wrap;padding:8px 12px}header .who{display:none}header .signout{margin-left:auto}.panel .cw{height:220px}.cols2,.cols3{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>

<div id="login">
 <div class="card">
  <h1>Big Grove Brewery</h1>
  <div class="sub">Store Director Portal — sign in with your company Google account</div>
  <div id="gbtn"></div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div id="status"></div>
  <div id="err"></div>
  <div class="foot">Authorized personnel only</div>
  <div class="stamp" id="stamp"></div>
 </div>
</div>

<div id="app">
 <header>
  <div class="brand">BIG GROVE <span>STORE DIRECTOR PORTAL</span></div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
  <button id="usage" class="signout" title="Portal usage" hidden>Usage</button>
  <button id="signout" class="signout" title="Sign out">Sign out</button>
 </header>
 <div class="filters" id="filters">
  <label>Location</label><select id="locSel"></select>
  <label>Range</label>
  <div class="seg" id="rangeSeg"></div>
  <input type="date" id="d0"> <span style="color:var(--muted)">to</span> <input type="date" id="d1">
  <label>Compare</label>
  <div class="seg" id="cmpSeg"><button data-c="prior" class="on">Prior period</button><button data-c="ly">Last year</button></div>
  <div class="fresh" id="fresh"></div>
 </div>
 <main id="main"></main>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script>
/* =========================================================================================
   LOGIN SHELL — same protocol as the Sales Portal: Google ID token -> Apps Script -> bundle keys
   ========================================================================================= */
var CFG = {
  CLIENT_ID: '169287489700-t5en62nibhp9ttn24vfimd7k974dgl9i.apps.googleusercontent.com',
  API_URL:   'https://script.google.com/macros/s/AKfycbzaXWDdxKjR6s9n2AqDB2lePy2Gg4GxTMCmlS3bKhtTfev539hVoooSeBeC5xuFv2PBNQ/exec'
};
function $(id){return document.getElementById(id);}
function setStatus(t){$('status').textContent=t;}
function setErr(t){$('err').textContent=t;setStatus('');$('bar').style.display='none';}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function fetchBin(name,pct0,pct1){
  var r=await fetch(name,{cache:'no-store'}); if(!r.ok) throw new Error(name+' HTTP '+r.status);
  var len=+r.headers.get('Content-Length')||0,got=0,chunks=[],rd=r.body.getReader();
  for(;;){var c=await rd.read();if(c.done)break;chunks.push(c.value);got+=c.value.length;if(len)$('barfill').style.width=(pct0+(pct1-pct0)*(got/len))+'%';}
  var buf=new Uint8Array(got),o=0;for(var i=0;i<chunks.length;i++){buf.set(chunks[i],o);o+=chunks[i].length;}return buf;
}
async function decrypt(buf,keyB64){
  var key=await crypto.subtle.importKey('raw',ub64(keyB64),'AES-GCM',false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12)));
}
async function gunzipText(u8){
  if(typeof DecompressionStream!=='undefined'){return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
  await new Promise(function(res,rej){var s=document.createElement('script');s.src='vendor/pako.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return pako.ungzip(u8,{to:'string'});
}
/* Sign out. Beyond the obvious reason, this is the fix when someone's ACCESS changes: the signed-in session
   caches the bundle keys the backend handed out, so a role change (say, being granted the leadership
   scorecard) does not reach an open session until it signs in again. Google's auto-select is disabled too,
   otherwise the next page load silently signs the same account straight back in. */
function signOut(){
  try{ sessionStorage.removeItem('sdp_auth'); }catch(e){}
  try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  location.replace(location.pathname);
}
/* auth = {ok, profile:{email,name,role,locations}, bundles:[{label,id,key}], sid} */
async function boot(auth){
  try{ if(auth.sid) navigator.sendBeacon(CFG.API_URL, JSON.stringify({a:'ping',s:auth.sid})); }catch(e){}
  $('bar').style.display='block'; setStatus('Loading portal data…');
  // bundles[0] is the data bundle: 'all' for leadership/admin, else the director's own location (multi-location
  // directors get 'all', scoped client-side by their roster entry). Any further bundle is an add-on the backend
  // chose to grant — currently the leadership-only scorecard — and is merged in on top.
  var b=auth.bundles[0];
  var buf=await fetchBin('data/'+b.id+'.bin',0,75);
  setStatus('Decrypting…');
  var data=JSON.parse(await gunzipText(await decrypt(buf,b.key)));
  for(var i=1;i<auth.bundles.length;i++){
    var x=auth.bundles[i];
    try{
      var xb=await fetchBin('data/'+x.id+'.bin',75,90);
      var xd=JSON.parse(await gunzipText(await decrypt(xb,x.key)));
      Object.keys(xd).forEach(function(k){ if(k!=='meta') data[k]=xd[k]; });
    }catch(e){ /* an add-on that fails to load must never block the portal itself */ }
  }
  if(auth.profile.locations && auth.profile.locations!=='all'){
    var allow=String(auth.profile.locations).split(',').map(function(s){return s.trim();});
    data.locations=data.locations.filter(function(l){return allow.indexOf(l.id)>=0;});
  }
  $('barfill').style.width='100%';
  startApp(data, auth.profile);
}
async function onCred(resp){
  var j;
  try{
    setStatus('Checking access…'); $('err').textContent='';
    var r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'signin',t:resp.credential})});
    j=await r.json();
    if(!j.ok){ setErr(j.error==='not on the roster'?'Your account is not on the portal roster — ask Troy to add you.':('Sign-in refused: '+(j.error||'unknown'))); return; }
    try{ sessionStorage.setItem('sdp_auth',JSON.stringify(j)); }catch(e){}
  }catch(e){ setErr('Could not reach the sign-in service. '+e.message); return; }
  try{ await boot(j); }catch(e){ try{sessionStorage.removeItem('sdp_auth');}catch(_){} setErr('Signed in OK, but the portal data failed to load — refresh and try again. ('+e.message+')'); }
}
var gsiOK=false;
function gsiFail(){ if(gsiOK||$('gbtn').firstChild)return; setErr('The Google sign-in button could not load. Open the portal directly in Chrome or Safari (not inside Gmail/Outlook/Messages) and try again.'); }
function initGsi(){
  if(CFG.CLIENT_ID.indexOf('PASTE_')===0||CFG.API_URL.indexOf('PASTE_')===0){ setErr('Setup incomplete: CLIENT_ID / API_URL not configured yet (see docs/SETUP.md).'); return; }
  google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:onCred,auto_select:false});
  google.accounts.id.renderButton($('gbtn'),{theme:'filled_blue',size:'large',shape:'pill',width:280});
  gsiOK=true;
}
window.addEventListener('load',function(){
  fetch('data/manifest.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(m){ $('stamp').textContent='Data through '+m.through; }).catch(function(){});
  if(/[?&]dev=1/.test(location.search)){ // local preview of an unencrypted build (python -m sdp build --no-encrypt)
    fetch('data/dev.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ startApp(d,{name:'Dev preview',role:'Admin',email:''}); }).catch(function(e){ setErr('dev.json not found — run: python -m sdp build --no-encrypt'); });
    return;
  }
  try{ var s=sessionStorage.getItem('sdp_auth'); if(s){ boot(JSON.parse(s)).catch(function(e){ try{sessionStorage.removeItem('sdp_auth');}catch(_){} setErr('Session reload failed — sign in again. '+e.message); }); return; } }catch(e){}
  setTimeout(gsiFail,6000);
});
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGsi()" onerror="gsiFail()"></script>

<script>
/* =========================================================================================
   DASHBOARD APP
   ========================================================================================= */
var D=null, P=null, S={loc:'all', preset:'l28', d0:null, d1:null, cmp:'prior', page:'overview', actSrc:'all'};
var K=null; // daily key index
var BUCKETS=[['Food','f','pf','s1'],['Beer','b','pb','s2'],['Liquor','l','pl','s3'],['Wine','w','pw','s4'],['NA Bev','n','pn','s5'],['Retail','r',null,'s6'],['Other','x','po','sx']];
var LOCCOL=['s1','s2','s3','s4','s5','s6','s7','s8'];
var PAGES=[['overview','Overview'],['sales','Sales'],['labor','Labor'],['cogs','COGS & Purchasing'],['inventory','Inventory'],['events','Events'],['activations','Activations'],['scorecard','Scorecard'],['locations','Locations']];
var charts=[];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();}
function fm(n,d){ if(n==null||isNaN(n))return '—'; d=d==null?0:d; return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fk(n){ if(n==null||isNaN(n))return '—'; return Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?'$'+(n/1e3).toFixed(1)+'k':fm(n); }
function fn(n,d){ if(n==null||isNaN(n))return '—'; return Number(n).toLocaleString(undefined,{maximumFractionDigits:d||0}); }
function fp(x,d){ if(x==null||isNaN(x)||!isFinite(x))return '—'; return (x*100).toFixed(d==null?1:d)+'%'; }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function dow(s){return pd(s).getDay();}
function fdate(s){return pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});}

function startApp(data,profile){
  D=data; P=profile; K={}; D.meta.daily_keys.forEach(function(k,i){K[k]=i;});
  $('login').style.display='none'; $('app').style.display='block';
  $('who').innerHTML='<b>'+esc(P.name||P.email)+'</b> · '+esc(P.role||'');
  $('signout').onclick=signOut;
  // Admins only. The button is hidden for everyone else, but that is cosmetic — the backend checks the
  // session's own role before returning anything, so hiding it is convenience, not the control.
  if(/^admin/i.test(P.role||'')){ $('usage').hidden=false; $('usage').onclick=showUsage; }
  // If the page itself is older than the published build, the browser is serving a cached index.html and the
  // user is looking at yesterday's app with today's data. Say so plainly rather than letting them wonder why
  // a change "did not ship".
  $('fresh').textContent='Data through '+fdate(D.meta.through)+' · built '+new Date(D.meta.built_at).toLocaleString();
  (async function(){
    try{
      var live=await (await fetch('data/manifest.json',{cache:'no-store'})).json();
      if(live.built_at && live.built_at!==D.meta.built_at){
        $('fresh').innerHTML+=' · <a href="#" id="rl" style="color:var(--bad);font-weight:700">newer build available — reload</a>';
        $('rl').onclick=function(e){e.preventDefault();location.reload(true);};
      }
    }catch(e){}
  })();
  var ls=$('locSel'); ls.innerHTML='';
  if(D.locations.length>1) ls.appendChild(new Option('All locations','all'));
  D.locations.forEach(function(l){ls.appendChild(new Option(l.name,l.id));});
  S.loc=D.locations.length>1?'all':D.locations[0].id; ls.value=S.loc;
  ls.onchange=function(){S.loc=ls.value;render();};
  var seg=$('rangeSeg'); [['l7','Last 7'],['l28','Last 28'],['mtd','MTD'],['qtd','QTD'],['ytd','YTD'],['l91','Last 91']].forEach(function(p){
    var b=document.createElement('button');b.textContent=p[1];b.dataset.p=p[0];b.onclick=function(){S.preset=p[0];applyPreset();render();};seg.appendChild(b);});
  $('d0').onchange=$('d1').onchange=function(){S.preset='custom';S.d0=$('d0').value;S.d1=$('d1').value;render();};
  $('cmpSeg').querySelectorAll('button').forEach(function(b){b.onclick=function(){S.cmp=b.dataset.c;render();};});
  var nav=$('nav'); PAGES.filter(function(p){ return p[0]!=='scorecard' || hasScorecard(); }).forEach(function(p){var b=document.createElement('button');b.textContent=p[1];b.dataset.p=p[0];b.onclick=function(){S.page=p[0];render();};nav.appendChild(b);});
  applyPreset(); render();
}
function applyPreset(){
  var T=D.meta.through, t=pd(T);
  var map={l7:addDays(T,-6),l28:addDays(T,-27),l91:addDays(T,-90),mtd:ds(new Date(t.getFullYear(),t.getMonth(),1)),qtd:ds(new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1)),ytd:ds(new Date(t.getFullYear(),0,1))};
  if(map[S.preset]){S.d0=map[S.preset];S.d1=T;}
  $('d0').value=S.d0;$('d1').value=S.d1;
}
/* ---- data access ---- */
function locIds(){return S.loc==='all'?D.locations.map(function(l){return l.id;}):[S.loc];}
function rowsIn(lid,a,b){ return (D.daily[lid]||[]).filter(function(r){return r[0]>=a&&r[0]<=b;}); }
function sumRows(rows){ var s={}; D.meta.daily_keys.forEach(function(k){if(k!=='d')s[k]=0;}); rows.forEach(function(r){D.meta.daily_keys.forEach(function(k,i){if(k!=='d')s[k]+=(r[i]||0);});}); s.days=rows.length; return s; }
function agg(a,b){ var all=[]; locIds().forEach(function(l){all=all.concat(rowsIn(l,a,b));}); return sumRows(all); }
function byDate(a,b){ var m={}; locIds().forEach(function(l){rowsIn(l,a,b).forEach(function(r){var o=m[r[0]]||(m[r[0]]={});D.meta.daily_keys.forEach(function(k,i){if(k!=='d')o[k]=(o[k]||0)+(r[i]||0);});});}); return Object.keys(m).sort().map(function(d){m[d].d=d;return m[d];}); }
function cmpWindow(){ var n=(pd(S.d1)-pd(S.d0))/864e5+1; if(S.cmp==='ly'){var a=pd(S.d0),b=pd(S.d1);a.setFullYear(a.getFullYear()-1);b.setFullYear(b.getFullYear()-1);return [ds(a),ds(b)];} return [addDays(S.d0,-n),addDays(S.d0,-1)]; }
function hasData(a,b){ return locIds().some(function(l){return rowsIn(l,a,b).length>0;}); }
function targetsFor(a,b){ // sum monthly targets prorated by days in range
  var t={sales:0,guests:0,cogs:[],labor:[]}; locIds().forEach(function(l){ var tg=D.targets[l]||{}; var d=pd(a); while(ds(d)<=b){ var m=ds(d).slice(0,7); var x=tg[m]; if(x){ var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); t.sales+=(x[0]||0)/dim; t.guests+=(x[3]||0)/dim; if(x[1])t.cogs.push(x[1]); if(x[2])t.labor.push(x[2]); } d.setDate(d.getDate()+1);} });
  var avg=function(z){return z.length?z.reduce(function(p,c){return p+c;},0)/z.length:null;}; t.cogs=avg(t.cogs); t.labor=avg(t.labor); return t; }
function kpis(a,b){ var s=agg(a,b); return {net:s.net,gross:s.gross,disc:s.disc,guests:s.guests,orders:s.orders,checks:s.checks,avgCheck:s.checks?s.net/s.checks:null,ppa:s.guests?s.net/s.guests:null,
  labor:s.lc,laborPct:s.net?s.lc/s.net:null,hours:s.lh,splh:s.lh?s.net/s.lh:null,purch:s.p,purchPct:s.net?s.p/s.net:null,tips:s.tips,ref:s.ref,days:s.days,
  food:s.f,beer:s.b,liquor:s.l,wine:s.w,nabev:s.n,retail:s.r,other:s.x,pf:s.pf,pb:s.pb,pl:s.pl,pw:s.pw,pn:s.pn,po:s.po}; }

/* ---- rendering helpers ---- */
function wkLabel(w,o){return 'wk '+fdate(w)+((o&&o._n&&o._n<7)?' (partial)':'');}
function hasToast(){ return locIds().some(function(l){var x=(D.sources||{})[l];return x&&x.toast;}); }
function needToast(what){ return '<div class="empty">'+what+' needs the Toast API connection (order-level detail). MarginEdge supplies sales by category, labor cost, purchases, P&amp;L and inventory in the meantime.</div>'; }
function tileNT(label){ return '<div class="tile"><div class="l">'+label+'</div><div class="v" style="font-size:15px;color:var(--muted);margin-top:10px">Needs Toast</div><div class="d"><span class="tg">order-level data</span></div></div>'; }
function killCharts(){charts.forEach(function(c){try{c.destroy();}catch(e){}});charts=[];}
function delta(cur,prev,inv){ if(cur==null||prev==null||!prev)return '<span class="tg">no comparison</span>'; var d=(cur-prev)/Math.abs(prev); var up=d>=0; var good=inv?!up:up; return '<span class="'+(good?'up':'dn')+'">'+(up?'▲':'▼')+' '+fp(Math.abs(d),1)+'</span><span class="tg">vs '+(S.cmp==='ly'?'LY':'prior')+'</span>'; }
function tile(label,val,dl,extra){ return '<div class="tile"><div class="l">'+label+'</div><div class="v">'+val+'</div><div class="d">'+(dl||'')+(extra||'')+'</div></div>'; }
function panel(title,hint,body,cls){ return '<div class="panel '+(cls||'')+'"><h3>'+title+'</h3><div class="hint">'+(hint||'')+'</div>'+body+'</div>'; }
function chartBox(id,tall){ return '<div class="cw'+(tall?' tall':'')+'"><canvas id="'+id+'"></canvas></div>'; }
if(window.Chart){Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.color=css('ink2'); Chart.defaults.borderColor=css('grid');}
var baseOpts=function(o){ return Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:css('navy'),titleFont:{weight:'700'},padding:8,callbacks:{label:function(c){var v=c.parsed.y!=null?c.parsed.y:c.parsed;return ' '+c.dataset.label+': '+(c.dataset.fmt==='pct'?fp(v):c.dataset.fmt==='int'?fn(v):fm(v));}}}},
  scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:10}},y:{beginAtZero:true,grid:{color:css('grid')},border:{display:false},ticks:{callback:function(v){return fk(v);}}}}},o||{}); };
function mk(id,cfg){ if(!window.Chart){$(id).parentNode.innerHTML='<div class="empty">Chart library failed to load.</div>';return null;} var c=new Chart($(id).getContext('2d'),cfg); charts.push(c); return c; }
function lineCfg(labels,sets){ return {type:'line',data:{labels:labels,datasets:sets.map(function(s){return Object.assign({borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.25,fill:false},s);})},options:baseOpts()}; }

/* ---- pages ---- */
function render(){
  killCharts();
  // The scorecard comes from a Google Sheet, not the POS: location, date range and the prior-period
  // comparison are all meaningless against it, so the filter bar is hidden rather than left there
  // looking operative.
  var sc=(S.page==='scorecard');
  $('filters').style.display=sc?'none':'';
  document.body.classList.toggle('sheetmode',sc);
  document.querySelectorAll('#rangeSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.p===S.preset);});
  document.querySelectorAll('#cmpSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.c===S.cmp);});
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===S.page);});
  var m=$('main'); m.innerHTML='';
  if(S.page==='scorecard' && !hasScorecard()) S.page='overview';
  ({overview:pgOverview,sales:pgSales,labor:pgLabor,cogs:pgCogs,inventory:pgInventory,events:pgEvents,activations:pgActivations,scorecard:pgScorecard,locations:pgLocations})[S.page](m);
}

    options:baseOpts({scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:css('grid')},border:{display:false},ticks:{callback:function(v){return fk(v);}}}},plugins:{legend:{display:true,position:'bottom'},tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fk(c.parsed.y);}}}}})});

function pgLabor(m){

function pgActivations(m){
  var acts=D.activations.filter(function(x){return locIds().indexOf(x.loc)>=0;}).map(function(x){
    return {loc:x.loc,s:x.s,e:x.e,name:x.name,type:x.type||'Promo',cost:x.cost,owner:x.owner,notes:x.notes,src:'csv'};});
  if(S.actSrc!=='csv'){
    evRows().filter(function(e){return evIsDef(e.status)&&e.d<=D.meta.through;}).forEach(function(e){
      acts.push({loc:e.loc,s:e.d,e:e.d,name:e.name,type:'Private event',cost:0,owner:'Events',
                 notes:fn(e.guests)+' guests',src:'tripleseat',value:evValue(e)});});
  }
  if(S.actSrc==='events') acts=acts.filter(function(x){return x.src==='tripleseat';});
  acts.sort(function(x,y){return y.s<x.s?-1:1;});
  if(!acts.length){m.innerHTML='<div class="panel"><div class="empty">Nothing in this view — add rows to inputs/activations.csv, or connect Tripleseat for private events.</div></div>';return;}
  var rows=acts.map(function(x){
    var e=x.e||x.s, n=(pd(e)-pd(x.s))/864e5+1;
    var ev=sumRows(rowsIn(x.loc,x.s,e));
    var loc=D.locations.filter(function(z){return z.id===x.loc;})[0];
    // Lift-vs-baseline answers "did this bring in business we wouldn't otherwise have had?" — a fair question
    // for a marketing promo. A booked private event is different: its revenue is already inside the day's net
    // sales, so a day-over-day delta measures the rest of the taproom, not the event. Events report their
    // contracted value instead; only marketing activations get a baseline.
    var baseline=null, lift=null;
    if(x.src!=='tripleseat'){
      var base=0,bn=0; for(var w=1;w<=4;w++){var r=sumRows(rowsIn(x.loc,addDays(x.s,-7*w),addDays(e,-7*w)));if(r.days){base+=r.net;bn++;}}
      baseline=bn?base/bn:null; lift=baseline!=null?ev.net-baseline:null;
    }
    return {x:x,loc:loc?loc.name:x.loc,days:n,net:ev.net,guests:ev.guests,baseline:baseline,lift:lift,
            value:(x.src==='tripleseat'?(x.value||0):null), roi:(lift!=null&&x.cost)?lift/x.cost:null};
  });
  var mk_=rows.filter(function(r){return r.x.src!=='tripleseat';}), evs=rows.filter(function(r){return r.x.src==='tripleseat';});

  var evVal=evs.reduce(function(p,c){return p+(c.value||0);},0);
  var nEv=evs.length;
  var seg=hasEvents()?('<div class="seg" style="margin-left:auto">'+['all','csv','events'].map(function(v){return '<button data-as="'+v+'"'+((S.actSrc||'all')===v?' class="on"':'')+'>'+({all:'All',csv:'Marketing only',events:'Events only'})[v]+'</button>';}).join('')+'</div>'):'';
  m.innerHTML='<div class="grid tiles">'+tile('Activations',fn(rows.length),(nEv?'<span class="tg">'+fn(mk_.length)+' marketing · '+fn(nEv)+' events</span>':''))
    +tile('Marketing spend',fk(tc),'')
    +tile('Marketing lift',fk(tl),'<span class="tg">vs 4-week same-weekday baseline</span>')
    +tile('Lift ÷ cost',tc?(tl/tc).toFixed(1)+'×':'—','<span class="tg">marketing only</span>')
    +(nEv?tile('Event revenue',fk(evVal),'<span class="tg">contracted value, already in net sales</span>'):'')+'</div>'
    +'<div class="panel" style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px"><h3 style="margin:0">Activation log</h3>'+seg+'</div><div class="hint">Lift = net sales on activation days minus the average of the same weekdays in the prior 4 weeks. Marketing promos come from inputs/activations.csv and are measured against that baseline; private events come from Tripleseat and show their contracted value, which is already counted inside net sales.</div>'
    +'<div style="overflow-x:auto"><table class="t"><tr><th>Date</th><th>Location</th><th>Activation</th><th>Type</th><th>Owner</th><th class="r">Cost</th><th class="r">Booked</th><th class="r">Net sales</th><th class="r">Baseline</th><th class="r">Lift</th><th class="r">Lift ÷ cost</th><th>Notes</th></tr>'
    +rows.map(function(r){return '<tr><td>'+fdate(r.x.s)+(r.days>1?'–'+fdate(r.x.e):'')+'</td><td>'+esc(r.loc)+'</td><td class="n">'+esc(r.x.name)+'</td><td><span class="pill">'+esc(r.x.type||'')+'</span></td><td>'+esc(r.x.owner||'')+'</td><td class="r">'+(r.x.src==='tripleseat'?'—':fm(r.x.cost))+'</td><td class="r">'+(r.value!=null?fm(r.value):'—')+'</td><td class="r">'+fm(r.net)+'</td><td class="r">'+(r.baseline!=null?fm(r.baseline):'—')+'</td><td class="r"'+(r.lift!=null?' style="color:'+(r.lift>=0?'var(--good)':'var(--bad)')+';font-weight:700"':'')+'>'+(r.lift!=null?(r.lift>=0?'+':'')+fm(r.lift):'—')+'</td><td class="r">'+(r.roi!=null?r.roi.toFixed(1)+'×':'—')+'</td><td style="white-space:normal;max-width:260px">'+esc(r.x.notes||'')+'</td></tr>';}).join('')+'</table></div></div>';
  m.querySelectorAll('[data-as]').forEach(function(b){b.onclick=function(){S.actSrc=b.dataset.as;render();};});
}

function pgLocations(m){
  var a=S.d0,b=S.d1,cw=cmpWindow();
  // A location that opened partway through the window has no comparable prior period: comparing a full range
  // against days before it existed reports growth that is really just the opening. Suppress the delta instead.
  var rows=D.locations.map(function(l){ var s=sumRows(rowsIn(l.id,a,b)), p=sumRows(rowsIn(l.id,cw[0],cw[1]));
    return {l:l,s:s,p:p,partial:(l.first_date&&cw[0]<l.first_date)}; });
  var anyNew=rows.some(function(r){return r.partial;});
  m.innerHTML='<div class="panel"><h3>Location scorecard</h3><div class="hint">All locations for the selected range; change vs '+(S.cmp==='ly'?'last year':'prior period')+(anyNew?'. Locations marked <span class="pill">new</span> opened partway through this window, so there is no comparable prior period and their change is shown as —.':'')+'</div><div style="overflow-x:auto"><table class="t"><tr><th>Location</th><th class="r">Net sales</th><th class="r">Δ</th><th class="r">Guests</th><th class="r">Avg check</th><th class="r">PPA</th><th class="r">Labor %</th><th class="r">Purch %</th><th class="r">SPLH</th><th class="r">Discounts</th></tr>'
    +rows.map(function(r,i){var s=r.s,p=r.p;var d=(p.net&&!r.partial)?(s.net-p.net)/p.net:null;return '<tr><td class="n"><i class="sw" style="background:'+css(LOCCOL[i%8])+'"></i>'+esc(r.l.name)+(r.partial?' <span class="pill" title="Opened '+fdate(r.l.first_date)+' — no comparable prior period">new</span>':'')+'</td><td class="r">'+fm(s.net)+'</td><td class="r" style="color:'+(d>=0?'var(--good)':'var(--bad)')+';font-weight:700">'+(d!=null?(d>=0?'+':'')+fp(d):'—')+'</td><td class="r">'+fn(s.guests)+'</td><td class="r">'+fm(s.checks?s.net/s.checks:null,2)+'</td><td class="r">'+fm(s.guests?s.net/s.guests:null,2)+'</td><td class="r">'+fp(s.net?s.lc/s.net:null)+'</td><td class="r">'+fp(s.net?s.p/s.net:null)+'</td><td class="r">'+fm(s.lh?s.net/s.lh:null,0)+'</td><td class="r">'+fm(s.disc)+'</td></tr>';}).join('')+'</table></div></div>'
    +'<div class="grid cols2" style="margin-top:14px">'+panel('Net sales by week by location','',chartBox('c_locs',true))+panel('Labor % by week by location','',chartBox('c_loclab',true))+'</div>';
  var wkAll={}; D.locations.forEach(function(l){rowsIn(l.id,a,b).forEach(function(r){var d=pd(r[0]);d.setDate(d.getDate()-((d.getDay()+6)%7));var w=ds(d);var o=wkAll[w]||(wkAll[w]={_n:0});if(l.id===D.locations[0].id)o._n++;var q=o[l.id]||(o[l.id]={net:0,lc:0});q.net+=r[K.net];q.lc+=r[K.lc];});});
  var wks=Object.keys(wkAll).sort();
  var c1=lineCfg(wks.map(function(w){return wkLabel(w,wkAll[w]);}),D.locations.map(function(l,i){return {label:l.name,data:wks.map(function(w){return wkAll[w][l.id]?wkAll[w][l.id].net:null;}),borderColor:css(LOCCOL[i%8])};})); c1.options.plugins.legend={display:true,position:'bottom'}; mk('c_locs',c1);
  var c2=lineCfg(wks.map(function(w){return wkLabel(w,wkAll[w]);}),D.locations.map(function(l,i){return {label:l.name,data:wks.map(function(w){var q=wkAll[w][l.id];return q&&q.net?q.lc/q.net:null;}),borderColor:css(LOCCOL[i%8]),fmt:'pct'};})); c2.options.plugins.legend={display:true,position:'bottom'}; c2.options.scales.y.ticks.callback=function(v){return fp(v,0);}; mk('c_loclab',c2);
}

/* ---------- Leadership Scorecard (Google Sheets, shown as the sheet formats it) ---------- */
function hasScorecard(){ return !!(D.scorecard && (((D.scorecard.metrics||[]).length)||((D.scorecard.tabs||[]).length))); }
function scTabs(){ return (D.scorecard.tabs||[]); }
// Tabs other than the headline scorecard have no common shape, so they are rendered as the sheet's own grid:
// first row as headers, blank-padded columns dropped, numeric-looking cells right-aligned.
function scGrid(t){
  var g=t.grid||[]; if(!g.length) return '<div class="empty">This tab has no cell data — it may be chart-only.</div>';
  var w=0; g.forEach(function(r){ for(var i=r.length-1;i>=0;i--){ if(String(r[i]).trim()){ if(i+1>w)w=i+1; break; } } });
  if(!w) return '<div class="empty">This tab is empty.</div>';
  function isNum(v){ return /^[-+(]?[$]?[\d,]+(\.\d+)?[%)]?$/.test(String(v).trim()) && /\d/.test(String(v)); }
  var head=g[0]||[], body=g.slice(1);
  var h='<div class="tw"><table class="t"><tr>'+Array.from({length:w}).map(function(_,i){return '<th'+(isNum(body.length&&body[0]?body[0][i]:'')?' class="r"':'')+'>'+esc(head[i]||'')+'</th>';}).join('')+'</tr>';
  h+=body.map(function(r){
    var blank=true; for(var i=0;i<w;i++) if(String(r[i]||'').trim()) blank=false;
    if(blank) return '<tr><td colspan="'+w+'" style="height:6px;border:0"></td></tr>';
    return '<tr>'+Array.from({length:w}).map(function(_,i){var v=String(r[i]||'');return '<td'+(isNum(v)?' class="r"':(i===0||i===1?' class="n"':''))+'>'+esc(v)+'</td>';}).join('')+'</tr>';
  }).join('');
  return h+'</table></div>'+(t.truncated?'<div class="hint" style="margin-top:6px">Showing the first '+fn(g.length)+' of '+fn(t.rows)+' rows and '+fn(Math.min(w,t.cols))+' of '+fn(t.cols)+' columns — this tab was capped so the portal stays quick to load.</div>':'');
}
function scWeeks(){ return (D.scorecard.weeks||[]).slice(); }

function pgScorecard(m){
  if(!hasScorecard()){ m.innerHTML='<div class="panel"><h3>Leadership Scorecard</h3><div class="empty">No scorecard data yet.</div></div>'; return; }
  var SC=D.scorecard, tabs=scTabs(), primary=SC.sheet||'', cur=S.scTab||primary;
  if(!tabs.filter(function(t){return t.name===cur;}).length && tabs.length) cur=tabs[0].name;

  var rail='<div class="rail"><h4>'+esc(SC.workbook||'Workbook')+'</h4>'
    +tabs.map(function(t){return '<button data-t="'+esc(t.name)+'"'+(t.name===cur?' class="on"':'')+'>'+esc(t.name)+'</button>';}).join('')
    +'</div>';

  var body;
  if(cur===primary && (SC.metrics||[]).length){ body=scPrimary(SC); }
  else{
    var t=tabs.filter(function(x){return x.name===cur;})[0];
    body='<h2>'+esc(cur)+'</h2><div class="src">Shown as the sheet formats it.</div>'+(t?scGrid(t):'<div class="empty">Tab not found.</div>');
  }

  m.innerHTML='<div class="wb">'+rail+'<div class="doc">'+body+'</div></div>';
  if(cur===primary && (SC.metrics||[]).length) scChart(SC);
  m.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){S.scTab=b.dataset.t;S.scMetric=null;render();};});
  m.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){S.scWeeks=+b.dataset.w;render();};});
  m.querySelectorAll('[data-m]').forEach(function(tr){tr.onclick=function(){S.scMetric=tr.dataset.m;render();};});
}

// The headline tab is the one with a known shape (owner / metric / goal / weekly cells), so it gets a real
// reading layout: pick a metric, see it plotted against its goal, with the weekly grid underneath.
function scPrimary(SC){
  var weeks=scWeeks(), mets=SC.metrics||[];
  var shown=Math.min(weeks.length,S.scWeeks||13);
  var sel=S.scMetric||(mets.filter(function(x){return Object.keys(x.cells||{}).length>2;})[0]||mets[0]).metric;
  var selM=mets.filter(function(x){return x.metric===sel;})[0]||mets[0];
  function disp(mt,w){ var c=(mt.cells||{})[w]; return c?c[1]:'—'; }
  var wk=weeks.slice(0,shown);
  var h='<h2>'+esc(SC.sheet||'')+'</h2><div class="src">From '+esc(SC.workbook||'Google Sheets')+' · refreshed nightly · figures shown exactly as the sheet formats them</div>'
    +'<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px">'
    +'<div style="font-weight:700;color:var(--navy)">'+esc(selM.metric)+'</div>'
    +(selM.goal&&selM.goal[1]?'<div class="hint">goal '+esc(selM.goal[1])+'</div>':'')
    +'<div class="seg" style="margin-left:auto">'+[13,26,52].map(function(n){return '<button data-w="'+n+'"'+(shown===n?' class="on"':'')+'>'+n+'w</button>';}).join('')+'</div></div>'
    +chartBox('c_sc',true)
    +'<div class="hint" style="margin:14px 0 6px">Click a row to plot it. Newest week first, as in the sheet.</div>'
    +'<div class="tw"><table class="t"><tr><th>Owner</th><th>Metric</th><th class="r">Goal</th>'
    +wk.map(function(w){return '<th class="r">'+esc(w)+'</th>';}).join('')+'</tr>'
    +mets.map(function(x){
        return '<tr data-m="'+esc(x.metric)+'" style="cursor:pointer'+(x.metric===sel?';background:#f4f7ff':'')+'">'
          +'<td>'+(x.owner?'<span class="pill">'+esc(x.owner)+'</span>':'')+'</td>'
          +'<td class="n">'+esc(x.metric)+'</td>'
          +'<td class="r">'+(x.goal&&x.goal[1]?esc(x.goal[1]):'—')+'</td>'
          +wk.map(function(w){return '<td class="r">'+esc(disp(x,w))+'</td>';}).join('')+'</tr>';
      }).join('')+'</table></div>';
  return h;
}

function scChart(SC){
  var weeks=scWeeks(), mets=SC.metrics||[];
  var shown=Math.min(weeks.length,S.scWeeks||13);
  var sel=S.scMetric||(mets.filter(function(x){return Object.keys(x.cells||{}).length>2;})[0]||mets[0]).metric;
  var selM=mets.filter(function(x){return x.metric===sel;})[0]||mets[0];
  function num(mt,w){ var c=(mt.cells||{})[w]; return c&&c[0]!=null?c[0]:null; }
  function disp(mt,w){ var c=(mt.cells||{})[w]; return c?c[1]:'—'; }
  // The sheet reads newest-first; a time series has to run forwards to mean anything, so reverse for the chart.
  var series=weeks.slice().reverse().slice(-shown);
  var goal=selM.goal&&selM.goal[0]!=null?selM.goal[0]:null;
  var pct=/%$/.test((disp(selM,series[series.length-1])||'').trim());
  var sets=[{label:selM.metric,data:series.map(function(w){return num(selM,w);}),borderColor:css('s1'),fill:false}];
  if(goal!=null) sets.push({label:'Goal',data:series.map(function(){return goal;}),borderColor:css('s3'),borderDash:[5,4],pointRadius:0});
  var cfg=lineCfg(series,sets);
  cfg.options.plugins.legend={display:goal!=null,position:'bottom'};
  if(pct) cfg.options.scales.y.ticks.callback=function(v){return fp(v,1);};
  cfg.options.plugins.tooltip={callbacks:{label:function(c){var w=series[c.dataIndex];
    return ' '+(c.dataset.label==='Goal'?('Goal: '+(pct?fp(goal,1):fm(goal))):disp(selM,w));}}};
  mk('c_sc',cfg);
}


/* ---------- portal usage (admin only) ---------- */
// The session token lives in the stored auth blob, not on the profile object the app keeps in memory.
function sessionSid(){ try{ return (JSON.parse(sessionStorage.getItem('sdp_auth')||'{}').sid)||''; }catch(e){ return ''; } }

function showUsage(){
  var w=document.createElement('div'); w.id='usageWrap';
  w.innerHTML='<div id="usageBox"><button class="x" title="Close">&times;</button><h3>Portal usage</h3>'
    +'<div class="hint">Who is actually opening the portal. Live from the sign-in log, not the nightly build.</div>'
    +'<div id="usageBody" style="margin-top:12px"><div class="empty">Loading…</div></div></div>';
  document.body.appendChild(w);
  function close(){ w.remove(); }
  w.querySelector('.x').onclick=close;
  w.onclick=function(e){ if(e.target===w) close(); };
  (async function(){
    try{
      var r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({a:'usage',s:sessionSid()})});
      var j=await r.json();
      if(!j.ok){ $('usageBody').innerHTML='<div class="empty">'+esc(j.error||'Could not load usage.')+'</div>'; return; }
      var ppl=j.people||[], never=j.never||[], rec=j.recent||[];
      var opens=ppl.reduce(function(p,c){return p+(c.opens||0);},0);
      var active=ppl.filter(function(x){ return x.last && (Date.now()-new Date(x.last))<7*864e5; }).length;
      $('usageBody').innerHTML='<div class="grid tiles">'
        +tile('On the roster',fn(ppl.length+never.length),'')
        +tile('Signed in at least once',fn(ppl.length),(never.length?'<span class="tg">'+fn(never.length)+' never have</span>':''))
        +tile('Active in last 7 days',fn(active),'')
        +tile('Portal opens',fn(opens),'')
        +'</div>'
        +'<div class="tw" style="margin-top:14px"><table class="t"><tr><th>Person</th><th>Role</th><th>Locations</th><th class="r">Sign-ins</th><th class="r">Opens</th><th class="r">Days used</th><th>Last seen</th></tr>'
        +ppl.map(function(x){return '<tr><td class="n">'+esc(x.name||x.email)+'<div class="tg" style="font-weight:400">'+esc(x.email)+'</div></td>'
          +'<td><span class="pill">'+esc(x.role||'')+'</span></td><td>'+esc(x.locations||'')+'</td>'
          +'<td class="r">'+fn(x.signins)+'</td><td class="r">'+fn(x.opens)+'</td><td class="r">'+fn(x.activeDays)+'</td>'
          +'<td>'+(x.last?new Date(x.last).toLocaleString():'—')+'</td></tr>';}).join('')
        +'</table></div>'
        +(never.length?('<div class="panel" style="margin-top:14px;border-color:#f3d9d9"><h3>Never signed in</h3>'
          +'<div class="hint">On the roster but has not opened the portal once.</div>'
          +'<div class="tw" style="margin-top:8px"><table class="t"><tr><th>Person</th><th>Role</th><th>Locations</th></tr>'
          +never.map(function(x){return '<tr><td class="n">'+esc(x.name||x.email)+'<div class="tg" style="font-weight:400">'+esc(x.email)+'</div></td><td>'+esc(x.role||'')+'</td><td>'+esc(x.locations||'')+'</td></tr>';}).join('')
          +'</table></div></div>'):'')
        +(rec.length?('<div class="hint" style="margin-top:14px">Recent activity</div><div class="tw"><table class="t">'
          +rec.slice(0,20).map(function(r2){return '<tr><td>'+new Date(r2[0]).toLocaleString()+'</td><td class="n">'+esc(r2[2]||r2[1])+'</td><td>'+esc(r2[3])+'</td></tr>';}).join('')
          +'</table></div>'):'');
    }catch(e){ $('usageBody').innerHTML='<div class="empty">Could not reach the sign-in service. '+esc(e.message)+'</div>'; }
  })();
}
