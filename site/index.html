    :'<div class="empty">No leads yet.</div>';
}

/* Does [a,b] at this location overlap any activation other than `except`? Used to keep a promo's baseline
   weeks clean of other promos. */
function actOverlaps(loc, a, b, except){
  return (D.activations||[]).some(function(z){
    if(z.loc!==loc || z===except) return false;
    if(except && z.s===except.s && z.name===except.name) return false;
    var zs=z.s, ze=z.e||z.s;
    return !(ze<a || zs>b);
  });
}

function pgActivations(m){
  var acts=D.activations.filter(function(x){return locIds().indexOf(x.loc)>=0;}).map(function(x){
    return {loc:x.loc,s:x.s,e:x.e,name:x.name,type:x.type||'Promo',cost:x.cost,owner:x.owner,notes:x.notes,src:'csv'};});
  if(S.actSrc!=='csv'){
    evRows().filter(function(e){return evIsDef(e.status)&&e.d<=D.meta.through;}).forEach(function(e){
      acts.push({loc:e.loc,s:e.d,e:e.d,name:e.name,type:'Private event',cost:0,owner:'Events',
                 notes:fn(e.guests)+' guests',src:'tripleseat',value:evValue(e)});});
  }
  if(S.actSrc==='events') acts=acts.filter(function(x){return x.src==='tripleseat';});
  acts.sort(function(x,y){return y.s<x.s?-1:1;});
  if(!acts.length){m.innerHTML='<div class="panel"><div class="empty">Nothing in this view — add rows to inputs/activations.csv, or connect Tripleseat for private events.</div></div>';return;}
  var rows=acts.map(function(x){
    var e=x.e||x.s, n=(pd(e)-pd(x.s))/864e5+1;
    var ev=sumRows(rowsIn(x.loc,x.s,e));
    var loc=D.locations.filter(function(z){return z.id===x.loc;})[0];
    // Lift-vs-baseline answers "did this bring in business we wouldn't otherwise have had?" — a fair question
    // for a marketing promo. A booked private event is different: its revenue is already inside the day's net
    // sales, so a day-over-day delta measures the rest of the taproom, not the event. Events report their
    // contracted value instead; only marketing activations get a baseline.
    var baseline=null, lift=null, bn=0, noisy=false, spread=null;
    if(x.src!=='tripleseat'){
      // Two corrections to a naive baseline:
      //
      // 1. Skip any comparison week that overlaps ANOTHER activation at this location. A promo that runs every
      //    fortnight would otherwise be measured partly against itself, which drags the baseline up and makes
      //    a real lift look like nothing.
      // 2. Keep the per-week figures, not just their mean, so the spread between ordinary weeks is known. A
      //    lift smaller than the normal week-to-week variation is not evidence of anything, and saying so is
      //    the difference between a measurement and a number that flatters whoever ran the promo.
      var weeks=[];
      for(var w=1;w<=4;w++){
        var bs=addDays(x.s,-7*w), be=addDays(e,-7*w);
        if(actOverlaps(x.loc,bs,be,x)) continue;
        var r=sumRows(rowsIn(x.loc,bs,be));
        if(r.days) weeks.push(r.net);
      }
      bn=weeks.length;
      if(bn){
        baseline=weeks.reduce(function(p,c){return p+c;},0)/bn;
        lift=ev.net-baseline;
        if(bn>1){
          var mu=baseline, va=weeks.reduce(function(p,c){return p+(c-mu)*(c-mu);},0)/(bn-1);
          spread=Math.sqrt(va);
          noisy=spread>0&&Math.abs(lift)<spread;
        }
      }
    }
    return {x:x,loc:loc?loc.name:x.loc,days:n,net:ev.net,guests:ev.guests,baseline:baseline,lift:lift,bn:bn,
            noisy:noisy,spread:spread,
            value:(x.src==='tripleseat'?(x.value||0):null), roi:(lift!=null&&x.cost)?lift/x.cost:null};
  });
  var mk_=rows.filter(function(r){return r.x.src!=='tripleseat';}), evs=rows.filter(function(r){return r.x.src==='tripleseat';});
  var tc=mk_.reduce(function(p,c){return p+(c.x.cost||0);},0), tl=mk_.reduce(function(p,c){return p+(c.lift||0);},0);
  var evVal=evs.reduce(function(p,c){return p+(c.value||0);},0);
  var nEv=evs.length;
  var seg=hasEvents()?('<div class="seg" style="margin-left:auto">'+['all','csv','events'].map(function(v){return '<button data-as="'+v+'"'+((S.actSrc||'all')===v?' class="on"':'')+'>'+({all:'All',csv:'Marketing only',events:'Events only'})[v]+'</button>';}).join('')+'</div>'):'';
  m.innerHTML='<div class="grid tiles">'+tile('Activations',fn(rows.length),(nEv?'<span class="tg">'+fn(mk_.length)+' marketing · '+fn(nEv)+' events</span>':''))
    +tile('Marketing spend',fk(tc),'')
    +tile('Marketing lift',fk(tl),'<span class="tg">vs 4-week same-weekday baseline</span>')
    +tile('Lift ÷ cost',tc?(tl/tc).toFixed(1)+'×':'—','<span class="tg">marketing only</span>')
    +(nEv?tile('Event revenue',fk(evVal),'<span class="tg">contracted value, already in net sales</span>'):'')+'</div>'
    +'<div class="panel" style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px"><h3 style="margin:0">Activation log</h3>'+seg+'</div><div class="hint">Lift = net sales on activation days minus the average of the same weekdays in the prior 4 weeks, ignoring any week that overlapped another activation here. Marketing promos come from inputs/activations.csv and are measured against that baseline; private events come from Tripleseat and show their contracted value, which is already counted inside net sales. <b>Lift is a comparison, not proof of cause</b> — weather, holidays and anything else happening that week land in it too, which is why a lift smaller than the ordinary week-to-week spread is marked as within normal variation.</div>'
    +'<div style="overflow-x:auto"><table class="t"><tr><th>Date</th><th>Location</th><th>Activation</th><th>Type</th><th>Owner</th><th class="r">Cost</th><th class="r">Booked</th><th class="r">Net sales</th><th class="r">Baseline</th><th class="r">Lift</th><th class="r">Lift ÷ cost</th><th>Confidence</th><th>Notes</th></tr>'
    +rows.map(function(r){return '<tr><td>'+fdate(r.x.s)+(r.days>1?'–'+fdate(r.x.e):'')+'</td><td>'+esc(r.loc)+'</td><td class="n">'+esc(r.x.name)+'</td><td><span class="pill">'+esc(r.x.type||'')+'</span></td><td>'+esc(r.x.owner||'')+'</td><td class="r">'+(r.x.src==='tripleseat'?'—':fm(r.x.cost))+'</td><td class="r">'+(r.value!=null?fm(r.value):'—')+'</td><td class="r">'+fm(r.net)+'</td><td class="r">'+(r.baseline!=null?fm(r.baseline):'—')+'</td><td class="r"'+(r.lift!=null?' style="color:'+(r.lift>=0?'var(--good)':'var(--bad)')+';font-weight:700"':'')+'>'+(r.lift!=null?(r.lift>=0?'+':'')+fm(r.lift):'—')+'</td><td class="r">'+(r.roi!=null?r.roi.toFixed(1)+'×':'—')+'</td>'
      +'<td style="white-space:normal;max-width:190px">'+(r.x.src==='tripleseat'?'<span class="tg">booked value</span>'
        :(r.bn===0?'<span class="tg">no clean baseline weeks</span>'
        :(r.noisy?'<span class="pill" style="background:#fdf1e7;color:#8a5a2b">within normal variation</span>'
        :'<span class="tg">'+r.bn+' baseline week'+(r.bn===1?'':'s')+(r.spread?' · ±'+fk(r.spread)+' typical':'')+'</span>')))+'</td>'
      +'<td style="white-space:normal;max-width:260px">'+esc(r.x.notes||'')+'</td></tr>';}).join('')+'</table></div></div>';
  m.querySelectorAll('[data-as]').forEach(function(b){b.onclick=function(){S.actSrc=b.dataset.as;render();};});
}

/* ---------- cross-location benchmarking ----------
   Indexed against the MEDIAN, not the average, and on rates rather than totals. Totals mostly measure how big
   a taproom is; rates measure how well it is run, which is the only comparison that is fair to a small site or
   to one that opened partway through the year and has no prior period of its own to be judged against.
   The median rather than the mean because with six locations one outlier drags an average badly. */
function benchmarkPanel(rows){
  var metrics=[
    {k:'ppa',   label:'Sales per guest',   fmt:'money', good:1},
    {k:'check', label:'Average check',     fmt:'money', good:1},
    {k:'splh',  label:'Sales / labor hour',fmt:'money0',good:1},
    {k:'labor', label:'Labor %',           fmt:'pct',   good:-1},
    {k:'purch', label:'Purchases %',       fmt:'pct',   good:-1},
    {k:'disc',  label:'Discount %',        fmt:'pct',   good:-1},
    {k:'count', label:'Counts made',       fmt:'pct',   good:1}
  ];
  if(rows.some(function(r){return r.l.seats;})) metrics.push({k:'seat', label:'Sales / seat / day', fmt:'money', good:1});
  var vals=rows.map(function(r){var s=r.s;return {
    name:r.l.name, partial:r.partial,
    ppa:s.guests?s.net/s.guests:null, check:s.checks?s.net/s.checks:null, splh:s.lh?s.net/s.lh:null,
    labor:s.net?s.lc/s.net:null, purch:s.net?s.p/s.net:null, disc:s.net?s.disc/s.net:null,
    count:((D.compliance||{})[r.l.id]||{}).score, seat:(r.l.seats&&s.days)?s.net/s.days/r.l.seats:null };});
  if(vals.length<2) return '';
  function median(k){var v=vals.map(function(x){return x[k];}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
    if(!v.length) return null; var m=Math.floor(v.length/2); return v.length%2?v[m]:(v[m-1]+v[m])/2; }
  var med={}; metrics.forEach(function(m){med[m.k]=median(m.k);});
  function show(v,f){ return v==null?'—':(f==='pct'?fp(v):(f==='money0'?fm(v,0):fm(v,2))); }
  return panel('How the taprooms compare','Selected date range · indexed against the group median · rates, not totals, so size is not mistaken for performance',
    '<div class="tw"><table class="t"><tr><th>Location</th>'
    +metrics.map(function(m){return '<th class="r">'+esc(m.label)+'</th>';}).join('')+'</tr>'
    +vals.map(function(x){
      return '<tr><td class="n">'+esc(x.name)+(x.partial?' <span class="pill">new</span>':'')+'</td>'
        +metrics.map(function(m){
          var v=x[m.k], mm=med[m.k];
          var idx=(v!=null&&mm)?v/mm:null;
          // 5% either side of the median is not a difference worth colouring.
          var col=''; if(idx!=null&&Math.abs(idx-1)>=0.05) col=((idx>1?1:-1)===m.good)?'var(--good,#2e7d5b)':'var(--bad,#b4413c)';
          // Rounding a 0.3% gap to "-0%" looks like a defect; anything that rounds to nothing is "par".
            var gap=idx==null?null:(Math.abs(idx-1)<0.005?'par':(idx>=1?'+':'')+fp(idx-1,0));
            return '<td class="r"'+(col?' style="color:'+col+'"':'')+'>'+show(v,m.fmt)
            +(gap?'<div style="font-size:10.5px;color:var(--muted)">'+gap+'</div>':'')+'</td>';
        }).join('')+'</tr>';
    }).join('')
    +'<tr style="border-top:2px solid var(--grid,#e5e7eb)"><td class="n"><b>Group median</b></td>'

  var w=0; g.forEach(function(r){ for(var i=r.length-1;i>=0;i--){ if(String(r[i]).trim()){ if(i+1>w)w=i+1; break; } } });
  if(!w) return '<div class="empty">This tab is empty.</div>';

function scChart(SC){

  function num(mt,w){ var c=(mt.cells||{})[w]; return c&&c[0]!=null?c[0]:null; }

/* ---------- bookmarkable views ----------
   The whole view — page, taproom, range, comparison — lives in the URL hash, so a link pasted into an email
   opens exactly what the sender was looking at, and the browser's back button works. The hash rather than the
   query string because GitHub Pages serves one static file and the sign-in redirect must not lose it. */
function readHash(){
  var h=(location.hash||'').replace(/^#/,''); if(!h) return false;
  var q={};
  try{ h.split('&').forEach(function(kv){var i=kv.indexOf('='); if(i>0) q[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1));}); }
  catch(e){ return false; }                     // a mangled link must open the portal, not a blank page
  var ok=false;
  if(q.page && (PAGES.some(function(p){return p[0]===q.page;})||q.page==='onepager')){ S.page=q.page; ok=true; }
  if(q.loc && (q.loc==='all'?D.locations.length>1:D.locations.some(function(l){return l.id===q.loc;}))){ S.loc=q.loc; ok=true; }
  if(q.cmp==='ly'||q.cmp==='prior'){ S.cmp=q.cmp; ok=true; }
  if(q.r){
    if(q.r==='custom' && /^\d{4}-\d\d-\d\d$/.test(q.d0||'') && /^\d{4}-\d\d-\d\d$/.test(q.d1||'') && q.d0<=q.d1){ S.preset='custom'; S.d0=q.d0; S.d1=q.d1; ok=true; }
    else if(['l7','l28','mtd','qtd','ytd','l91','lm'].indexOf(q.r)>=0){ S.preset=q.r; applyPreset(); ok=true; }
  }
  if(q.ev){
    if(q.ev==='custom' && /^\d{4}-\d\d-\d\d$/.test(q.e0||'') && /^\d{4}-\d\d-\d\d$/.test(q.e1||'') && q.e0<=q.e1){ S.evPreset='custom'; S.evD0=q.e0; S.evD1=q.e1; ok=true; }
    else if(RANGE_EVENTS.some(function(p){return p[0]===q.ev;})){ S.evPreset=q.ev; ok=true; }
  }
  return ok;
}
var _hashWritten='';
function writeHash(){
  var parts=['page='+S.page,'loc='+S.loc,'r='+S.preset];
  if(S.preset==='custom'){ parts.push('d0='+S.d0,'d1='+S.d1); }
  if(S.page==='events'){ parts.push('ev='+S.evPreset); if(S.evPreset==='custom'){ parts.push('e0='+S.evD0,'e1='+S.evD1); } }
  if(S.cmp!=='prior') parts.push('cmp='+S.cmp);
  var h='#'+parts.join('&');
  if(h===location.hash){ _hashWritten=h; return; }
  // The first write of a session replaces rather than pushes, or the back button's first press would do nothing.
  var first=!_hashWritten; _hashWritten=h;
  try{ history[first?'replaceState':'pushState'](null,'',h); }catch(e){ location.hash=h; }
}
window.addEventListener('popstate',function(){ if(!D) return; if(readHash()){ var ls=$('locSel'); if(ls) ls.value=S.loc; syncRangeInputs(); render(true); } });

/* ---------- page views ----------
   One beacon per page per session. This is a record of which pages earn their keep, not a click stream — and
   it is how the next round of priorities gets decided on evidence rather than on which page was most fun to
   build. Fire-and-forget: a failed beacon must never be visible. */
var _viewed={};
function logView(){
  var sid=sessionSid(); if(!sid) return;
  var k=S.page; if(_viewed[k]) return; _viewed[k]=1;
  try{ navigator.sendBeacon(CFG.API_URL, JSON.stringify({a:'view',s:sid,p:S.page,l:S.loc})); }catch(e){}
}

/* ---------- the date range, for panels that used to be fixed at 28/56 days ----------
   The headline bundle pre-aggregates items, tenders, jobs and the rest over a fixed window to stay small. The
   daily grain lives in each taproom's detail bundle and is fetched only when the range is moved off the default,
   so the first paint costs nothing extra. Until it arrives (or if it cannot be fetched) the panels fall back to
   the fixed window AND SAY SO in their title, because a table quietly showing different dates from the picker
   above it is exactly the kind of thing that gets a number quoted wrongly in a meeting. */
var _rangeBusy=false, _rangeFailed={};
function rangeWanted(){ return S.preset!=='l28'; }
function rangeReady(){ return locIds().every(function(l){ return DETAIL[l] && DETAIL[l].range; }); }
function useRange(){ return rangeWanted() && rangeReady(); }
function ensureRange(){
  if(!rangeWanted()||rangeReady()||_rangeBusy) return;
  var need=locIds().filter(function(l){ return !(DETAIL[l]&&DETAIL[l].range) && DETAIL_KEYS[l] && !_rangeFailed[l]; });
  if(!need.length) return;
  _rangeBusy=true;
  Promise.all(need.map(function(l){ return loadDetail(l).then(function(d){ if(!d||!d.range) _rangeFailed[l]=1; }).catch(function(){ _rangeFailed[l]=1; }); }))
    .then(function(){ _rangeBusy=false; render(true); });
}
function win(fixed,kind){
  if(useRange()){
    // Item-level history is kept for fewer days than the rest. Say so in the title rather than let a
    // year-to-date heading sit over a table that quietly starts in March.
    if(kind==='items'){ var lo=S.d0; locIds().forEach(function(l){ var is=DETAIL[l].range.items_since; if(is&&is>lo) lo=is; }); if(lo>S.d0) return fdate(lo)+' – '+fdate(S.d1)+' <span class="tg" style="font-weight:400">· item history starts '+fdate(lo)+'</span>'; }
    return fdate(S.d0)+' – '+fdate(S.d1);
  }
  if(rangeWanted()) return fixed+(_rangeBusy?' <span class="tg" style="font-weight:400">· loading your date range…</span>':' <span class="tg" style="font-weight:400">· fixed window</span>');
  return fixed;
}
function _dayIdx(R,d){ return Math.round((pd(d)-pd(R.days[0]))/864e5); }
function rAgg(l,tbl,nm){
  var R=DETAIL[l].range, t=R[tbl]; if(!t) return [];
  var i0=Math.max(0,_dayIdx(R,S.d0)), i1=_dayIdx(R,S.d1), acc={};
  t.rows.forEach(function(r){ if(r[0]<i0||r[0]>i1) return; var o=acc[r[1]]; if(!o){ o=acc[r[1]]=[]; for(var j=2;j<r.length;j++) o.push(0); } for(var j2=2;j2<r.length;j2++) o[j2-2]+=r[j2]; });
  return Object.keys(acc).map(function(i){ return [t.names[i]].concat(acc[i]); });
}
/* X(kind, loc) returns rows in exactly the shape the fixed payload uses, so every panel below is unchanged. */
function X(kind,l){
  if(!useRange()) return (D[kind]||{})[l]||[];
  if(kind==='top_items') return rAgg(l,'items').map(function(r){return [r[0][0],r[0][1],r[1],r[2]];}).sort(function(a,b){return b[3]-a[3];}).slice(0,60);
  if(kind==='dining') return rAgg(l,'dining').sort(function(a,b){return b[1]-a[1];});
  if(kind==='revctr') return rAgg(l,'revctr').sort(function(a,b){return b[1]-a[1];});

/* ---------- a fair "last year" ----------
   Same calendar DATE last year is the wrong day of the week, and in a taproom the weekday is most of the
   number: a Saturday against last year's Friday reads as a 40% swing that never happened. So "last year" means
   364 days back — the same weekday — with one correction. Holidays move: the Fourth of July is a Saturday one
   year and a Friday the year before, and Thanksgiving is never 364 days apart from itself. A holiday is
   therefore compared with the SAME HOLIDAY last year, and an ordinary day whose 364-day twin happened to be a
   holiday is compared with the week before that instead, so neither side of a comparison is a holiday unless
   both are. */

var _hol={};
function holidays(y){
  if(_hol[y]) return _hol[y];

  H[y+'-01-01']="New Year's Day"; H[y+'-02-14']="Valentine's Day"; H[nthDow(y,1,0,2)]='Super Bowl Sunday';   /* set after Valentine's so it wins when they collide (2027) */ H[y+'-03-17']="St Patrick's Day";
  H[easter(y)]='Easter'; H[nthDow(y,4,0,2)]="Mother's Day"; H[lastDow(y,4,1)]='Memorial Day'; H[nthDow(y,5,0,3)]="Father's Day";
  H[y+'-07-04']='Independence Day'; H[nthDow(y,8,1,1)]='Labor Day'; H[y+'-10-31']='Halloween';
  H[addDays(tg,-1)]='Thanksgiving Eve'; H[tg]='Thanksgiving'; H[addDays(tg,1)]='Black Friday';
  H[y+'-12-24']='Christmas Eve'; H[y+'-12-25']='Christmas Day'; H[y+'-12-31']="New Year's Eve";
  return (_hol[y]=H);
}
function lyDate(d){
  var y=+d.slice(0,4), name=holidays(y)[d];

function parseCsv(t){ var rows=[],row=[],cur='',q=false; for(var i=0;i<t.length;i++){ var c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else if(c==='"') q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; row.push(cur);cur=''; if(row.length>1||row[0]!=='')rows.push(row); row=[]; } else cur+=c; } if(cur!==''||row.length){row.push(cur);rows.push(row);} return rows; }

/* =========================================================================================
   A NEW TAPROOM'S RAMP
   ========================================================================================= */
function rampPanel(){
  var T=D.meta.through, news=D.locations.filter(function(l){ return l.first_date && l.first_date>addDays(D.meta.since,21); });
  var old=D.locations.filter(function(l){ return news.indexOf(l)<0; });
  if(!news.length||!old.length) return '';
  function wkOf(d){ var x=pd(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return ds(x); }
  function weekly(l){ var w={}; (D.daily[l.id]||[]).forEach(function(r){ var k=wkOf(r[0]); var o=w[k]||(w[k]={net:0,n:0,g:0}); o.net+=r[K.net]||0; o.g+=r[K.guests]||0; o.n++; }); return w; }
  var oldW=old.map(weekly), out='';
  news.forEach(function(l){ var w=weekly(l), wks=Object.keys(w).sort().filter(function(k){return w[k].n===7;}), rows=[];
    wks.forEach(function(k,i){ var peers=oldW.map(function(o){return o[k]&&o[k].n===7?o[k].net:null;}), med=medianOf(peers); rows.push({wk:k,i:i+1,net:w[k].net,g:w[k].g,idx:med?w[k].net/med:null}); });
    if(rows.length<3) return;
    var id='c_ramp_'+l.id.replace(/[^a-z0-9]/g,'');
    var first=rows.slice(0,4), last=rows.slice(-4), a0=medianOf(first.map(function(r){return r.idx;})), a1=medianOf(last.map(function(r){return r.idx;}));
    out+=panel(esc(l.name)+' — ramp since opening','Open since '+fdate(l.first_date)+' · each full week\'s net sales as a share of the median established taproom in that same week, which takes the season out',
      chartBox(id,true)+notice('A new taproom has no last year, so the only fair yardstick is its siblings in the same week. Opening month ran at about '+fp(a0,0)+' of the median established taproom; the last four weeks at '+fp(a1,0)+'. A falling line after a big opening is normal; the level it settles at is the number that matters.'
        +(l.seats?' With '+l.seats+' seats that is '+fm(last.reduce(function(p,c){return p+c.net;},0)/last.length/l.seats,0)+' per seat per week.':'')));
    setTimeout(function(){ if(!$(id)) return; var c=lineCfg(rows.map(function(r){return 'wk '+r.i;}),[{label:'vs median established taproom',data:rows.map(function(r){return r.idx;}),borderColor:css('s2'),fmt:'pct'},{label:'Parity',data:rows.map(function(){return 1;}),borderColor:css('axis'),borderDash:[4,4],borderWidth:1,fmt:'pct'}]);
      c.options.scales.y.ticks.callback=function(v){return fp(v,0);}; c.options.plugins.legend={display:true,position:'bottom'}; mk(id,c); },0);
  });
  return out?'<div class="grid" style="margin-top:14px">'+out+'</div>':'';
}

var WXC={0:'clear',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'fog',51:'drizzle',53:'drizzle',55:'drizzle',61:'light rain',63:'rain',65:'heavy rain',66:'freezing rain',67:'freezing rain',71:'light snow',73:'snow',75:'heavy snow',77:'snow',80:'showers',81:'showers',82:'heavy showers',85:'snow showers',86:'snow showers',95:'thunderstorms',96:'thunderstorms',99:'thunderstorms'};

  var days=[]; for(var i=1;i<=7;i++) days.push(addDays(T,i));
  var tot=0, cells=days.map(function(d){ var w=dow(d), p=prof[w], e=p?p[0]/Object.keys(p[1]).length:null; tot+=e||0; var f=fc.filter(function(r){return r[0]===d;})[0];

    '<div class="fcw">'+cells+'</div>'+(l&&fc.length?notice('The sales figure does not move with the forecast — it is the ordinary week. The weather is there so the person writing the schedule can adjust it with their own knowledge of the patio. How much rain has actually cost this taproom is on the Sales page.'):''));

function weatherEffectPanel(){
  var ids=locIds().filter(function(l){ return (((D.weather||{})[l]||{}).days||[]).length; });

  var a=S.d0,b=S.d1; if((pd(b)-pd(a))/864e5<55){ a=addDays(b,-181); if(a<D.meta.since) a=D.meta.since; }
  var G={dry:[],wet:[],soak:[]}, TB={'Under 40°':[],'40s–50s':[],'60s–70s':[],'80s':[],'90° and up':[]}, n=0;
  ids.forEach(function(l){ var rows=rowsIn(l,a,b).filter(function(r){return (r[K.net]||0)>0;}), byD={};
    rows.forEach(function(r){ var w=dow(r[0]); (byD[w]||(byD[w]=[])).push(r[K.net]); });
    var avg={}; Object.keys(byD).forEach(function(w){ avg[w]=byD[w].reduce(function(p,c){return p+c;},0)/byD[w].length; });
    rows.forEach(function(r){ var x=wxFor(l,r[0]); if(!x||!avg[dow(r[0])]) return; var idx=r[K.net]/avg[dow(r[0])]; n++;

      var t=x[1]; if(t==null) return; (t<40?TB['Under 40°']:t<60?TB['40s–50s']:t<80?TB['60s–70s']:t<90?TB['80s']:TB['90° and up']).push(idx); }); });

  var sched=ids.some(function(l){return opsOf(l,'overtime').has_schedule;});
  var body=rows.length?'<div class="tw"><table class="t"><tr>'+locTh()+'<th>Person</th><th class="r">Worked so far</th><th class="r">Still scheduled</th><th class="r">Week total</th><th class="r">Over '+fn(O.limit)+'h</th></tr>'
      +rows.slice(0,40).map(function(r){ var over=r[5]>0; return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td class="r">'+fn(r[2],1)+'</td><td class="r">'+(r[6]?fn(r[3],1):'—')+'</td><td class="r"'+(over?' style="color:var(--bad);font-weight:700"':'')+'>'+fn(r[4],1)+'</td><td class="r">'+(over?fn(r[5],1):'')+'</td></tr>'; }).join('')+'</table></div>'
    :'<div class="empty">Nobody is within four hours of overtime this week.</div>';
  // what overtime has actually cost, by pay week
  var wk={}; ids.forEach(function(l){ (opsOf(l,'overtime').history||[]).forEach(function(r){ var o=wk[r[0]]||(wk[r[0]]=[0,0,0]); o[0]+=r[1]||0; o[1]+=r[2]||0; o[2]+=r[3]||0; }); });
  var wks=Object.keys(wk).sort().slice(-8);
  var hist=wks.length?'<div class="hint" style="margin-top:12px">Overtime already paid — by pay week</div><div class="tw"><table class="t"><tr><th>Week of</th><th class="r">Overtime hours</th><th class="r">Premium paid</th><th class="r">Share of hours</th></tr>'
      +wks.map(function(w){ var o=wk[w]; return '<tr><td>'+fdate(w)+'</td><td class="r">'+fn(o[0],1)+'</td><td class="r">'+fm(o[1])+'</td><td class="r">'+fp(o[2]?o[0]/o[2]:null)+'</td></tr>'; }).join('')+'</table></div>':'';
  return panel('Overtime this week — '+fdate(O.week[0])+' to '+fdate(O.week[1]),'Hours worked through '+fdate(O.through)+' plus what is still on the schedule · anyone within four hours of '+fn(O.limit)+' is listed, while the schedule can still be changed',
    body+hist+notice((function(){ var no=ids.filter(function(l){return !opsOf(l,'overtime').has_schedule;}); return no.length?'No schedule for the rest of the week reaches the portal for '+no.map(function(l){return esc(locName(l));}).join(', ')+', so only hours already worked are counted there. ':''; })()+'Hours are counted per taproom: someone who also works at another taproom is only seen here for this one. The premium is the extra half-time, not the whole hour. Pay week start and the threshold are <code>labor.week_start</code> and <code>labor.overtime_hours</code> in config/settings.json.'));
}

/* ---------- comps and voids by person ---------- */
function compsPanel(){
  var ids=opsIds('comps',function(x){return (x.people||[]).length;}); if(!ids.length) return '';
  var rows=[], ap=[], vr={}, cov=[];
  ids.forEach(function(l){ var c=opsOf(l,'comps');
    c.people.forEach(function(r){ rows.push([l].concat(r)); });
    (c.approvers||[]).forEach(function(r){ ap.push([l].concat(r)); });
    (c.void_reasons||[]).forEach(function(r){ var o=vr[r[0]]||(vr[r[0]]=[0,0]); o[0]+=r[1]||0; o[1]+=r[2]||0; });
    if(c.approver_coverage!=null) cov.push(c.approver_coverage); });
  rows.sort(function(a,b){ return (b[10].length-a[10].length)||((b[4]+b[7])-(a[4]+a[7])); });
  var C0=opsOf(ids[0],'comps');
  var base=ids.map(function(l){ var b=opsOf(l,'comps').base; return (multiLoc()?esc(locName(l))+': ':'')+'discounts '+fp(b.disc_rate)+' of gross, item voids '+fp(b.void_rate); }).join(' · ');
  var t='<div class="tw"><table class="t"><tr>'+locTh()+'<th>Person</th><th class="r">Orders</th><th class="r">Gross rung</th><th class="r">Promotions</th><th class="r">Discounts given</th><th class="r">Rate</th><th class="r">Items voided</th><th class="r">Rate</th><th></th></tr>'
    +rows.slice(0,40).map(function(r){ var f=r[10]||[];
      return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td class="r">'+fn(r[2])+'</td><td class="r">'+fm(r[3])+'</td><td class="r tg">'+(r[11]?fm(r[11]):'')+'</td><td class="r">'+fm(r[4])+' <span class="tg">'+fn(r[5])+'</span></td><td class="r"'+(f.indexOf('discounts')>=0?' style="color:var(--bad);font-weight:700"':'')+'>'+fp(r[6])+'</td><td class="r">'+fm(r[7])+' <span class="tg">'+fn(r[8])+'</span></td><td class="r"'+(f.indexOf('voids')>=0?' style="color:var(--bad);font-weight:700"':'')+'>'+fp(r[9])+'</td><td>'+(f.length?'<span class="pill" style="background:#fbe9e9;color:var(--bad)">2× taproom rate</span>':'')+'</td></tr>'; }).join('')+'</table></div>';
  ap.sort(function(a,b){return (b[2]||0)-(a[2]||0);});
  var apT=ap.length?'<div class="hint" style="margin-top:12px">Who approved the discounts</div><div class="tw"><table class="t"><tr>'+locTh()+'<th>Approved by</th><th class="r">Discounts</th><th class="r">Count</th><th class="r">Share</th></tr>'
      +ap.slice(0,15).map(function(r){return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td class="r">'+fm(r[2])+'</td><td class="r">'+fn(r[3])+'</td><td class="r">'+fp(r[4])+'</td></tr>';}).join('')+'</table></div>':'';
  var vk=Object.keys(vr).sort(function(a,b){return vr[b][0]-vr[a][0];});
  var vrT=vk.length?'<div class="hint" style="margin-top:12px">Why items were voided</div><div class="tw"><table class="t"><tr><th>Reason</th><th class="r">Value</th><th class="r">Items</th></tr>'
      +vk.slice(0,10).map(function(k){return '<tr><td class="n">'+esc(k)+'</td><td class="r">'+fm(vr[k][0])+'</td><td class="r">'+fn(vr[k][1])+'</td></tr>';}).join('')+'</table></div>':'';
  var minCov=cov.length?Math.min.apply(null,cov):null;
  return panel('Comps and voids by person — last 28 days','Loyalty redemptions are left out, and promotions ('+esc((C0.promotions||[]).join(', '))+') are shown but not counted in the rate · '+base,
    t+apT+vrT+notice('A rate is shown only for people with at least '+C0.min_orders+' orders, and someone is flagged only when their rate is at least double the taproom\'s own <b>and</b> the amount is over $100 — a flag is a reason to look, not a finding. Discounts and voids belong to whoever owned the order, which is not always who keyed them; whole voided orders are on the By server table, not here. Which discounts count as promotions is <code>comps.promotions</code> in config/settings.json.'
      +(minCov!=null&&minCov<0.98?' Approver and void reason are only on days pulled since 20 Sep 2026 ('+fp(minCov,0)+' of this window\'s discounts so far); the history re-pull fills in the rest, and until then older voids read "day not re-pulled yet".':'')));
}

/* ---------- tab length and how full the room gets ---------- */
function tabsPanel(){
  var ids=opsIds('tabs',function(x){return (x.dayparts||[]).length;}); if(!ids.length) return '';
  var parts=['Lunch','Afternoon','Dinner','Late'];
  var t='<div class="tw"><table class="t"><tr><th>Taproom</th><th></th>'+parts.map(function(p){return '<th class="r">'+p+'</th>';}).join('')+'<th class="r">Busiest hour</th><th class="r">Tabs open then</th><th class="r">Seats</th><th class="r">Left open 8h+</th></tr>'
    +ids.map(function(l){ var T=opsOf(l,'tabs'), by={}; T.dayparts.forEach(function(r){ by[r[0]+'|'+r[1]]=r; });
      var dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], pk=T.peak;
      return ['Sun–Thu','Fri–Sat'].map(function(wk,i){
        return '<tr>'+(i===0?'<td class="n" rowspan="2" style="vertical-align:top">'+esc(locName(l))+'</td>':'')+'<td class="tg">'+wk+'</td>'
          +parts.map(function(p){ var r=by[p+'|'+wk]; return '<td class="r">'+(r&&r[2]>=20?fn(r[3])+' min <span class="tg">'+fn(r[4])+'</span>':'—')+'</td>'; }).join('')
          +(i===0?'<td class="r" rowspan="2" style="vertical-align:top">'+(pk?dn[pk[0]]+' '+hr12(pk[1]):'—')+'</td><td class="r" rowspan="2" style="vertical-align:top">'+(pk?fn(pk[2],0):'—')+'</td><td class="r" rowspan="2" style="vertical-align:top">'+(T.seats?fn(T.seats):'<span class="tg">not set</span>')+'</td><td class="r" rowspan="2" style="vertical-align:top">'+fn(T.left_open)+'</td>':'')+'</tr>'; }).join(''); }).join('')+'</table></div>';
  return panel('How long a tab stays open — last 28 days','Median minutes from opening to closing a tab, with the 75th percentile in grey · parts of the day with fewer than 20 tabs are left blank',
    t+notice('"Tabs open then" is the average number of tabs open at the half-hour of the busiest hour of the week. Against the seat count it says whether the room or the demand is the limit: tabs open close to seats ÷ typical party size means the room is full. Delivery, takeout and online orders are left out entirely — they never sat in the room. Counter sales under two minutes are left out of the medians; tabs open more than eight hours are counted separately because they were almost certainly forgotten, not enjoyed. Add <code>seats</code> in config/locations.json to fill the seats column.'));
}
function hr12(h){ return (h%12||12)+(h<12?' AM':' PM'); }

/* ---------- gift cards, $0 items, guest counts ---------- */
function posChecksPanel(){
  var ids=opsIds('checks'); if(!ids.length) return '';
  var g='<div class="tw"><table class="t"><tr><th>Taproom</th><th class="r">Gift cards sold</th><th class="r">Gift cards redeemed</th><th class="r">Orders with a party size of 2+</th><th>Per-guest figures</th></tr>'
    +ids.map(function(l){ var c=opsOf(l,'checks'), gc=c.gift||{}, gs=c.guests;
      return '<tr><td class="n">'+esc(locName(l))+'</td><td class="r">'+(gc.sold?fm(gc.sold)+' <span class="tg">'+fn(gc.sold_n)+'</span>':'<span class="tg">none found</span>')+'</td><td class="r">'+fm(gc.redeemed)+' <span class="tg">'+fn(gc.redeemed_n)+'</span></td><td class="r">'+(gs?fp(gs.two_plus,0):'—')+'</td><td>'+(gs?(gs.usable?'<span class="pill">usable</span>':'<span class="pill" style="background:#fbe9e9;color:var(--bad)">party size mostly not entered</span>'):'')+'</td></tr>'; }).join('')+'</table></div>';
  var z=[]; ids.forEach(function(l){ (opsOf(l,'checks').zero_rung||[]).forEach(function(r){ z.push([l].concat(r)); }); });
  z.sort(function(a,b){return b[3]-a[3];});
  var zt=z.length?'<div class="hint" style="margin-top:12px">Rung at $0 — not voided, not discounted, just no price</div><div class="tw"><table class="t"><tr>'+locTh()+'<th>Item</th><th>Category</th><th class="r">Times rung</th></tr>'
      +z.slice(0,25).map(function(r){return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td>'+esc(r[2]||'')+'</td><td class="r">'+fn(r[3])+'</td></tr>';}).join('')+'</table></div>':'';
  return panel('Point-of-sale checks — last 28 days','Three things the register knows that nobody looks at',
    g+zt+notice('Gift card sales are found by item or category name ("gift card"), so a differently named button will read as none. Toast records a party of 1 when nobody enters one, which is why per-guest figures are only trusted where at least 35% of orders carry a party of two or more. Most $0 items are legitimate (water, a draft button priced by its size); the list is there to spot the ones that are not.'));
}

/* ---------- out of stock ---------- */
function stockPanel(){
  var ids=opsIds('stock',function(x){return x.as_of;}); if(!ids.length) return '';
  var now=[], often=[];
  ids.forEach(function(l){ var s=opsOf(l,'stock'); (s.now||[]).forEach(function(r){ now.push([l].concat(r)); }); (s.often||[]).forEach(function(r){ often.push([l,r[0],r[1],s.snapshots]); }); });
  var S0=opsOf(ids[0],'stock');
  var t=now.length?'<div class="tw"><table class="t"><tr>'+locTh()+'<th>Item</th><th>Status</th><th class="r">Left</th></tr>'
      +now.map(function(r){ var out=r[2]==='OUT_OF_STOCK'; return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td>'+(out?'<span class="pill" style="background:#fbe9e9;color:var(--bad)">86\'d</span>':'<span class="pill">counting down</span>')+'</td><td class="r">'+(r[3]==null?'':fn(r[3]))+'</td></tr>'; }).join('')+'</table></div>'
    :'<div class="empty">Nothing was marked out of stock when the portal last refreshed.</div>';
  often.sort(function(a,b){return b[2]-a[2];});
  var ot=often.length?'<div class="hint" style="margin-top:12px">Out more than once in the last 28 days</div><div class="tw"><table class="t"><tr>'+locTh()+'<th>Item</th><th class="r">Mornings out</th><th class="r">Of</th></tr>'
      +often.slice(0,20).map(function(r){return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td class="r">'+fn(r[2])+'</td><td class="r">'+fn(r[3])+'</td></tr>';}).join('')+'</table></div>':'';
  return panel('Out of stock — as of '+fdate(S0.as_of),'What Toast had marked 86\'d or counting down when the morning refresh ran',
    t+ot+notice('This is one look a day, taken at the morning refresh, so it shows what was still out from the night before — not everything that ran out and came back during service.'));
}

/* ---------- same item, different menu price ---------- */
function priceMapCols(rows,idx){ var seen={}, out=[]; rows.forEach(function(r){ Object.keys(r[idx]).forEach(function(k){ if(!seen[k]){seen[k]=1;out.push(k);} }); });
  var order=D.locations.map(function(l){return l.id;}); out.sort(function(a,b){ var x=order.indexOf(a), y=order.indexOf(b); return (x<0?99:x)-(y<0?99:y); }); return out; }
function menuPricePanel(){
  var sel={}; locIds().forEach(function(l){sel[l]=1;});
  var rows=(D.menu_prices||[]).filter(function(r){ return Object.keys(r[2]).some(function(k){return sel[k];}); });
  if(!rows.length) return '';
  var cols=priceMapCols(rows,2);
  return panel('Same item, different price','Menu items whose price differs between taprooms by 50¢ or more · widest gap first',
    '<div class="tw"><table class="t"><tr><th>Item</th><th>Category</th>'+cols.map(function(c){return '<th class="r">'+esc(locName(c))+'</th>';}).join('')+'<th class="r">Gap</th></tr>'
    +rows.slice(0,60).map(function(r){ var vals=Object.keys(r[2]).map(function(k){return r[2][k];}), hi=Math.max.apply(null,vals), lo=Math.min.apply(null,vals);
      return '<tr><td class="n">'+esc(r[0])+'</td><td>'+esc(r[1]||'')+'</td>'+cols.map(function(c){ var v=r[2][c]; return '<td class="r"'+(v===hi?' style="font-weight:700"':v===lo?' style="color:var(--muted)"':'')+'>'+(v==null?'':fm(v,2))+'</td>'; }).join('')+'<td class="r">'+(r[3]<0?'−':'')+fm(Math.abs(r[3]),2)+' <span class="tg">'+fp(Math.abs(r[4]),0)+'</span></td></tr>'; }).join('')+'</table></div>'
    +notice('Matched on the item\'s name as it appears in Toast, from each taproom\'s current menu. Draft buttons priced by their size modifier have no base price and are not compared. Some gaps are deliberate; this is the list to decide that from.'),'noprov');
}

/* ---------- MarginEdge: price rises that cost money ---------- */
function priceAlertPanel(){
  var rows=[]; opsIds('price_alerts').forEach(function(l){ (opsOf(l,'price_alerts')||[]).forEach(function(r){ rows.push([l].concat(r)); }); });
  if(!rows.length) return '';
  rows.sort(function(a,b){return (b[7]||0)-(a[7]||0);});
  return panel('Purchases — price rises that are costing money','Unit price in the recent 90 days against the 90 before, same product and pack · ranked by what the rise has cost, not by percentage',
    '<div class="tw"><table class="t"><tr>'+locTh()+'<th>Product</th><th>Vendor</th><th class="r">Was</th><th class="r">Now</th><th class="r">Change</th><th class="r">Cost of the rise</th></tr>'
    +rows.slice(0,20).map(function(r){return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td class="r">'+fm(r[4],2)+'</td><td class="r">'+fm(r[5],2)+'</td><td class="r" style="color:var(--bad)">+'+fp(r[6],0)+'</td><td class="r" style="font-weight:700">'+fm(r[7])+'</td></tr>';}).join('')+'</table></div>'
    +notice('Only rises that have cost $150 or more are listed; the full list, with price history and vendor comparison, is under Unit prices above. The biggest of these also appear in the morning digest.'));
}

/* ---------- MarginEdge: same vendor item, different price by taproom ---------- */
function purchaseComparePanel(){
  var sel={}; locIds().forEach(function(l){sel[l]=1;});
  var rows=(D.price_compare||[]).filter(function(r){ return Object.keys(r[3]).some(function(k){return sel[k];}); });
  if(!rows.length) return '';
  var cols=priceMapCols(rows,3);
  return panel('Purchases — same vendor item, different price by taproom','Last 90 days · matched on the vendor and the vendor\'s own item code, so the pack is the same · ranked by what paying above the lowest price has cost',
    '<div class="tw"><table class="t"><tr><th>Item</th><th>Vendor</th>'+cols.map(function(c){return '<th class="r">'+esc(locName(c))+'</th>';}).join('')+'<th class="r">Gap</th><th class="r">Cost of the gap</th></tr>'
    +rows.slice(0,40).map(function(r){ var vals=Object.keys(r[3]).map(function(k){return r[3][k][0];}), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
      return '<tr><td class="n">'+esc(r[0])+'</td><td>'+esc(r[1]||'')+'</td>'+cols.map(function(c){ var v=r[3][c]; return '<td class="r"'+(v&&v[0]===hi?' style="color:var(--bad);font-weight:700"':v&&v[0]===lo?' style="color:var(--good)"':'')+'>'+(v?fm(v[0],2):'')+'</td>'; }).join('')+'<td class="r">'+fp(r[4],0)+'</td><td class="r">'+fm(r[5])+'</td></tr>'; }).join('')+'</table></div>'
    +notice('Prices are volume-weighted over the window. A gap can be a delivery-size tier or a contract one taproom has and another does not — either way it is a question for the vendor.'));
}

/* ---------- MarginEdge: invoice entry lag and quiet vendors ---------- */
function invoiceHealthPanel(){
  var ids=opsIds('invoice_health',function(x){return x.lag&&x.lag.n;}); if(!ids.length) return '';
  var t='<div class="tw"><table class="t"><tr><th>Taproom</th><th class="r">Invoices</th><th class="r">Typical days to enter</th><th class="r">Slowest tenth</th><th class="r">Entered over a week late</th></tr>'
    +ids.map(function(l){ var g=opsOf(l,'invoice_health').lag||{}; return '<tr><td class="n">'+esc(locName(l))+'</td><td class="r">'+fn(g.n)+'</td><td class="r">'+(g.median==null?'—':fn(g.median))+'</td><td class="r">'+(g.p90==null?'—':fn(g.p90)+'+')+'</td><td class="r"'+(g.late_share>0.2?' style="color:var(--bad);font-weight:700"':'')+'>'+fp(g.late_share,0)+'</td></tr>'; }).join('')+'</table></div>';
  var q=[]; ids.forEach(function(l){ (opsOf(l,'invoice_health').quiet||[]).forEach(function(r){ q.push([l].concat(r)); }); });
  q.sort(function(a,b){return (b[6]||0)-(a[6]||0);});
  var qt=q.length?'<div class="hint" style="margin-top:12px">Regular vendors that have gone quiet — a delivery whose invoice may not have reached MarginEdge</div><div class="tw"><table class="t"><tr>'+locTh()+'<th>Vendor</th><th>Last invoice</th><th class="r">Days ago</th><th class="r">Usually every</th><th class="r">Typical invoice</th></tr>'
      +q.slice(0,15).map(function(r){return '<tr>'+locTd(r[0])+'<td class="n">'+esc(r[1])+'</td><td>'+fdate(r[2])+'</td><td class="r" style="color:var(--bad);font-weight:700">'+fn(r[3])+'</td><td class="r">'+fn(r[4])+' days</td><td class="r">'+fm(r[6])+'</td></tr>';}).join('')+'</table></div>'
    :'<div class="hint" style="margin-top:12px">No regular vendor has gone quiet.</div>';
  return panel('Invoice health — last 10 weeks','How long after the invoice date an invoice is entered, and who has stopped invoicing',
    t+qt+notice('Until a late invoice is entered, that week\'s purchases and cost of goods read low and then jump. A vendor counts as regular with five or more invoice dates in ten weeks and a typical gap of ten days or less; it is quiet when the gap since its last invoice date is more than double that, plus three days, plus this taproom\'s own slowest-tenth entry time — so a vendor is not called quiet just because last week\'s paper has not been keyed yet.'));
}

/* ---------- MarginEdge: how concentrated the spend is ---------- */
function vendorSharePanel(){
  var rows=locIds().map(function(l){ var v=((D.vendors||{})[l]||[]).slice().sort(function(a,b){return b[1]-a[1];}); var tot=v.reduce(function(p,c){return p+(c[1]||0);},0);
    if(!tot) return null; var top3=v.slice(0,3); return [l,tot,top3,top3.reduce(function(p,c){return p+c[1];},0)/tot]; }).filter(Boolean);
  if(!rows.length) return '';
  return panel('Vendor concentration — last 28 days','How much of the spend sits with the three largest vendors',
    '<div class="tw"><table class="t"><tr><th>Taproom</th><th class="r">Invoiced</th><th class="r">Top three share</th><th>Largest vendors</th></tr>'
    +rows.map(function(r){return '<tr><td class="n">'+esc(locName(r[0]))+'</td><td class="r">'+fm(r[1])+'</td><td class="r">'+fp(r[3],0)+'</td><td>'+r[2].map(function(v){return esc(v[0])+' <span class="tg">'+fp(v[1]/r[1],0)+'</span>';}).join(' · ')+'</td></tr>';}).join('')+'</table></div>'
    +notice('Of the 25 largest vendors by invoice total. Credits by vendor are in Invoice hygiene above.'));
}
