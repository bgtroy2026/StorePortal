<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Grove Brewery — Store Director Portal</title>
<style>
:root{
  --navy:#1b2449;--green:#94bb36;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --surface:#ffffff;--plane:#f4f5f8;--border:rgba(11,11,11,.10);--good:#006300;--bad:#d03b3b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--sx:#9a9a94;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Brandon Grotesque','Josefin Sans','Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;background:var(--plane);color:var(--ink);font-size:14px}
button{font-family:inherit}
/* ---------- login shell ---------- */
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:50}
.card{background:#fff;border-radius:14px;padding:38px 42px;width:min(400px,calc(100vw - 40px));box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.card h1{font-size:19px;color:var(--navy);margin-bottom:4px}
.card .sub{font-size:12.5px;color:#6b7288;margin-bottom:24px}
#gbtn{display:flex;justify-content:center;min-height:44px}
#status{font-size:13px;color:#6b7288;margin-top:16px;min-height:18px;font-weight:600}
#err{color:#c0392b;font-size:12.5px;margin-top:8px;min-height:16px;font-weight:600}
.foot{margin-top:20px;font-size:10.5px;color:#9aa3c0;text-transform:uppercase;letter-spacing:.1em}
.stamp{margin-top:7px;font-size:11px;color:var(--green);font-weight:600}
.bar{height:5px;border-radius:3px;background:#e0e2ea;margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0%;background:var(--green);transition:width .2s}
/* ---------- app ---------- */
#app{display:none;min-height:100%}
header{background:var(--navy);color:#fff;padding:0 18px;display:flex;align-items:center;gap:14px;height:54px;position:sticky;top:0;z-index:10}
header .brand{font-weight:700;letter-spacing:.02em;font-size:15px}
header .brand span{color:var(--green)}
header nav{display:flex;gap:2px;margin-left:10px;overflow-x:auto}
header nav button{background:transparent;border:0;color:#c9cfe3;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
header nav button.on{background:rgba(255,255,255,.12);color:#fff}
header .who{margin-left:auto;font-size:12px;color:#c9cfe3;white-space:nowrap}
header .who b{color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.filters label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.filters select,.filters input[type=date]{border:1px solid var(--border);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;background:#fff}
.filters .fresh{margin-left:auto;font-size:11.5px;color:var(--muted)}
main{padding:16px 18px 40px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .v{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;line-height:1.1}
.tile .d{font-size:12px;color:var(--ink2);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.tile .d .up{color:var(--good);font-weight:700}.tile .d .dn{color:var(--bad);font-weight:700}
.tile .d .tg{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0;overflow-x:auto}
.panel h3{font-size:13px;color:var(--navy);margin-bottom:2px}
.panel .hint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.panel .cw{position:relative;height:260px}
.panel .cw.tall{height:340px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--grid);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f6;white-space:nowrap}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t td.n{font-weight:700;color:var(--navy)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:44px repeat(14,1fr);gap:2px;font-size:11px}
.heat .h{color:var(--muted);text-align:center;padding:2px 0}
.heat .c{height:26px;border-radius:4px;position:relative}
.heat .c:hover::after{content:attr(data-t);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:4px 7px;border-radius:6px;white-space:nowrap;font-size:11px;z-index:5}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef0f6;color:var(--navy)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px}
.tt{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:6px 9px;border-radius:7px;font-size:11.5px;white-space:nowrap;display:none;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (max-width:720px){header{height:auto;flex-wrap:wrap;padding:8px 12px}header .who{display:none}.panel .cw{height:220px}.cols2,.cols3{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>

<div id="login">
 <div class="card">
  <h1>Big Grove Brewery</h1>
  <div class="sub">Store Director Portal — sign in with your company Google account</div>
  <div id="gbtn"></div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div id="status"></div>
  <div id="err"></div>
  <div class="foot">Authorized personnel only</div>
  <div class="stamp" id="stamp"></div>
 </div>
</div>

<div id="app">
 <header>
  <div class="brand">BIG GROVE <span>STORE DIRECTOR PORTAL</span></div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
 </header>
 <div class="filters">
  <label>Location</label><select id="locSel"></select>
  <label>Range</label>
  <div class="seg" id="rangeSeg"></div>
  <input type="date" id="d0"> <span style="color:var(--muted)">to</span> <input type="date" id="d1">
  <label>Compare</label>
  <div class="seg" id="cmpSeg"><button data-c="prior" class="on">Prior period</button><button data-c="ly">Last year</button></div>
  <div class="fresh" id="fresh"></div>
 </div>
 <main id="main"></main>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script>
/* =========================================================================================
   LOGIN SHELL — same protocol as the Sales Portal: Google ID token -> Apps Script -> bundle keys
   ========================================================================================= */
var CFG = {
  CLIENT_ID: 'PASTE_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com',
  API_URL:   'PASTE_APPS_SCRIPT_WEB_APP_EXEC_URL'
};
function $(id){return document.getElementById(id);}
function setStatus(t){$('status').textContent=t;}
function setErr(t){$('err').textContent=t;setStatus('');$('bar').style.display='none';}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function fetchBin(name,pct0,pct1){
  var r=await fetch(name,{cache:'no-store'}); if(!r.ok) throw new Error(name+' HTTP '+r.status);
  var len=+r.headers.get('Content-Length')||0,got=0,chunks=[],rd=r.body.getReader();
  for(;;){var c=await rd.read();if(c.done)break;chunks.push(c.value);got+=c.value.length;if(len)$('barfill').style.width=(pct0+(pct1-pct0)*(got/len))+'%';}
  var buf=new Uint8Array(got),o=0;for(var i=0;i<chunks.length;i++){buf.set(chunks[i],o);o+=chunks[i].length;}return buf;
}
async function decrypt(buf,keyB64){
  var key=await crypto.subtle.importKey('raw',ub64(keyB64),'AES-GCM',false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12)));
}
async function gunzipText(u8){
  if(typeof DecompressionStream!=='undefined'){return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
  await new Promise(function(res,rej){var s=document.createElement('script');s.src='vendor/pako.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  return pako.ungzip(u8,{to:'string'});
}
/* auth = {ok, profile:{email,name,role,locations}, bundles:[{label,id,key}], sid} */
async function boot(auth){
  try{ if(auth.sid) navigator.sendBeacon(CFG.API_URL, JSON.stringify({a:'ping',s:auth.sid})); }catch(e){}
  $('bar').style.display='block'; setStatus('Loading portal data…');
  var b=auth.bundles[0]; // 'all' for leadership/admin, else the director's own location; multi-location directors get 'all' scoped by roster
  var buf=await fetchBin('data/'+b.id+'.bin',0,85);
  setStatus('Decrypting…');
  var data=JSON.parse(await gunzipText(await decrypt(buf,b.key)));
  if(auth.profile.locations && auth.profile.locations!=='all'){
    var allow=String(auth.profile.locations).split(',').map(function(s){return s.trim();});
    data.locations=data.locations.filter(function(l){return allow.indexOf(l.id)>=0;});
  }
  $('barfill').style.width='100%';
  startApp(data, auth.profile);
}
async function onCred(resp){
  var j;
  try{
    setStatus('Checking access…'); $('err').textContent='';
    var r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'signin',t:resp.credential})});
    j=await r.json();
    if(!j.ok){ setErr(j.error==='not on the roster'?'Your account is not on the portal roster — ask Troy to add you.':('Sign-in refused: '+(j.error||'unknown'))); return; }
    try{ sessionStorage.setItem('sdp_auth',JSON.stringify(j)); }catch(e){}
  }catch(e){ setErr('Could not reach the sign-in service. '+e.message); return; }
  try{ await boot(j); }catch(e){ try{sessionStorage.removeItem('sdp_auth');}catch(_){} setErr('Signed in OK, but the portal data failed to load — refresh and try again. ('+e.message+')'); }
}
var gsiOK=false;
function gsiFail(){ if(gsiOK||$('gbtn').firstChild)return; setErr('The Google sign-in button could not load. Open the portal directly in Chrome or Safari (not inside Gmail/Outlook/Messages) and try again.'); }
function initGsi(){
  if(CFG.CLIENT_ID.indexOf('PASTE_')===0||CFG.API_URL.indexOf('PASTE_')===0){ setErr('Setup incomplete: CLIENT_ID / API_URL not configured yet (see docs/SETUP.md).'); return; }
  google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:onCred,auto_select:false});
  google.accounts.id.renderButton($('gbtn'),{theme:'filled_blue',size:'large',shape:'pill',width:280});
  gsiOK=true;
}
window.addEventListener('load',function(){
  fetch('data/manifest.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(m){ $('stamp').textContent='Data through '+m.through; }).catch(function(){});
  if(/[?&]dev=1/.test(location.search)){ // local preview of an unencrypted build (python -m sdp build --no-encrypt)
    fetch('data/dev.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ startApp(d,{name:'Dev preview',role:'Admin',email:''}); }).catch(function(e){ setErr('dev.json not found — run: python -m sdp build --no-encrypt'); });
    return;
  }
  try{ var s=sessionStorage.getItem('sdp_auth'); if(s){ boot(JSON.parse(s)).catch(function(e){ try{sessionStorage.removeItem('sdp_auth');}catch(_){} setErr('Session reload failed — sign in again. '+e.message); }); return; } }catch(e){}
  setTimeout(gsiFail,6000);
});
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGsi()" onerror="gsiFail()"></script>

<script>
/* =========================================================================================
   DASHBOARD APP
   ========================================================================================= */
var D=null, P=null, S={loc:'all', preset:'l28', d0:null, d1:null, cmp:'prior', page:'overview'};
var K=null; // daily key index
var BUCKETS=[['Food','f','pf','s1'],['Beer','b','pb','s2'],['Liquor','l','pl','s3'],['Wine','w','pw','s4'],['NA Bev','n','pn','s5'],['Retail','r',null,'s6'],['Other','x','po','sx']];
var LOCCOL=['s1','s2','s3','s4','s5','s6','s7','s8'];
var PAGES=[['overview','Overview'],['sales','Sales'],['labor','Labor'],['cogs','COGS & Purchasing'],['inventory','Inventory'],['activations','Activations'],['locations','Locations']];
var charts=[];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim();}
function fm(n,d){ if(n==null||isNaN(n))return '—'; d=d==null?0:d; return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fk(n){ if(n==null||isNaN(n))return '—'; return Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?'$'+(n/1e3).toFixed(1)+'k':fm(n); }
function fn(n,d){ if(n==null||isNaN(n))return '—'; return Number(n).toLocaleString(undefined,{maximumFractionDigits:d||0}); }
function fp(x,d){ if(x==null||isNaN(x)||!isFinite(x))return '—'; return (x*100).toFixed(d==null?1:d)+'%'; }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function dow(s){return pd(s).getDay();}
function fdate(s){return pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});}

function startApp(data,profile){
  D=data; P=profile; K={}; D.meta.daily_keys.forEach(function(k,i){K[k]=i;});
  $('login').style.display='none'; $('app').style.display='block';
  $('who').innerHTML='<b>'+esc(P.name||P.email)+'</b> · '+esc(P.role||'');
  $('fresh').textContent='Data through '+fdate(D.meta.through)+' · built '+new Date(D.meta.built_at).toLocaleString();
  var ls=$('locSel'); ls.innerHTML='';
  if(D.locations.length>1) ls.appendChild(new Option('All locations','all'));
  D.locations.forEach(function(l){ls.appendChild(new Option(l.name,l.id));});
  S.loc=D.locations.length>1?'all':D.locations[0].id; ls.value=S.loc;
  ls.onchange=function(){S.loc=ls.value;render();};
  var seg=$('rangeSeg'); [['l7','Last 7'],['l28','Last 28'],['mtd','MTD'],['qtd','QTD'],['ytd','YTD'],['l91','Last 91']].forEach(function(p){
    var b=document.createElement('button');b.textContent=p[1];b.dataset.p=p[0];b.onclick=function(){S.preset=p[0];applyPreset();render();};seg.appendChild(b);});
  $('d0').onchange=$('d1').onchange=function(){S.preset='custom';S.d0=$('d0').value;S.d1=$('d1').value;render();};
  $('cmpSeg').querySelectorAll('button').forEach(function(b){b.onclick=function(){S.cmp=b.dataset.c;render();};});
  var nav=$('nav'); PAGES.forEach(function(p){var b=document.createElement('button');b.textContent=p[1];b.dataset.p=p[0];b.onclick=function(){S.page=p[0];render();};nav.appendChild(b);});
  applyPreset(); render();
}
function applyPreset(){
  var T=D.meta.through, t=pd(T);
  var map={l7:addDays(T,-6),l28:addDays(T,-27),l91:addDays(T,-90),mtd:ds(new Date(t.getFullYear(),t.getMonth(),1)),qtd:ds(new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1)),ytd:ds(new Date(t.getFullYear(),0,1))};
  if(map[S.preset]){S.d0=map[S.preset];S.d1=T;}
  $('d0').value=S.d0;$('d1').value=S.d1;
}
/* ---- data access ---- */
function locIds(){return S.loc==='all'?D.locations.map(function(l){return l.id;}):[S.loc];}
function rowsIn(lid,a,b){ return (D.daily[lid]||[]).filter(function(r){return r[0]>=a&&r[0]<=b;}); }
function sumRows(rows){ var s={}; D.meta.daily_keys.forEach(function(k){if(k!=='d')s[k]=0;}); rows.forEach(function(r){D.meta.daily_keys.forEach(function(k,i){if(k!=='d')s[k]+=(r[i]||0);});}); s.days=rows.length; return s; }
function agg(a,b){ var all=[]; locIds().forEach(function(l){all=all.concat(rowsIn(l,a,b));}); return sumRows(all); }
function byDate(a,b){ var m={}; locIds().forEach(function(l){rowsIn(l,a,b).forEach(function(r){var o=m[r[0]]||(m[r[0]]={});D.meta.daily_keys.forEach(function(k,i){if(k!=='d')o[k]=(o[k]||0)+(r[i]||0);});});}); return Object.keys(m).sort().map(function(d){m[d].d=d;return m[d];}); }
function cmpWindow(){ var n=(pd(S.d1)-pd(S.d0))/864e5+1; if(S.cmp==='ly'){var a=pd(S.d0),b=pd(S.d1);a.setFullYear(a.getFullYear()-1);b.setFullYear(b.getFullYear()-1);return [ds(a),ds(b)];} return [addDays(S.d0,-n),addDays(S.d0,-1)]; }
function hasData(a,b){ return locIds().some(function(l){return rowsIn(l,a,b).length>0;}); }
function targetsFor(a,b){ // sum monthly targets prorated by days in range
  var t={sales:0,guests:0,cogs:[],labor:[]}; locIds().forEach(function(l){ var tg=D.targets[l]||{}; var d=pd(a); while(ds(d)<=b){ var m=ds(d).slice(0,7); var x=tg[m]; if(x){ var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); t.sales+=(x[0]||0)/dim; t.guests+=(x[3]||0)/dim; if(x[1])t.cogs.push(x[1]); if(x[2])t.labor.push(x[2]); } d.setDate(d.getDate()+1);} });
  var avg=function(z){return z.length?z.reduce(function(p,c){return p+c;},0)/z.length:null;}; t.cogs=avg(t.cogs); t.labor=avg(t.labor); return t; }
function kpis(a,b){ var s=agg(a,b); return {net:s.net,gross:s.gross,disc:s.disc,guests:s.guests,orders:s.orders,checks:s.checks,avgCheck:s.checks?s.net/s.checks:null,ppa:s.guests?s.net/s.guests:null,
  labor:s.lc,laborPct:s.net?s.lc/s.net:null,hours:s.lh,splh:s.lh?s.net/s.lh:null,purch:s.p,purchPct:s.net?s.p/s.net:null,tips:s.tips,ref:s.ref,days:s.days,
  food:s.f,beer:s.b,liquor:s.l,wine:s.w,nabev:s.n,retail:s.r,other:s.x,pf:s.pf,pb:s.pb,pl:s.pl,pw:s.pw,pn:s.pn,po:s.po}; }

/* ---- rendering helpers ---- */
function wkLabel(w,o){return 'wk '+fdate(w)+((o&&o._n&&o._n<7)?' (partial)':'');}
function killCharts(){charts.forEach(function(c){try{c.destroy();}catch(e){}});charts=[];}
function delta(cur,prev,inv){ if(cur==null||prev==null||!prev)return '<span class="tg">no comparison</span>'; var d=(cur-prev)/Math.abs(prev); var up=d>=0; var good=inv?!up:up; return '<span class="'+(good?'up':'dn')+'">'+(up?'▲':'▼')+' '+fp(Math.abs(d),1)+'</span><span class="tg">vs '+(S.cmp==='ly'?'LY':'prior')+'</span>'; }
function tile(label,val,dl,extra){ return '<div class="tile"><div class="l">'+label+'</div><div class="v">'+val+'</div><div class="d">'+(dl||'')+(extra||'')+'</div></div>'; }
function panel(title,hint,body,cls){ return '<div class="panel '+(cls||'')+'"><h3>'+title+'</h3><div class="hint">'+(hint||'')+'</div>'+body+'</div>'; }
function chartBox(id,tall){ return '<div class="cw'+(tall?' tall':'')+'"><canvas id="'+id+'"></canvas></div>'; }
if(window.Chart){Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.color=css('ink2'); Chart.defaults.borderColor=css('grid');}
var baseOpts=function(o){ return Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:css('navy'),titleFont:{weight:'700'},padding:8,callbacks:{label:function(c){var v=c.parsed.y!=null?c.parsed.y:c.parsed;return ' '+c.dataset.label+': '+(c.dataset.fmt==='pct'?fp(v):c.dataset.fmt==='int'?fn(v):fm(v));}}}},
  scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:10}},y:{beginAtZero:true,grid:{color:css('grid')},border:{display:false},ticks:{callback:function(v){return fk(v);}}}}},o||{}); };
function mk(id,cfg){ if(!window.Chart){$(id).parentNode.innerHTML='<div class="empty">Chart library failed to load.</div>';return null;} var c=new Chart($(id).getContext('2d'),cfg); charts.push(c); return c; }

      '<table class="t"><tr><th>Category</th><th class="r">Begin</th><th class="r">Purchases</th><th class="r">End</th><th class="r">Usage</th><th class="r">Sales</th><th class="r">Actual cost %</th><th class="r">Wks on hand</th></tr>'
      +inv.map(function(r){var days=r.prev_date?(pd(r.date)-pd(r.prev_date))/864e5:null;var woh=(r.usage&&days)?r.value/(r.usage/days*7):null;var bk=BUCKETS.filter(function(z){return z[0]===r.bucket;})[0];
        return '<tr><td class="n"><i class="sw" style="background:'+css(bk?bk[3]:'sx')+'"></i>'+esc(r.bucket)+'</td><td class="r">'+fm(r.prev_value)+'</td><td class="r">'+fm(r.purchases)+'</td><td class="r">'+fm(r.value)+'</td><td class="r">'+fm(r.usage)+'</td><td class="r">'+fm(r.sales)+'</td><td class="r">'+fp(r.sales?r.usage/r.sales:null)+'</td><td class="r">'+(woh!=null?woh.toFixed(1):'—')+'</td></tr>';}).join('')+'</table>');
  });
  m.innerHTML=h+'</div>';
}

function pgActivations(m){
  var acts=D.activations.filter(function(x){return locIds().indexOf(x.loc)>=0;}).sort(function(x,y){return y.s<x.s?-1:1;});
  if(!acts.length){m.innerHTML='<div class="panel"><div class="empty">No activations recorded — add rows to inputs/activations.csv.</div></div>';return;}
  var rows=acts.map(function(x){
    var e=x.e||x.s, n=(pd(e)-pd(x.s))/864e5+1;
    var ev=sumRows(rowsIn(x.loc,x.s,e)); // baseline: same weekdays over the previous 4 weeks
    var base=0,bn=0; for(var w=1;w<=4;w++){var r=sumRows(rowsIn(x.loc,addDays(x.s,-7*w),addDays(e,-7*w)));if(r.days){base+=r.net;bn++;}}
    var baseline=bn?base/bn:null, lift=baseline!=null?ev.net-baseline:null, loc=D.locations.filter(function(z){return z.id===x.loc;})[0];
    return {x:x,loc:loc?loc.name:x.loc,days:n,net:ev.net,guests:ev.guests,baseline:baseline,lift:lift,roi:(lift!=null&&x.cost)?lift/x.cost:null};
  });
  var tc=rows.reduce(function(p,c){return p+(c.x.cost||0);},0), tl=rows.reduce(function(p,c){return p+(c.lift||0);},0);
  m.innerHTML='<div class="grid tiles">'+tile('Activations',fn(rows.length),'')+tile('Total cost',fk(tc),'')+tile('Est. sales lift',fk(tl),'<span class="tg">vs 4-week same-weekday baseline</span>')+tile('Lift ÷ cost',tc?(tl/tc).toFixed(1)+'×':'—','')+'</div>'
    +'<div class="panel" style="margin-top:14px"><h3>Activation log</h3><div class="hint">Lift = net sales on activation days minus the average of the same weekdays in the prior 4 weeks. Edit inputs/activations.csv to add or correct entries.</div>'
    +'<div style="overflow-x:auto"><table class="t"><tr><th>Date</th><th>Location</th><th>Activation</th><th>Type</th><th>Owner</th><th class="r">Cost</th><th class="r">Net sales</th><th class="r">Baseline</th><th class="r">Lift</th><th class="r">Lift ÷ cost</th><th>Notes</th></tr>'
    +rows.map(function(r){return '<tr><td>'+fdate(r.x.s)+(r.days>1?'–'+fdate(r.x.e):'')+'</td><td>'+esc(r.loc)+'</td><td class="n">'+esc(r.x.name)+'</td><td><span class="pill">'+esc(r.x.type||'')+'</span></td><td>'+esc(r.x.owner||'')+'</td><td class="r">'+fm(r.x.cost)+'</td><td class="r">'+fm(r.net)+'</td><td class="r">'+fm(r.baseline)+'</td><td class="r" style="color:'+(r.lift>=0?'var(--good)':'var(--bad)')+';font-weight:700">'+(r.lift!=null?(r.lift>=0?'+':'')+fm(r.lift):'—')+'</td><td class="r">'+(r.roi!=null?r.roi.toFixed(1)+'×':'—')+'</td><td style="white-space:normal;max-width:260px">'+esc(r.x.notes||'')+'</td></tr>';}).join('')+'</table></div></div>';
}

function pgLocations(m){
  var a=S.d0,b=S.d1,cw=cmpWindow();
  var rows=D.locations.map(function(l){ var s=sumRows(rowsIn(l.id,a,b)), p=sumRows(rowsIn(l.id,cw[0],cw[1])); return {l:l,s:s,p:p}; });
  m.innerHTML='<div class="panel"><h3>Location scorecard</h3><div class="hint">All locations for the selected range; change vs '+(S.cmp==='ly'?'last year':'prior period')+'</div><div style="overflow-x:auto"><table class="t"><tr><th>Location</th><th class="r">Net sales</th><th class="r">Δ</th><th class="r">Guests</th><th class="r">Avg check</th><th class="r">PPA</th><th class="r">Labor %</th><th class="r">Purch %</th><th class="r">SPLH</th><th class="r">Discounts</th></tr>'
    +rows.map(function(r,i){var s=r.s,p=r.p;var d=p.net?(s.net-p.net)/p.net:null;return '<tr><td class="n"><i class="sw" style="background:'+css(LOCCOL[i%8])+'"></i>'+esc(r.l.name)+'</td><td class="r">'+fm(s.net)+'</td><td class="r" style="color:'+(d>=0?'var(--good)':'var(--bad)')+';font-weight:700">'+(d!=null?(d>=0?'+':'')+fp(d):'—')+'</td><td class="r">'+fn(s.guests)+'</td><td class="r">'+fm(s.checks?s.net/s.checks:null,2)+'</td><td class="r">'+fm(s.guests?s.net/s.guests:null,2)+'</td><td class="r">'+fp(s.net?s.lc/s.net:null)+'</td><td class="r">'+fp(s.net?s.p/s.net:null)+'</td><td class="r">'+fm(s.lh?s.net/s.lh:null,0)+'</td><td class="r">'+fm(s.disc)+'</td></tr>';}).join('')+'</table></div></div>'
    +'<div class="grid cols2" style="margin-top:14px">'+panel('Net sales by week by location','',chartBox('c_locs',true))+panel('Labor % by week by location','',chartBox('c_loclab',true))+'</div>';
  var wkAll={}; D.locations.forEach(function(l){rowsIn(l.id,a,b).forEach(function(r){var d=pd(r[0]);d.setDate(d.getDate()-((d.getDay()+6)%7));var w=ds(d);var o=wkAll[w]||(wkAll[w]={_n:0});if(l.id===D.locations[0].id)o._n++;var q=o[l.id]||(o[l.id]={net:0,lc:0});q.net+=r[K.net];q.lc+=r[K.lc];});});
  var wks=Object.keys(wkAll).sort();
  var c1=lineCfg(wks.map(function(w){return wkLabel(w,wkAll[w]);}),D.locations.map(function(l,i){return {label:l.name,data:wks.map(function(w){return wkAll[w][l.id]?wkAll[w][l.id].net:null;}),borderColor:css(LOCCOL[i%8])};})); c1.options.plugins.legend={display:true,position:'bottom'}; mk('c_locs',c1);
  var c2=lineCfg(wks.map(function(w){return wkLabel(w,wkAll[w]);}),D.locations.map(function(l,i){return {label:l.name,data:wks.map(function(w){var q=wkAll[w][l.id];return q&&q.net?q.lc/q.net:null;}),borderColor:css(LOCCOL[i%8]),fmt:'pct'};})); c2.options.plugins.legend={display:true,position:'bottom'}; c2.options.scales.y.ticks.callback=function(v){return fp(v,0);}; mk('c_loclab',c2);
}
</script>
